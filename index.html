function preferredCardSize(appId,w,h){
  const info=appById(appId);
  if(info?.kind!=="tool")return {w,h};
  const sizes={image:{w:420,h:330},text:{w:380,h:300},table:{w:380,h:300},date:{w:360,h:260},json:{w:380,h:300}};
  const size=sizes[appId]||{w:360,h:260};
  return {w:Math.max(w||0,size.w),h:Math.max(h||0,size.h)};
}
function seedCards(key){return (seeds[key]||[]).map(([appId,x,y,w,h],i)=>{const size=preferredCardSize(appId,w,h);return {id:key+"-"+appId+"-"+i,appId,x,y,w:size.w,h:size.h,collapsed:false,data:{}}})}

function loadWorkspaces(){
  try{
    const raw=localStorage.getItem(storeKey)||legacyKeys.map(k=>localStorage.getItem(k)).find(Boolean)||"[]";
    const saved=JSON.parse(raw);
    if(Array.isArray(saved)&&saved.length)return saved.map(normalizeWorkspace);
  }catch(e){}
  return clone(defaults);
}
function normalizeWorkspace(ws){
  if(!Array.isArray(ws.cards)&&Array.isArray(ws.toolIds))ws.cards=ws.toolIds.map((id,i)=>({id:ws.id+"-"+id+"-"+i,appId:id,x:64+(i%3)*316,y:72+Math.floor(i/3)*170,w:300,h:148,collapsed:false,data:{}}));
  // Persist every user-created or dynamically registered card.
  // Some widgets register after the core workspace loader runs; filtering by the
  // current apps[] list here caused valid saved cards to disappear on refresh.
  // Custom cards were also incorrectly discarded by the old !card.custom test.
  ws.cards=(Array.isArray(ws.cards)?ws.cards:[]).filter(card=>card&&(card.custom||card.appId||card.toolId)).map((card,i)=>{
    const next={id:card.id||"card-"+Date.now()+"-"+i,appId:card.appId||card.toolId||"note",x:card.x||72,y:card.y||72,w:card.w||300,h:card.h||148,collapsed:!!card.collapsed,custom:card.custom,title:card.title,desc:card.desc,href:card.href,icon:card.icon,tone:card.tone,data:card.data||{}};
    if(next.appId==="weather"&&next.w<=390&&next.h<=270){
      next.w=430;
      next.h=420;
    }
    if(appById(next.appId)?.kind==="tool"){
      next.w=Math.max(280,next.w);
      next.h=Math.max(220,next.h);
    }
    return next;
  });
  return ws;
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function labelHtml(value){return '<span data-i18n="'+escapeHtml(value)+'">'+escapeHtml(tr(value))+'</span>'}
function extractUrls(text){
  const matches=String(text||"").match(/((?:https?:\/\/|www\.)[^\s<>"']+|(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}(?:\/[^\s<>"']*)?)/gi)||[];
  const seen=new Set();
  return matches.map(url=>url.replace(/[),.;:!?，。！？）】》]+$/,"")).filter(url=>{
    if(!url||seen.has(url))return false;
    seen.add(url);
    return true;
  });
}
function memoLinksHtml(text){
  const urls=extractUrls(text);
  if(!urls.length)return '<div class="memo-link-empty" data-i18n="未識別到網址">'+escapeHtml(tr("未識別到網址"))+'</div>';
  return '<strong>'+labelHtml("識別到的網址")+'</strong>'+urls.map(url=>{
    const target=normalizeExternalUrl(url);
    return '<a href="'+escapeHtml(target)+'" target="_blank" rel="noopener noreferrer" title="'+escapeHtml(target)+'">'+escapeHtml(url)+'</a>';
  }).join("");
}

  document.querySelectorAll(".workspace-item").forEach(btn=>btn.onclick=()=>{activeId=btn.dataset.id;localStorage.setItem(activeKey,activeId);renderAll()});
}
function renderShelf(){

function bodyHtml(card,info){
  if(info.kind==="tool")return '<div class="inline-tool" data-inline-app="'+escapeHtml(card.appId)+'">'+appContent(card.appId)+'</div>';
  if(card.custom)return "";
  const data=card.data||{};
  if(card.appId==="note")return '<textarea class="widget-input" data-field="note" placeholder="'+escapeHtml(tr("在這裡記錄"))+'">'+escapeHtml(data.note||"")+'</textarea>';
  if(card.appId==="todo")return '<div class="todo-list">'+(data.items||[]).map((x,i)=>'<label><input type="checkbox" data-todo="'+i+'" '+(x.done?'checked':'')+'><span>'+escapeHtml(x.text)+'</span><button type="button" data-del="'+i+'">×</button></label>').join("")+'</div><form class="todo-form"><input placeholder="'+escapeHtml(tr("新增待辦"))+'"><button type="submit">＋</button></form>';
  if(card.appId==="clock")return '<div class="clock-widget"><strong data-clock></strong><span data-date></span></div>';
  if(card.appId==="calc")return '<div class="calc-widget"><input data-field="expr" placeholder="12*(3+4)" value="'+escapeHtml(data.expr||"")+'"><output>'+escapeHtml(calc(data.expr||""))+'</output></div>';
  if(card.appId==="color")return '<div class="color-widget"><input type="color" data-field="color" value="'+escapeHtml(data.color||"#ff8a00")+'"><code>'+escapeHtml(data.color||"#ff8a00")+'</code><button type="button" data-copy-color data-i18n="複製">複製</button></div>';
  if(card.appId==="link")return '<div class="link-widget"><input data-field="label" placeholder="'+escapeHtml(tr("名稱"))+'" value="'+escapeHtml(data.label||"GitHub")+'"><input data-field="url" placeholder="https://..." value="'+escapeHtml(data.url||"https://github.com/windzxy")+'"><button type="button" data-open-url="'+escapeHtml(data.url||"https://github.com/windzxy")+'" data-open-title="'+escapeHtml(data.label||"快速連結")+'" data-i18n="新分頁打開">新分頁打開</button></div>';
  if(card.appId==="memo")return '<textarea class="widget-input mono" data-field="memo" placeholder="'+escapeHtml(tr("常用文字、命令或片段"))+'">'+escapeHtml(data.memo||"")+'</textarea><div class="memo-links" data-memo-links>'+memoLinksHtml(data.memo||"")+'</div>';
  if(card.appId==="weather")return weatherHtml(card);
  return '<p class="card-desc">'+escapeHtml(tr(info.desc||""))+'</p>';
}
function weatherHtml(card){
  const data=card.data||{};
  const days=visibleWeatherDays(card);
  const weather=data.weather||null;
  const status=data.weatherStatus||(!weather?tr("正在載入天氣…"):"");
  const place=tr(data.weatherName||"新加坡");
  const current=weather?.current||null;
  const list=(weather?.days||[]).slice(0,days);
  const currentHtml=current?'<div class="weather-current"><div class="weather-main"><span class="weather-icon">'+weatherIcon(current.code,current.isDay)+'</span><div><strong>'+Math.round(current.temp)+'°</strong><small>'+escapeHtml(weatherText(current.code))+'</small></div></div><div class="weather-meta"><span>'+escapeHtml(tr("體感"))+' '+Math.round(current.feels)+'°</span><span>'+escapeHtml(tr("濕度"))+' '+Math.round(current.humidity)+'%</span><span>'+escapeHtml(tr("風速"))+' '+Math.round(current.wind)+' km/h</span></div></div>':'<div class="weather-empty">'+escapeHtml(status)+'</div>';
  const daysHtml=list.length?'<div class="weather-days" data-visible-days="'+days+'">'+list.map(day=>'<div class="weather-day '+weatherDayClass(day.date)+'"><span>'+escapeHtml(formatWeatherDate(day.date))+'</span><b>'+weatherIcon(day.code,true)+'</b><strong>'+Math.round(day.max)+'° / '+Math.round(day.min)+'°</strong><small>'+escapeHtml((day.pop ?? 0)+"%")+'</small></div>').join("")+'</div>':'';
  const total=weather?.days?.length||16;
  const countText=weather?tr("顯示")+" "+Math.min(days,total)+"/"+total+" "+tr("天"):"";
  return '<div class="weather-widget"><form class="weather-search"><input data-field="weatherQuery" value="'+escapeHtml(data.weatherQuery||place)+'" placeholder="'+escapeHtml(tr("輸入城市"))+'"><button type="submit" data-i18n="搜尋">搜尋</button></form><div class="weather-head"><div><span data-i18n="天氣位置">天氣位置</span><strong>'+escapeHtml(place)+'</strong></div><button type="button" data-weather-locate data-i18n="定位">定位</button></div>'+currentHtml+daysHtml+'<div class="weather-foot"><span data-weather-status>'+escapeHtml(status||weather?.updated||"")+'</span><span class="weather-count">'+escapeHtml(countText)+'</span><button type="button" data-weather-refresh data-i18n="刷新">刷新</button></div></div>';
}
function visibleWeatherDays(card){
  const w=Number(card.w)||390;
  const h=Number(card.h)||270;
  const dataDays=card.data?.weather?.days?.length||16;
  const columns=w>=1080?4:w>=760?3:w>=500?2:1;
  const compact=w>=760;
  const reserved=compact?178:192;
  const rowHeight=compact?36:40;
  const rows=Math.max(1,Math.floor(Math.max(0,h-reserved)/rowHeight));
  return Math.max(1,Math.min(dataDays,rows*columns));
}
function weatherText(code){
  const map={0:"晴朗",1:"大致晴朗",2:"局部多雲",3:"多雲",45:"有霧",48:"霧凇",51:"小毛雨",53:"毛雨",55:"大毛雨",56:"凍毛雨",57:"凍毛雨",61:"小雨",63:"中雨",65:"大雨",66:"凍雨",67:"凍雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",80:"陣雨",81:"陣雨",82:"強陣雨",85:"陣雪",86:"強陣雪",95:"雷暴",96:"雷暴冰雹",99:"雷暴冰雹"};
  return tr(map[code]||"天氣");
}
function weatherIcon(code,isDay){
  if(code===0)return isDay?"☀":"☾";
  if([1,2].includes(code))return isDay?"⛅":"☁";
  if([3,45,48].includes(code))return "☁";
  if((code>=51&&code<=67)||(code>=80&&code<=82))return "☂";
  if((code>=71&&code<=77)||(code>=85&&code<=86))return "❄";
  if(code>=95)return "⚡";
  return "☁";
}
function formatWeatherDate(value){
  const date=new Date(value+"T00:00:00");
  const today=new Date();
  if(date.toDateString()===today.toDateString())return tr("今天");
  const datePart=new Intl.DateTimeFormat(undefined,{month:"numeric",day:"numeric"}).format(date);
  const weekday=new Intl.DateTimeFormat(undefined,{weekday:"short"}).format(date);
  return datePart+" "+weekday;
}
function isHolidayDate(value){
  const date=new Date(value+"T00:00:00");
  const md=String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
  return ["01-01","05-01","10-01","10-02","10-03","10-04","10-05","10-06","10-07","12-25"].includes(md);
}
function weatherDayClass(value){
  const date=new Date(value+"T00:00:00");
  const day=date.getDay();
  const classes=[];
  if(day===0||day===6)classes.push("is-weekend");
  if(isHolidayDate(value))classes.push("is-holiday");
  return classes.join(" ");
}

function bindCard(el){
  const id=el.dataset.cardId;
  el.querySelectorAll("button,a,input,textarea,select").forEach(control=>control.addEventListener("pointerdown",event=>event.stopPropagation()));
  el.querySelector(".card-remove").onclick=e=>{e.preventDefault();e.stopPropagation();removeCard(id)};
  el.querySelector(".card-fold").onclick=e=>{e.preventDefault();e.stopPropagation();toggleFold(id)};
  el.querySelector(".card-bar").onpointerdown=e=>startDrag(e,el,id);
  el.querySelector(".resize-grip").onpointerdown=e=>startResize(e,el,id);
  el.querySelectorAll("[data-open-app]").forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();openApp(btn.dataset.openApp,btn.dataset.openTitle||"工具",btn.dataset.openUrl||"")});
  el.querySelectorAll("[data-open-url]:not([data-open-app])").forEach(btn=>btn.onclick=e=>{e.preventDefault();e.stopPropagation();openExternalWindow(btn.dataset.openUrl||"",btn.dataset.openTitle||"快速連結")});
  el.querySelectorAll("[data-field]").forEach(input=>input.oninput=()=>updateData(id,input.dataset.field,input.value));
  el.querySelectorAll("[data-todo]").forEach(input=>input.onchange=()=>toggleTodo(id,+input.dataset.todo,input.checked));
  el.querySelectorAll("[data-del]").forEach(btn=>btn.onclick=()=>deleteTodo(id,+btn.dataset.del));
  const form=el.querySelector(".todo-form");
  if(form)form.onsubmit=e=>{e.preventDefault();const input=form.querySelector("input");addTodo(id,input.value);input.value=""};
  const copy=el.querySelector("[data-copy-color]");
  if(copy)copy.onclick=()=>navigator.clipboard?.writeText(el.querySelector('[data-field="color"]').value);
  const weatherForm=el.querySelector(".weather-search");
  if(weatherForm)weatherForm.onsubmit=e=>{e.preventDefault();searchWeather(id,weatherForm.querySelector("input").value)};
  el.querySelectorAll("[data-weather-refresh]").forEach(btn=>btn.onclick=()=>loadWeatherCard(id,{force:true}));
  el.querySelectorAll("[data-weather-locate]").forEach(btn=>btn.onclick=()=>locateWeather(id));
  const inline=el.querySelector("[data-inline-app]");
  if(inline)bindApp(el,inline.dataset.inlineApp);
}
function startDrag(e,el,id){
  if(e.button!==0)return;
  const item=activeWorkspace().cards.find(x=>x.id===id);
  if(!item)return;
  drag={el,item,startX:e.clientX,startY:e.clientY,origX:item.x||0,origY:item.y||0};
  el.setPointerCapture(e.pointerId);
  el.classList.add("is-dragging");
}
function startResize(e,el,id){
  if(e.button!==0)return;
  e.preventDefault();
  e.stopPropagation();
  const item=activeWorkspace().cards.find(x=>x.id===id);
  if(!item||item.collapsed)return;
  resize={el,item,startX:e.clientX,startY:e.clientY,origW:item.w||300,origH:item.h||150};
  el.setPointerCapture(e.pointerId);
  el.classList.add("is-resizing");
}
function openApp(appId,title,url){
  if(appId==="external")return openExternalWindow(url,title);
  const info=appById(appId);
  if(!info)return;
  const key="app-"+appId;
  let win=desktopWindows[key];
  if(win){
    win.classList.remove("is-minimized");
    win.style.zIndex=++topZ;
    return;
  }
  win=createWindow(key,info.title,appId==="image"?1440:980,appId==="image"?920:640);
  win.querySelector(".desktop-window-body").innerHTML=appContent(appId);
  bindApp(win,appId);
  $("desktopDrawer").classList.remove("is-open");
  if(window.applyI18n)window.applyI18n(win);
}
function openExternalWindow(url,title){
  if(!url)return;
  const target=normalizeExternalUrl(url);
  const opened=window.open(target,"_blank","noopener,noreferrer");
  if(opened)opened.opener=null;
}
function normalizeExternalUrl(url){
  const value=String(url||"").trim();
  if(!value)return "";
  if(/^(https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(value))return value;
  if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/i.test(value))return "https://"+value;
  return value;
}
function createWindow(key,title,w,h){
  const layer=$("windowLayer");
  const win=document.createElement("article");
  const isImageWindow=key==="app-image";
  win.className="desktop-window"+(isImageWindow?" desktop-window-image":"");
  win.style.left=(isImageWindow?12:80+Object.keys(desktopWindows).length*28)+"px";
  win.style.top=(isImageWindow?8:68+Object.keys(desktopWindows).length*24)+"px";
  win.style.width=isImageWindow?"min("+w+"px, calc(100vw - 24px))":"min("+w+"px, calc(100vw - 160px))";
  win.style.height=isImageWindow?"min("+h+"px, calc(100vh - 24px))":"min("+h+"px, calc(100vh - 150px))";
  win.style.zIndex=++topZ;
  win.dataset.key=key;
  win.innerHTML='<div class="window-bar"><span>'+escapeHtml(tr(title))+'</span><div><button type="button" data-window-min aria-label="'+escapeHtml(tr("最小化"))+'">—</button><button type="button" data-window-close aria-label="'+escapeHtml(tr("關閉"))+'">×</button></div></div><div class="desktop-window-body"></div><span class="window-resize"></span>';
  layer.appendChild(win);
  desktopWindows[key]=win;
  bindWindow(win);
  return win;
}

function bindApp(win,appId){
  if(appId==="image")bindImageApp(win);
  if(appId==="text")bindTextApp(win);
  if(appId==="table")bindTableApp(win);
  if(appId==="date")bindDateApp(win);
  if(appId==="json")bindJsonApp(win);
}
function bindImageApp(win){
  const file=win.querySelector("#imgFile"),src=win.querySelector("#imgOriginal"),canvas=win.querySelector("#imgCanvas"),sctx=src.getContext("2d"),ctx=canvas.getContext("2d",{willReadFrequently:true});
  let img=null,ow=0,oh=0,lock=false,drawQueued=false,currentName="image",pickedBg=null;
  const ids=id=>win.querySelector("#"+id);
  setImageReady(false);
  file.onchange=()=>loadImageFile(file.files?.[0]);
  win.querySelectorAll("[data-image-drop]").forEach(zone=>{
    zone.addEventListener("click",e=>{if(zone.tagName!=="LABEL"&&e.target!==file)file.click()});
    zone.addEventListener("dragover",e=>{e.preventDefault();zone.classList.add("is-dragover")});
    zone.addEventListener("dragleave",()=>zone.classList.remove("is-dragover"));
    zone.addEventListener("drop",e=>{e.preventDefault();zone.classList.remove("is-dragover");loadImageFile(e.dataTransfer?.files?.[0])});
  });
  win.addEventListener("paste",e=>{
    const pasted=[...(e.clipboardData?.items||[])].find(item=>item.type.startsWith("image/"));
    if(pasted)loadImageFile(pasted.getAsFile());
  });
  src.addEventListener("click",e=>{
    if(!img||ids("bgMode").value!=="pick")return;
    const rect=src.getBoundingClientRect();
    const x=Math.max(0,Math.min(ow-1,Math.floor((e.clientX-rect.left)*ow/rect.width)));
    const y=Math.max(0,Math.min(oh-1,Math.floor((e.clientY-rect.top)*oh/rect.height)));
    const d=sctx.getImageData(x,y,1,1).data;
    pickedBg=[d[0],d[1],d[2]];
    updateBgSample();
    scheduleDraw();
  });
  ids("imgW").oninput=()=>sync("w");ids("imgH").oninput=()=>sync("h");
  function loadImageFile(f){
    if(!f||!f.type?.startsWith("image/"))return;
    currentName=(f.name||"image").replace(/\.[^.]+$/,"")||"image";
    const url=URL.createObjectURL(f);
    const next=new Image();
    next.onload=()=>{
      img=next;ow=img.naturalWidth;oh=img.naturalHeight;
      src.width=ow;src.height=oh;sctx.clearRect(0,0,ow,oh);sctx.drawImage(img,0,0);
      pickedBg=null;
      ids("imgW").value=ow;ids("imgH").value=oh;ids("cropX").value=0;ids("cropY").value=0;ids("cropW").value=ow;ids("cropH").value=oh;ids("cropAspect").value="free";ids("cropAnchor").value="center";
      ids("imgInfo").textContent=currentName+" · "+ow+" × "+oh+" · "+Math.max(1,Math.round(f.size/1024))+" KB";
      ids("imgOriginalSize").textContent=ow+" × "+oh;
      ids("imgCropSize").textContent=ow+" × "+oh;
      updateCropReadout();
      updateBgSample();
      syncAnchorButtons();
      setImageReady(true);
      scheduleDraw();
      URL.revokeObjectURL(url);
    };
    next.onerror=()=>{ids("imgInfo").textContent=tr("圖片讀取失敗");URL.revokeObjectURL(url)};

  function setImageReady(ready){
    win.querySelector(".image-workbench")?.classList.toggle("has-image",ready);

    file.disabled=false;
  }
  function sync(source){if(!img||!ids("imgRatio").checked||lock)return;lock=true;if(source==="w")ids("imgH").value=Math.max(1,Math.round(+ids("imgW").value*oh/ow));if(source==="h")ids("imgW").value=Math.max(1,Math.round(+ids("imgH").value*ow/oh));lock=false;scheduleDraw()}
  win.querySelectorAll("[data-scale]").forEach(b=>b.onclick=()=>{if(!img)return;const n=+b.dataset.scale;setOutputSize(Math.round(ow*n),Math.round(oh*n))});
  win.querySelectorAll("[data-long]").forEach(b=>b.onclick=()=>{if(!img)return;const m=+b.dataset.long;const r=ow>=oh?m/ow:m/oh;setOutputSize(Math.round(ow*r),Math.round(oh*r))});
  function setOutputSize(w,h){ids("imgW").value=w;ids("imgH").value=h;scheduleDraw()}
  win.querySelectorAll("[data-crop-preset]").forEach(b=>b.onclick=()=>{if(!img)return;setCropPreset(b.dataset.cropPreset)});
  function setCropPreset(type){
    ids("cropAspect").value=type==="square"?"1:1":(type==="full"?"free":type);
    ids("cropAnchor").value="center";
    if(type==="full"){
      ids("cropX").value=0;ids("cropY").value=0;ids("cropW").value=ow;ids("cropH").value=oh;

  function syncCropPresetButtons(type){

  }
  function parseAspect(value){
    if(!value||value==="free")return null;

  }
  function fitCropToAspect(value){

    applyCropAnchor();
  }
  function syncCropSize(source){
    if(!img||lock)return;
    ids("cropOn").checked=true;
    const ratio=parseAspect(ids("cropAspect").value);

    if(ratio&&source==="w")ids("cropH").value=Math.max(1,Math.round((+ids("cropW").value||ow)/ratio));
    if(ratio&&source==="h")ids("cropW").value=Math.max(1,Math.round((+ids("cropH").value||oh)*ratio));

    let w=Math.max(1,Math.min(ow,+ids("cropW").value||ow));

    let x=Math.max(0,Math.min(ow-w,+ids("cropX").value||0));

      if(anchor==="left"){x=0;y=Math.round((oh-h)/2)}

  }
  function updateCropReadout(){

    ids("cropReadout").textContent=img?(ids("cropOn").checked?tr("目前保留")+" "+w+" × "+h+" · X "+(+ids("cropX").value||0)+" · Y "+(+ids("cropY").value||0):tr("目前保留整張圖片")):tr("選擇圖片後可裁切。");
  }
  ids("cropAspect").addEventListener("change",()=>{if(!img)return;ids("cropOn").checked=true;if(ids("cropAspect").value==="free")normalizeCrop(true);else fitCropToAspect(ids("cropAspect").value);syncOutputToCrop();updateCropReadout();scheduleDraw()});

  ids("cropX").addEventListener("input",()=>{if(!img||lock)return;ids("cropOn").checked=true;ids("cropAnchor").value="custom";syncAnchorButtons();normalizeCrop(false);scheduleDraw()});
  ids("cropY").addEventListener("input",()=>{if(!img||lock)return;ids("cropOn").checked=true;ids("cropAnchor").value="custom";syncAnchorButtons();normalizeCrop(false);scheduleDraw()});
  ids("cropOn").addEventListener("change",()=>{if(!img)return;if(ids("cropOn").checked)normalizeCrop(true);else{ids("cropX").value=0;ids("cropY").value=0;ids("cropW").value=ow;ids("cropH").value=oh;ids("imgW").value=ow;ids("imgH").value=oh;syncCropPresetButtons("full")}updateCropReadout();scheduleDraw()});

  ids("cropFromOutput").addEventListener("click",()=>{if(!img)return;ids("cropOn").checked=true;ids("cropAspect").value="free";ids("cropW").value=Math.max(1,+ids("imgW").value||ow);ids("cropH").value=Math.max(1,+ids("imgH").value||oh);normalizeCrop(true);syncOutputToCrop();scheduleDraw()});

    localStorage.setItem(key,String(ratio));
  };
  apply(localStorage.getItem(key)||.64);

    if(event.button!==0)return;
    event.preventDefault();
    splitter.setPointerCapture?.(event.pointerId);

    const move=moveEvent=>{
      const rect=area.getBoundingClientRect();
      const y=moveEvent.clientY-rect.top;

    const up=upEvent=>{
      splitter.classList.remove("is-dragging");
      splitter.releasePointerCapture?.(upEvent.pointerId);

  if(field==="expr"){

  query=(query||"").trim();
  if(!query)return;
  card.data=card.data||{};
  card.data.weatherQuery=query;
  setWeatherStatus(id,"搜尋中…");
  try{
    const url="https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&format=json&name="+encodeURIComponent(query);
    const res=await fetch(url);
    if(!res.ok)throw new Error("geocoding failed");
    const found=(await res.json()).results?.[0];
    if(!found)throw new Error("no city");
    card.data.weatherName=[found.name,found.admin1,found.country].filter(Boolean).slice(0,2).join(", ");
    card.data.weatherLat=found.latitude;
    card.data.weatherLon=found.longitude;
    card.data.weather=null;
    save();
    await loadWeatherCard(id,{force:true});
  }catch(error){
    card.data.weatherStatus="找不到城市，請換一個名稱。";
    save();
    renderDesktop();
  }
}
async function locateWeather(id){
  if(!navigator.geolocation){
    setWeatherStatus(id,"瀏覽器不支援定位。");
    return;
  }
  setWeatherStatus(id,"定位中…");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const card=activeWorkspace().cards.find(x=>x.id===id);
    if(!card)return;
    card.data=card.data||{};
    card.data.weatherLat=pos.coords.latitude;
    card.data.weatherLon=pos.coords.longitude;
    card.data.weatherName=tr("目前位置");
    card.data.weatherQuery=tr("目前位置");
    card.data.weather=null;
    save();
    await loadWeatherCard(id,{force:true});
  },()=>setWeatherStatus(id,"定位失敗，請手動輸入城市。"),{enableHighAccuracy:false,timeout:9000,maximumAge:30*60*1000});
}
async function loadWeatherCard(id,options={}){
  const card=activeWorkspace().cards.find(x=>x.id===id);
  if(!card||weatherLoading.has(id))return;
  card.data=Object.assign(defaultWeatherData(),card.data||{});
  const fetched=card.data.weather?.fetchedAt||0;
  if(!options.force&&card.data.weather?.version===weatherDataVersion&&Date.now()-fetched<30*60*1000)return;
  weatherLoading.add(id);
  if(!options.silent)setWeatherStatus(id,"正在載入天氣…");
  try{
    const params=new URLSearchParams({
      latitude:String(card.data.weatherLat),
      longitude:String(card.data.weatherLon),
      timezone:"auto",
      forecast_days:"16",
      current:"temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m",
      daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    });
    const res=await fetch("https://api.open-meteo.com/v1/forecast?"+params.toString(),{cache:"no-store"});
    if(!res.ok)throw new Error("weather failed");
    const json=await res.json();
    const daily=json.daily||{};
    card.data.weather={
      fetchedAt:Date.now(),
      version:weatherDataVersion,
      updated:new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit"}).format(new Date()),
      current:{
        temp:json.current?.temperature_2m ?? 0,
        feels:json.current?.apparent_temperature ?? json.current?.temperature_2m ?? 0,
        humidity:json.current?.relative_humidity_2m ?? 0,
        wind:json.current?.wind_speed_10m ?? 0,
        code:json.current?.weather_code ?? 0,
        isDay:json.current?.is_day !== 0
      },
      days:(daily.time||[]).map((date,i)=>({
        date,
        code:daily.weather_code?.[i] ?? 0,
        max:daily.temperature_2m_max?.[i] ?? 0,
        min:daily.temperature_2m_min?.[i] ?? 0,
        pop:daily.precipitation_probability_max?.[i] ?? 0
      }))
    };
    card.data.weatherStatus="";
    save();
    renderDesktop();
  }catch(error){
    card.data.weatherStatus="天氣載入失敗，稍後重試。";
    save();
    renderDesktop();
  }finally{
    weatherLoading.delete(id);
  }
}
function calc(expr){
  const value=String(expr||"").trim();
  if(!value)return "";
  if(!/^[\d+\-*/().%\s]+$/.test(value))return tr("只支援數字和運算符");
  const opens=(value.match(/\(/g)||[]).length;
  const closes=(value.match(/\)/g)||[]).length;
  if(opens>closes||/[+\-*/%.(]$/.test(value))return "";
  try{
    const result=Function("return ("+value+")")();
    return result===undefined?"":String(result);
  }catch(e){
    return "";
  }
}
function openDrawer(panel){
  document.querySelectorAll(".drawer-panel").forEach(p=>p.classList.toggle("hidden",p.dataset.panel!==panel));
  document.querySelectorAll("[data-dock]").forEach(btn=>btn.classList.toggle("is-active",btn.dataset.dock===panel));
  const title={tools:"添加功能",workspaces:"工作區",settings:"設定"}[panel]||"功能中心";
  $("drawerTitle").dataset.i18n=title;
  $("drawerTitle").textContent=tr(title);
  $("desktopDrawer").classList.add("is-open");
  if(window.applyI18n)window.applyI18n(document.body);
}
function renderClock(){
  $("desktopClock").textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",month:"2-digit",day:"2-digit"}).format(new Date());
}
function tickWidgets(){
  const now=new Date();
  document.querySelectorAll("[data-clock]").forEach(el=>el.textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(now));
  document.querySelectorAll("[data-date]").forEach(el=>el.textContent=new Intl.DateTimeFormat(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(now));
}
const bgVersion="20260728-folderbg1";
let bgApplying=false;
const bgDataCache={};
function isEncodedBackground(file){
  return /\.b64(?:[?#].*)?$/.test(file||"");
}
function backgroundUrl(file){
  if(!file)return "";
  if(/^data:|^blob:|^https?:/.test(file))return file;
  return file+(file.includes("?")?"&":"?")+"v="+bgVersion;
}
async function resolveBackgroundSource(file){
  if(!file)return "";
  if(!isEncodedBackground(file))return backgroundUrl(file);
  if(bgDataCache[file])return bgDataCache[file];
  const res=await fetch(backgroundUrl(file),{cache:"force-cache"});
  if(!res.ok)throw new Error("Background data failed: "+file);
  const b64=(await res.text()).replace(/\s+/g,"");
  if(!b64)throw new Error("Background data empty: "+file);
  const src="data:image/webp;base64,"+b64;
  bgDataCache[file]=src;
  return src;
}
function pickBackground(exclude){
  const list=(backgrounds.length?backgrounds:bgFallback).filter(bg=>bg&&bg.file);
  if(!list.length)return null;
  if(list.length===1)return list[0];
  const pool=list.filter(bg=>bg.file!==exclude);
  return pool[Math.floor(Math.random()*pool.length)];
}
function preloadBackgrounds(){
  (backgrounds.length?backgrounds:bgFallback).slice(0,4).forEach(bg=>{
    resolveBackgroundSource(bg.file).then(src=>{
      const img=new Image();
      img.decoding="async";
      img.src=src;
    }).catch(error=>console.error(error));
  });
}
const backgroundFilePattern=/\.(webp|avif|png|jpe?g)(?:[?#].*)?$/i;
function backgroundTitleFromFile(file){
  const name=String(file||"").split("/").pop().replace(/\.[^.]+$/,"");
  return name.replace(/^\d{4}-\d{2}-\d{2}-?/,"").replace(/[-_]+/g," ").replace(/\b\w/g,ch=>ch.toUpperCase())||"Background";
}
function normalizeBackgroundList(list){
  const seen=new Set();
  return (Array.isArray(list)?list:[]).map(item=>{
    const file=typeof item==="string"?item:item?.file||item?.path||item?.download_url;
    if(!file||!backgroundFilePattern.test(file)||/\.b64(?:[?#].*)?$/i.test(file))return null;
    const normalized=/^https?:/.test(file)?file:(file.startsWith("backgrounds/")?file:"backgrounds/"+file.split("/").pop());
    if(seen.has(normalized))return null;
    seen.add(normalized);
    return {
      id:item?.id||normalized.split("/").pop().replace(/\.[^.]+$/,""),
      title:item?.title||backgroundTitleFromFile(normalized),
      file:normalized
    };
  }).filter(Boolean).sort((a,b)=>a.file.localeCompare(b.file,undefined,{numeric:true}));
}
async function loadBackgroundFolder(){
  const api="https://api.github.com/repos/windzxy/windzxy.github.io/contents/backgrounds?ref=master";
  const res=await fetch(api,{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});
  if(!res.ok)throw new Error("Background folder listing failed");
  const files=await res.json();
  return normalizeBackgroundList(files.filter(file=>file&&file.type==="file").map(file=>({file:file.path,title:backgroundTitleFromFile(file.name)})));
}
async function loadBackgroundManifest(){
  const res=await fetch("backgrounds/manifest.json?v="+bgVersion,{cache:"no-store"});
  if(!res.ok)throw new Error("Background manifest failed");
  return normalizeBackgroundList(await res.json());
}
async function loadBackgrounds(){
  let loaded=false;
  try{
    backgrounds=await loadBackgroundFolder();
    loaded=backgrounds.length>0;
  }catch(error){
    console.warn(error);
  }
  if(!loaded){
    try{
      backgrounds=await loadBackgroundManifest();
      loaded=backgrounds.length>0;
    }catch(error){
      console.warn(error);
    }
  }
  if(!loaded)backgrounds=bgFallback;
  preloadBackgrounds();
  const initial=pickBackground(localStorage.getItem(bgKey));
  if(initial)await applyBackground(initial.file);
  renderBackgroundList();
}
function renderBackgroundList(){
  const list=$("backgroundList");
  if(!list)return;
  const current=localStorage.getItem(bgKey);
  list.innerHTML=backgrounds.map(bg=>'<button class="background-item'+(bg.file===current?' is-active':'')+'" type="button" data-file="'+escapeHtml(bg.file)+'"><span></span>'+escapeHtml(bg.title)+'</button>').join("");
  list.querySelectorAll(".background-item").forEach(btn=>btn.addEventListener("click",()=>applyBackground(btn.dataset.file)));
  list.querySelectorAll(".background-item").forEach(btn=>{
    resolveBackgroundSource(btn.dataset.file).then(src=>{
      const thumb=btn.querySelector("span");
      if(thumb)thumb.style.backgroundImage='url("'+src+'")';
    }).catch(error=>console.error(error));
  });
}
function setBackgroundImage(file,src){
  const app=$("desktopApp");
  if(!app)return;
  app.style.backgroundImage='url("'+src+'")';
  app.style.backgroundPosition='center';
  app.style.backgroundRepeat='no-repeat';
  app.style.backgroundSize='cover';
  app.dataset.background=file;
  localStorage.setItem(bgKey,file);
  const title=(backgrounds.find(bg=>bg.file===file)||{}).title||"BG";
  app.dataset.backgroundTitle=title;
  document.querySelectorAll(".background-item").forEach(btn=>btn.classList.toggle("is-active",btn.dataset.file===file));
  document.querySelectorAll("[data-random-bg]").forEach(btn=>btn.dataset.current=String((backgrounds.findIndex(bg=>bg.file===file)+1)||1));
}
async function applyBackground(file){
  if(!file)return;
  try{
    const src=await resolveBackgroundSource(file);
    const image=new Image();
    image.decoding="async";
    image.onload=()=>setBackgroundImage(file,src);
    image.onerror=()=>console.error("Background image failed:",file);
    image.src=src;
  }catch(error){
    console.error(error);
  }
}
async function randomBackground(){
  if(bgApplying)return;
  bgApplying=true;
  try{
    if(!backgrounds.length)backgrounds=bgFallback;
    const current=localStorage.getItem(bgKey)||$("desktopApp")?.dataset.background||"";
    const next=pickBackground(current);
    if(next)await applyBackground(next.file);
  }finally{
    setTimeout(()=>{bgApplying=false},120);
  }
}
window.randomBackground=randomBackground;
function renderAll(){renderWorkspaces();renderShelf();renderDesktop();renderClock()}
window.renderAll=renderAll;
document.addEventListener("click",event=>{const dock=event.target.closest("[data-dock]");if(dock)openDrawer(dock.dataset.dock);const bg=event.target.closest("[data-random-bg]");if(bg)randomBackground();});
document.querySelectorAll("[data-dock]").forEach(btn=>btn.onclick=()=>openDrawer(btn.dataset.dock));
$("closeDrawer").onclick=()=>$("desktopDrawer").classList.remove("is-open");
$("createWorkspace").onclick=createWorkspace;
const customButton=$("addCustomCard");
if(customButton)customButton.onclick=addCustomCard;
$("resetLayout").onclick=resetLayout;
$("deskSearch").addEventListener("input",renderShelf);
setInterval(()=>{renderClock();tickWidgets()},1000);
try{renderAll();openDrawer("tools");loadBackgrounds()}catch(error){console.error(error);loadBackgrounds()}
