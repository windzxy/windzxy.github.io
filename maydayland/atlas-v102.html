<!doctype html>
<html lang="zh-Hant" data-maydayland-atlas="v111">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050912">
  <meta name="description" content="Maydayland v111 Atlas：served runtime certification，保留 Shader route flow、Bloom/performance、tour layers、accessibility/resilience、single-city focus 與 flattened CSS delivery。">
  <title>Maydayland · Certified Atlas v111</title>
  <link rel="icon" type="image/svg+xml" href="./mayday-logo.svg?v=111.0.0">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./app-v43.css?v=111.0.0">
  <link rel="stylesheet" href="./app-v106-atlas-runtime.css?v=111.0.0">
  <style>.v102-audit{position:fixed;right:14px;bottom:14px;z-index:9999;display:grid;gap:3px;min-width:220px;padding:10px 12px;border:1px solid rgba(132,214,255,.22);border-radius:12px;background:rgba(4,10,20,.82);backdrop-filter:blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.24);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b8cadb;pointer-events:none}.v102-audit small{letter-spacing:.12em;color:#6f8aa2}.v102-audit b{font-size:13px;color:#eaf8ff}.v102-audit strong{color:#7de6bd}.v102-audit.is-warn strong{color:#ffb57d}@media(max-width:720px){.v102-audit{right:8px;bottom:8px;min-width:0;max-width:calc(100vw - 16px);padding:8px 10px}}</style>
</head>
<body>
  <div id="app"></div>
  <script>window.MAYDAYLAND_ATLAS_BUILD={version:'v111',release:'served-atlas-certification',events:58,cities:9,segments:8,tourLayers:3,pending:['shell-release-identity'],effectiveLocalRequestBudget:6,effectiveLocalCss:2,localJs:4,imports:0,api:'postMessage:v111',certification:['shader-route','bloom-profile','css-flatten','webgl-resilience','single-city-focus','58-9-8-data']};</script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script>
  (()=>{'use strict';const nativeFetch=window.fetch.bind(window);window.fetch=(input,init)=>{const raw=typeof input==='string'?input:(input&&input.url)||'';if(raw.includes('route-chronology-v64.json')){const next=raw.replace(/route-chronology-v64\.json(?:\?[^#]*)?/,'route-chronology-v69.json?v=111.0.0');return nativeFetch(next,init)}return nativeFetch(input,init)}})();
  </script>
  <script src="./app-v43.js?v=111.0.0"></script>
  <script src="./app-v103-atlas-foundation.js?v=111.0.0"></script>
  <script src="./app-v104-atlas-guardrails.js?v=111.0.0"></script>
  <script src="./app-v105-atlas-focus.js?v=111.0.0"></script>
  <script>
  (()=>{'use strict';
    const EXPECT={css:2,js:4,events:58,cities:9,segments:8};
    const stamp=()=>{const badge=document.querySelector('.v64-badge');if(badge)badge.textContent='ROUTE GEOMETRY · 111 · 58 DATES / 9 CITIES';const top=document.querySelector('.v64-top small');if(top)top.textContent='V111 · SHADER ROUTE · SERVED CERTIFIED';const title=document.querySelector('.v64-top h3');if(title)title.textContent='58 verified dates · 9 cities · 8 live map segments';const access=document.querySelector('.v67-head small');if(access)access.textContent='V111 · ACCESSIBILITY + RESILIENCE';document.documentElement.dataset.maydaylandVersion='111';};
    const audit=async()=>{const res=performance.getEntriesByType?.('resource')||[];const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});const css=local.filter(r=>/\/(?:app-v43|app-v106-atlas-runtime)\.css(?:\?|$)/.test(r.name)).length;const js=local.filter(r=>/\/(?:app-v43|app-v103-atlas-foundation|app-v104-atlas-guardrails|app-v105-atlas-focus)\.js(?:\?|$)/.test(r.name)).length;const legacyImport=local.some(r=>/\/app-v42\.css(?:\?|$)/.test(r.name));const legacyCss=local.some(r=>/\/app-v(?:64-atlas|65-atlas|66-atlas|67-atlas|72-atlas)\.css(?:\?|$)/.test(r.name));const legacyJs=local.some(r=>/\/(?:app-v64-atlas|app-v65-atlas|app-v66-atlas|app-v67-atlas|app-v69-route-bridge|app-v72-atlas)\.js(?:\?|$)/.test(r.name));let dataPass=false;try{const[r,p]=await Promise.all([fetch('./data/route-chronology-v69.json?v=111',{cache:'no-store'}).then(x=>x.json()),fetch('./data/provenance-v69.json?v=111',{cache:'no-store'}).then(x=>x.json())]);const events=(r.cities||[]).reduce((n,c)=>n+(c.events?.length||0),0);const verified=(p.cities||[]).filter(c=>c.status==='verified').length;dataPass=events===EXPECT.events&&verified===EXPECT.cities&&r.coverage?.geometrySegments===EXPECT.segments}catch{}const webgl=!!window.THREE&&!!document.querySelector('#threeStage canvas');const foundation=document.documentElement.dataset.v103AtlasFoundation==='ready';const guardrails=document.documentElement.dataset.v104AtlasGuardrails==='ready';const focus=document.documentElement.dataset.v105AtlasFocus==='ready';const bloomApi=!!document.querySelector('[data-fx="bloom"]')&&!!document.querySelector('#ratioCap');const pass=css<=EXPECT.css&&js<=EXPECT.js&&!legacyImport&&!legacyCss&&!legacyJs&&dataPass&&webgl&&foundation&&guardrails&&focus&&bloomApi;const el=document.createElement('aside');el.className='v102-audit'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V111 · SERVED ATLAS CERTIFICATION</small><b>${css} CSS · ${js} JS LOCAL · 0 IMPORT</b><strong>${pass?'6/6 GATES PASS':'CHECK'}</strong><span>${webgl?'WebGL active':'WebGL pending'} · shader/data ${dataPass?'ready':'pending'} · bloom/profile ${bloomApi?'ready':'pending'}</span><span>foundation ${foundation?'ready':'pending'} · guardrails ${guardrails?'ready':'pending'} · focus ${focus?'ready':'pending'}</span>`;document.body.append(el);document.body.dataset.v111AtlasAudit=pass?'pass':'check';document.documentElement.dataset.v111AtlasCertification=pass?'pass':'check';};
    const rank={full:0,balanced:1,eco:2},state={profile:'full',level:0,reason:'baseline',applied:0,ready:false};
    const emit=(type='maydayland:atlas-profile-ack')=>{try{parent.postMessage({type,version:'v111',profile:state.profile,level:state.level,reason:state.reason,applied:state.applied,ready:state.ready,certification:document.documentElement.dataset.v111AtlasCertification||'pending'},location.origin)}catch{}};
    const applyProfile=(profile='full',reason='parent')=>{if(!(profile in rank))profile='full';const next=rank[profile];if(next<state.level)return {...state,ignored:'upshift-blocked'};state.profile=profile;state.level=next;state.reason=reason||'parent';const ratio=document.querySelector('#ratioCap'),bloom=document.querySelector('#bloomText'),bloomBtn=document.querySelector('[data-fx="bloom"]');if(profile==='balanced'||profile==='eco'){const cap=profile==='eco'?'1':'1.2';if(ratio){ratio.value=cap;ratio.dispatchEvent(new Event('input',{bubbles:true}))}if((bloom?.textContent||'').trim().toUpperCase()==='ON')bloomBtn?.click();}document.documentElement.dataset.v111AdaptiveProfile=profile;state.applied++;emit();return {...state};};
    window.MAYDAYLAND_ATLAS_CONTROL_V111={applyProfile,getState:()=>({...state,certification:document.documentElement.dataset.v111AtlasCertification||'pending'})};
    window.MAYDAYLAND_ATLAS_CONTROL_V106=window.MAYDAYLAND_ATLAS_CONTROL_V111;
    window.MAYDAYLAND_ATLAS_CONTROL_V105=window.MAYDAYLAND_ATLAS_CONTROL_V111;
    window.MAYDAYLAND_ATLAS_CONTROL_V104=window.MAYDAYLAND_ATLAS_CONTROL_V111;
    addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;const m=e.data||{};if(m.type==='maydayland:atlas-profile')applyProfile(m.profile,m.reason);if(m.type==='maydayland:atlas-state-request')emit('maydayland:atlas-state')});
    addEventListener('DOMContentLoaded',()=>{setTimeout(stamp,1500);setTimeout(audit,2200);setTimeout(()=>{state.ready=true;document.documentElement.dataset.v111AdaptiveApi='ready';emit('maydayland:atlas-ready')},2350)},{once:true});
  })();
  </script>
</body>
</html>
