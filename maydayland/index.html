  <script>window.MAYDAYLAND_BUILD={version:'v91',release:'atlas-native-adaptive-control',events:58,cities:9,segments:8,pending:['tokyo'],homeLocalRequestBudget:{css:6,js:6,total:12,imports:0},core:'v88',atlas:'v91-native-on-v74-path',atlasMount:'home-only',lifecycle:'core-native-route+atlas-native-message-api+regression-evidence'};</script>

  <script>
  (()=>{'use strict';
    const ROUTES=['home','city','album','songs','books','timeline'],VALID=new Set(ROUTES),STORE='maydayland:v91:regression',EXPECT={css:6,js:6};
    const rank={full:0,balanced:1,eco:2};
    const T={started:performance.now(),renders:0,transitions:0,lastPage:null,lastHash:null,longTasks:0,maxLongTask:0,matrix:{},profile:'full',reason:'baseline',sent:0,acks:0,atlasReady:false,atlasState:null};
    try{T.matrix=JSON.parse(sessionStorage.getItem(STORE)||'{}')||{}}catch{}
    const page=()=>{const p=location.hash.replace(/^#/,'').split('/')[0]||'home';return VALID.has(p)?p:'home'};
    const atlas=()=>{const frame=document.querySelector('.v45-atlas iframe'),src=frame?.getAttribute('src')||'';return{frame,src,mounted:!!frame,pathOK:!!frame&&/atlas-v74\.html(?:\?|$)/.test(src)}};
    const activeOK=()=>{const s=[...document.querySelectorAll('.v45-section')];return s.length>0&&s.filter(x=>x.classList.contains('active')).length===1};
    const baseProfile=()=>{const reduced=matchMedia?.('(prefers-reduced-motion: reduce)').matches,conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection,save=!!conn?.saveData,slow=/2g/.test(conn?.effectiveType||''),mem=Number(navigator.deviceMemory||8),cores=Number(navigator.hardwareConcurrency||8);if(reduced||save||slow||mem<=2||cores<=2)return['eco',reduced?'reduced-motion':save?'save-data':slow?'slow-network':'low-device'];if(mem<=4||cores<=4)return['balanced','mid-device'];return['full','baseline']};
    const chooseProfile=()=>{let[p,r]=baseProfile();if(T.maxLongTask>=180||T.longTasks>=4){p='eco';r='long-task-pressure'}else if((T.maxLongTask>=110||T.longTasks>=2)&&rank[p]<rank.balanced){p='balanced';r='runtime-pressure'}if(rank[p]>=rank[T.profile]){T.profile=p;T.reason=r}return T.profile};
    const sendProfile=()=>{if(page()!=='home')return;const a=atlas();if(!a.frame?.contentWindow)return;chooseProfile();try{a.frame.contentWindow.postMessage({type:'maydayland:atlas-profile',profile:T.profile,reason:T.reason,source:'maydayland-v91'},location.origin);T.sent++}catch{}};
    const probe=()=>{const p=page(),a=atlas(),core=document.documentElement.dataset.v88Core==='ready',route=document.documentElement.dataset.v88RouteController==='ready',life=document.documentElement.dataset.v88ShellLifecycle==='ready',atlasLife=document.documentElement.dataset.v88AtlasLifecycle===(p==='home'?'mounted':'unmounted'),atlasOK=p==='home'?(a.mounted&&a.pathOK):!a.mounted,nativeOK=p==='home'?(T.atlasReady||T.acks>0):true,pass=core&&route&&life&&atlasLife&&atlasOK&&nativeOK&&activeOK();T.matrix[p]={pass,hash:location.hash||'#home',atlas:p==='home'?'mounted-native-v91':'unmounted',profile:T.profile,nativeAck:T.acks>0,at:new Date().toISOString()};try{sessionStorage.setItem(STORE,JSON.stringify(T.matrix))}catch{}return{p,a,pass,nativeOK}};
    const runtimeAudit=()=>{const res=performance.getEntriesByType?.('resource')||[],local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}}),css=local.filter(r=>/\/app-v(?:82-core|81-services|79-media-core|78-media|77|73)\.css(?:\?|$)/.test(r.name)).length,js=local.filter(r=>/\/app-v(?:88-core|81-services|79-media-core|78-media|77|73)\.js(?:\?|$)/.test(r.name)).length,legacy=local.some(r=>/\/app-v(?:47|48|49|50|51|52|83-archives|84-archives|85-core)\.(?:css|js)(?:\?|$)/.test(r.name)),imported=[...document.styleSheets].some(s=>{try{return[...s.cssRules].some(r=>r.type===CSSRule.IMPORT_RULE)}catch{return false}}),q=probe(),services=!!document.querySelector('#v51SearchLauncher'),chronology=!!document.querySelector('.v60-chronology'),media=document.body.dataset.v79MediaCore==='ready';return{css,js,pass:css<=EXPECT.css&&js<=EXPECT.js&&!legacy&&!imported&&q.pass&&services&&chronology&&media,q}};
    const snapshot=()=>{const q=probe(),fcp=(performance.getEntriesByName?.('first-contentful-paint')||[])[0]?.startTime||null;return{version:'v91',route:q.p,hash:location.hash||'#home',renders:T.renders,transitions:T.transitions,performanceProfile:T.profile,profileReason:T.reason,profileMessagesSent:T.sent,atlasAcks:T.acks,atlasReady:T.atlasReady,atlasState:T.atlasState,matrix:{...T.matrix},observedRoutes:ROUTES.filter(r=>T.matrix[r]),passedRoutes:ROUTES.filter(r=>T.matrix[r]?.pass),resources:(performance.getEntriesByType?.('resource')||[]).length,fcpMs:fcp?Math.round(fcp):null,longTasks:T.longTasks,maxLongTaskMs:T.maxLongTask?Math.round(T.maxLongTask):0,uptimeMs:Math.round(performance.now()-T.started)}};
    window.MAYDAYLAND_TELEMETRY_V91={snapshot,clear(){T.matrix={};try{sessionStorage.removeItem(STORE)}catch{}renderDiag();return snapshot()}};
    const ensureDiag=()=>{let el=document.querySelector('.v91-diag');if(el)return el;el=document.createElement('aside');el.className='v91-diag';el.innerHTML='<button class="v91-diag-toggle" type="button" aria-expanded="false"><i class="v91-dot"></i><span>V91 · Quality evidence</span></button><section class="v91-diag-panel" aria-label="Maydayland quality evidence"></section>';document.body.append(el);el.querySelector('.v91-diag-toggle').addEventListener('click',()=>{el.classList.toggle('is-open');el.querySelector('button').setAttribute('aria-expanded',String(el.classList.contains('is-open')))});return el};
    const renderDiag=()=>{if(!document.body)return;chooseProfile();const el=ensureDiag(),a=runtimeAudit(),s=snapshot(),observed=s.observedRoutes.length,passed=s.passedRoutes.length;el.classList.toggle('is-warn',!a.pass);el.querySelector('.v91-diag-toggle span').textContent=`V91 · ${a.pass?'PASS':'CHECK'} · ${T.profile.toUpperCase()}`;el.querySelector('.v91-diag-panel').innerHTML=`<div class="v91-head"><b>Served regression evidence</b><span>${passed}/${observed} passed · ${observed}/6 observed</span></div><div class="v91-routes">${ROUTES.map(r=>`<span class="v91-route ${T.matrix[r]?(T.matrix[r].pass?'pass':'fail'):''}">${r}</span>`).join('')}</div><div class="v91-grid"><span><small>Current route</small><strong>${a.q.p}</strong></span><span><small>Atlas API</small><strong>${a.q.p==='home'?(T.atlasReady?'v91 ready':T.acks?'v91 ack':'pending'):'unmounted'}</strong></span><span><small>Runtime budget</small><strong>${a.css} CSS · ${a.js} JS</strong></span><span><small>Adaptive profile</small><strong>${T.profile} · ${T.reason}</strong></span><span><small>Long tasks</small><strong>${T.longTasks} · max ${Math.round(T.maxLongTask||0)}ms</strong></span><span><small>Native control</small><strong>${T.sent} sent · ${T.acks} ack</strong></span></div><div class="v91-note">Parent page sends a profile message only. Bloom / pixel ratio changes are owned by the Atlas runtime; no parent contentDocument access.</div><div class="v91-actions"><button type="button" data-clear>Clear session evidence</button></div>`;el.querySelector('[data-clear]')?.addEventListener('click',()=>window.MAYDAYLAND_TELEMETRY_V91.clear(),{once:true});document.body.dataset.v91CurrentRouteAudit=a.pass?'pass':'check';document.documentElement.dataset.v91Telemetry='ready';document.documentElement.dataset.v91PerformanceProfile=T.profile;sendProfile()};
    const transition=()=>{const p=page(),h=location.hash||'#home';if(T.lastPage!==null&&(T.lastPage!==p||T.lastHash!==h))T.transitions++;T.lastPage=p;T.lastHash=h};
    addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(!/^maydayland:atlas-/.test(m.type||''))return;if(m.type==='maydayland:atlas-ready')T.atlasReady=true;if(m.type==='maydayland:atlas-profile-ack'||m.type==='maydayland:atlas-state'){T.acks++;T.atlasState=m}if(m.type==='maydayland:atlas-ready')sendProfile();setTimeout(renderDiag,40)});
    try{new PerformanceObserver(list=>{for(const e of list.getEntries()){T.longTasks++;T.maxLongTask=Math.max(T.maxLongTask,e.duration||0)}chooseProfile();sendProfile();renderDiag()}).observe({type:'longtask',buffered:true})}catch{}
    addEventListener('maydayland:shell-rendered',()=>{T.renders++;transition();setTimeout(()=>{sendProfile();renderDiag()},180)});addEventListener('hashchange',()=>{transition();setTimeout(renderDiag,260)});document.addEventListener('DOMContentLoaded',()=>{transition();setTimeout(renderDiag,2200);['maydayland:core-ready','maydayland:chronology-ready','maydayland:media-core-ready','maydayland:services-ready'].forEach(n=>addEventListener(n,()=>setTimeout(renderDiag,220)))},{once:true});addEventListener('pageshow',()=>setTimeout(renderDiag,360));addEventListener('load',()=>setTimeout(renderDiag,760),{once:true});
  })();
