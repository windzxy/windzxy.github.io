<body>
  <div id="app"></div>
  <script>window.MAYDAYLAND_BUILD={version:'v77',release:'chronology-content-runtime-consolidation',events:58,cities:9,segments:8,pending:['tokyo'],homeLocalRequestBudget:{css:10,js:11},atlas:'v74'};</script>

  <script>
  (()=>{
    'use strict';
    const ATLAS='./atlas-v74.html';
    const EXPECT={css:10,js:11};
    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));
      const live=document.querySelector('.v45-live b');if(live)live.textContent='v77 LIVE';
      const brand=document.querySelector('.v45-brand small');if(brand)brand.textContent='PRODUCT SYSTEM · v77.0.0';
      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v77 · consolidated content runtime · 10 CSS / 11 JS budget';
      document.documentElement.dataset.maydaylandRelease='v77';
    };
    const audit=()=>{
      document.querySelector('.v77-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:49|50|51|52|53|54|56|57|73|77)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|48|49|51|52|53|54|56|57|73|77)\.js(?:\?|$)/.test(r.name)).length;
      const obsolete=local.some(r=>/\/app-v(?:58|59|60|61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const core=document.querySelector('.v60-chronology');
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!obsolete&&!!core;
      const el=document.createElement('aside');el.className='v77-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V77 · CONTENT RUNTIME AUDIT</small><b>${css} CSS · ${js} JS LOCAL</b><strong>${pass?'CONSOLIDATION PASS':'CHECK'}</strong><span>${obsolete?'legacy v58–v67 detected':'v58–v60 merged into app-v77'} · chronology ${core?'mounted':'waiting'}</span>`;document.body.append(el);
      document.body.dataset.v77HomeAudit=pass?'pass':'check';
    };
    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(()=>{rewrite();document.title='Maydayland · Consolidated Content Runtime v77';},1750);
      setTimeout(audit,2300);
      const app=document.querySelector('#app');if(app)new MutationObserver(()=>requestAnimationFrame(rewrite)).observe(app,{childList:true,subtree:true});
      addEventListener('maydayland:chronology-ready',()=>setTimeout(audit,120));
    },{once:true});
    addEventListener('load',()=>setTimeout(audit,320),{once:true});
  })();
  </script>
</body>
