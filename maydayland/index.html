<body>
  <div id="app"></div>
  <script>window.MAYDAYLAND_BUILD={version:'v79',release:'media-core-convergence',events:58,cities:9,segments:8,pending:['tokyo'],homeLocalRequestBudget:{css:8,js:9},atlas:'v74'};</script>

  <script>
  (()=>{
    'use strict';
    const ATLAS='./atlas-v74.html';
    const EXPECT={css:8,js:9};
    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));
      const live=document.querySelector('.v45-live b');if(live)live.textContent='v79 LIVE';
      const brand=document.querySelector('.v45-brand small');if(brand)brand.textContent='PRODUCT SYSTEM · v79.0.0';
      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v79 · converged media core · 8 CSS / 9 JS budget';
      document.documentElement.dataset.maydaylandRelease='v79';
    };
    const audit=()=>{
      document.querySelector('.v79-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:49|50|51|52|73|77|78-media|79-media-core)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|48|49|51|52|73|77|78-media|79-media-core)\.js(?:\?|$)/.test(r.name)).length;
      const obsolete=local.some(r=>/\/app-v(?:53|54|56|57|58|59|60|61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const chronology=document.querySelector('.v60-chronology');
      const integrity=document.querySelector('#v56Integrity');
      const evidence=document.querySelector('#v57Evidence');
      const mediaCore=document.body.dataset.v79MediaCore==='ready';
      const registry=document.querySelector('#v79Registry');
      const health=document.querySelector('#v79Health');
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!obsolete&&!!chronology&&!!integrity&&!!evidence&&mediaCore&&!!registry&&!!health;
      const el=document.createElement('aside');el.className='v79-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V79 · MEDIA CORE AUDIT</small><b>${css} CSS · ${js} JS LOCAL</b><strong>${pass?'CONVERGENCE PASS':'CHECK'}</strong><span>${obsolete?'legacy v53–v67 detected':'v53/v54 merged'} · registry ${registry?'ready':'waiting'} · health ${health?'ready':'waiting'}</span>`;document.body.append(el);
      document.body.dataset.v79HomeAudit=pass?'pass':'check';
    };
    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(()=>{rewrite();document.title='Maydayland · Media Core Convergence v79';},1750);
      setTimeout(audit,2800);
      const app=document.querySelector('#app');if(app)new MutationObserver(()=>requestAnimationFrame(rewrite)).observe(app,{childList:true,subtree:true});
      addEventListener('maydayland:chronology-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:media-core-ready',()=>setTimeout(audit,180));
    },{once:true});
    addEventListener('load',()=>setTimeout(audit,620),{once:true});
  })();
  </script>
