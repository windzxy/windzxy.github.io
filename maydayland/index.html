  <script>
  (()=>{
    'use strict';
    const ATLAS='./atlas-v74.html';
    const EXPECT={css:6,js:7};
    let shellSignals=0;
    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));
      document.querySelectorAll('iframe[src*="atlas-v43.html"],iframe[src*="atlas-v61.html"],iframe[src*="atlas-v64.html"],iframe[src*="atlas-v69.html"],iframe[src*="atlas-v72.html"],iframe[src*="atlas-v73.html"]').forEach(f=>{if(!f.src.includes('atlas-v74.html'))f.setAttribute('src',ATLAS)});
      const live=document.querySelector('.v45-live b');if(live)live.textContent='v84 LIVE';
      const brand=document.querySelector('.v45-brand small');if(brand)brand.textContent='PRODUCT SYSTEM · v84.0.0';
      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v84 · shell lifecycle convergence · live Atlas v74';
      document.documentElement.dataset.maydaylandRelease='v84';
    };
    const signalShell=()=>{
      shellSignals++;
      document.documentElement.dataset.v84ShellLifecycle='ready';
      window.dispatchEvent(new CustomEvent('maydayland:shell-rendered',{detail:{version:'v84',hash:location.hash||'#home',sequence:shellSignals}}));
    };
    const audit=()=>{
      document.querySelector('.v84-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:82-core|81-services|79-media-core|78-media|77|73)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|84-archives|81-services|79-media-core|78-media|77|73)\.js(?:\?|$)/.test(r.name)).length;
      const oldArchives=local.some(r=>/\/app-v(?:48|49|83-archives)\.js(?:\?|$)/.test(r.name));
      const oldServices=local.some(r=>/\/app-v(?:51|52)\.(?:css|js)(?:\?|$)/.test(r.name));
      const obsolete=local.some(r=>/\/app-v(?:50|53|54|56|57|58|59|60|61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const imported=[...document.styleSheets].some(s=>{try{return [...s.cssRules].some(r=>r.type===CSSRule.IMPORT_RULE)}catch{return false}});
      const iframe=document.querySelector('.v45-atlas iframe');
      const atlasLive=!!iframe&&/atlas-v74\.html(?:\?|$)/.test(iframe.getAttribute('src')||'');
      const archivesReady=document.documentElement.dataset.v84Archives==='ready';
      const lifecycleReady=document.documentElement.dataset.v84ShellLifecycle==='ready'&&shellSignals>0;
      const chronology=document.querySelector('.v60-chronology');
      const integrity=document.querySelector('#v56Integrity');
      const evidence=document.querySelector('#v57Evidence');
      const mediaCore=document.body.dataset.v79MediaCore==='ready';
      const registry=document.querySelector('#v79Registry');
      const health=document.querySelector('#v79Health');
      const search=document.querySelector('#v51SearchLauncher');
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!oldArchives&&!oldServices&&!obsolete&&!imported&&atlasLive&&archivesReady&&lifecycleReady&&!!chronology&&!!integrity&&!!evidence&&mediaCore&&!!registry&&!!health&&!!search;
      const el=document.createElement('aside');el.className='v84-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V84 · SHELL LIFECYCLE</small><b>${css} CSS · ${js} JS RUNTIME</b><strong>${pass?'LIFECYCLE PASS':'CHECK'}</strong><span>imports ${imported?'check':'0'} · Atlas ${atlasLive?'v74 live':'check'} · shell events ${shellSignals} · archives ${archivesReady?'event-driven':'waiting'}</span>`;document.body.append(el);
      document.body.dataset.v84HomeAudit=pass?'pass':'check';
    };
    document.addEventListener('DOMContentLoaded',()=>{
      const app=document.querySelector('#app');
      if(app)new MutationObserver(()=>requestAnimationFrame(()=>{rewrite();signalShell();})).observe(app,{childList:true});
      setTimeout(()=>{rewrite();signalShell();document.title='Maydayland · Shell Lifecycle Convergence v84';},1750);
      setTimeout(audit,3000);
      addEventListener('maydayland:archives-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:chronology-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:media-core-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:services-ready',()=>setTimeout(audit,220));
    },{once:true});
    addEventListener('load',()=>setTimeout(audit,760),{once:true});
  })();
