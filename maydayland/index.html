  <title>Maydayland · Production Load Graph Audit v80</title>

  <style>
    .v80-budget{position:fixed;left:14px;bottom:14px;z-index:9998;display:grid;gap:3px;min-width:236px;padding:10px 12px;border:1px solid rgba(125,230,189,.2);border-radius:12px;background:rgba(4,10,20,.84);backdrop-filter:blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.22);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b8cadb;pointer-events:none}.v80-budget small{letter-spacing:.12em;color:#6f8aa2}.v80-budget b{font-size:13px;color:#eafff7}.v80-budget strong{color:#7de6bd}.v80-budget.is-warn strong{color:#ffb57d}@media(max-width:720px){.v80-budget{left:8px;bottom:8px;min-width:0;max-width:calc(100vw - 16px);padding:8px 10px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>window.MAYDAYLAND_BUILD={version:'v80',release:'production-load-graph-audit',events:58,cities:9,segments:8,pending:['tokyo'],homeLocalRequestBudget:{linkedCss:7,runtimeCss:8,js:9},atlas:'v74'};</script>
  <script src="./app-v47.js?v=80.0.0" defer></script>
  <script src="./app-v48.js?v=80.0.0" defer></script>
  <script src="./app-v49.js?v=80.0.0" defer></script>
  <script src="./app-v51.js?v=80.0.0" defer></script>
  <script src="./app-v52.js?v=80.0.0" defer></script>
  <script src="./app-v79-media-core.js?v=80.0.0" defer></script>
  <script src="./app-v78-media.js?v=80.0.0" defer></script>
  <script src="./app-v77.js?v=80.0.0" defer></script>
  <script src="./app-v73.js?v=80.0.0" defer></script>
  <script>
  (()=>{
    'use strict';
    const ATLAS='./atlas-v74.html';
    const EXPECT={css:8,js:9};
    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));
      const live=document.querySelector('.v45-live b');if(live)live.textContent='v80 LIVE';
      const brand=document.querySelector('.v45-brand small');if(brand)brand.textContent='PRODUCT SYSTEM · v80.0.0';
      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v80 · truthful runtime budget · dead v50 CSS retired';
      document.documentElement.dataset.maydaylandRelease='v80';
    };
    const audit=()=>{
      document.querySelector('.v80-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:48|49|51|52|73|77|78-media|79-media-core)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|48|49|51|52|73|77|78-media|79-media-core)\.js(?:\?|$)/.test(r.name)).length;
      const deadV50=local.some(r=>/\/app-v50\.css(?:\?|$)/.test(r.name));
      const obsolete=local.some(r=>/\/app-v(?:53|54|56|57|58|59|60|61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const chronology=document.querySelector('.v60-chronology');
      const integrity=document.querySelector('#v56Integrity');
      const evidence=document.querySelector('#v57Evidence');
      const mediaCore=document.body.dataset.v79MediaCore==='ready';
      const registry=document.querySelector('#v79Registry');
      const health=document.querySelector('#v79Health');
      const search=document.querySelector('#v51SearchLauncher');
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!deadV50&&!obsolete&&!!chronology&&!!integrity&&!!evidence&&mediaCore&&!!registry&&!!health&&!!search;
      const el=document.createElement('aside');el.className='v80-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V80 · LOAD GRAPH AUDIT</small><b>${css} CSS · ${js} JS RUNTIME</b><strong>${pass?'AUDIT PASS':'CHECK'}</strong><span>${deadV50?'v50 CSS still loaded':'v50 CSS retired'} · imported v48 counted · search ${search?'ready':'waiting'}</span>`;document.body.append(el);
      document.body.dataset.v80HomeAudit=pass?'pass':'check';
    };
    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(()=>{rewrite();document.title='Maydayland · Production Load Graph Audit v80';},1750);
      setTimeout(audit,2800);
      const app=document.querySelector('#app');if(app)new MutationObserver(()=>requestAnimationFrame(rewrite)).observe(app,{childList:true,subtree:true});
      addEventListener('maydayland:chronology-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:media-core-ready',()=>setTimeout(audit,180));
    },{once:true});
    addEventListener('load',()=>setTimeout(audit,620),{once:true});
  })();
  </script>
</body>
