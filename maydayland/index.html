    .v93-diag{position:fixed;left:12px;bottom:12px;z-index:9998;font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#bdd0df}.v93-diag button{font:inherit;color:inherit}.v93-toggle{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid rgba(125,230,189,.2);border-radius:999px;background:rgba(4,10,20,.84);backdrop-filter:blur(14px);cursor:pointer}.v93-dot{width:7px;height:7px;border-radius:50%;background:#7de6bd;box-shadow:0 0 10px rgba(125,230,189,.55)}.v93-diag.warn .v93-dot{background:#ffb57d}.v93-panel{display:none;width:min(420px,calc(100vw - 24px));margin-top:8px;padding:12px;border:1px solid rgba(125,230,189,.2);border-radius:14px;background:rgba(4,10,20,.94);backdrop-filter:blur(18px)}.v93-diag.open .v93-panel{display:grid;gap:9px}.v93-routes{display:flex;gap:5px;flex-wrap:wrap}.v93-routes span{padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.04);color:#7890a3}.v93-routes .pass{color:#7de6bd;background:rgba(125,230,189,.08)}.v93-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.v93-grid span{padding:7px 8px;border-radius:9px;background:rgba(255,255,255,.035)}.v93-grid small{display:block;color:#708ba0}.v93-grid strong{color:#e7fff5}@media(max-width:720px){.v93-diag{left:8px;bottom:8px}}

<body>
  <div id="app"></div>
  <script>window.MAYDAYLAND_BUILD={version:'v93',release:'core-native-atlas-v92',events:58,cities:9,segments:8,pending:['tokyo'],homeLocalRequestBudget:{css:6,js:6,total:12,imports:0},core:'app-v93-core.js',atlas:'atlas-v92.html',atlasMount:'home-only',lifecycle:'core-native-route+direct-atlas-v92+session-regression-evidence'};</script>

  <script>
  (()=>{'use strict';
    const ROUTES=['home','city','album','songs','books','timeline'],VALID=new Set(ROUTES),STORE='maydayland:v93:regression';
    const T={matrix:{},profile:'full',reason:'baseline',sent:0,acks:0,atlasReady:false,longTasks:0,maxLongTask:0};
    try{T.matrix=JSON.parse(sessionStorage.getItem(STORE)||'{}')||{}}catch{}
    const page=()=>{const p=location.hash.replace(/^#/,'').split('/')[0]||'home';return VALID.has(p)?p:'home'};
    const atlas=()=>{const frame=document.querySelector('.v45-atlas iframe'),src=frame?.getAttribute('src')||'';return{frame,src,mounted:!!frame,pathOK:!!frame&&/atlas-v92\.html(?:\?|$)/.test(src)}};
    const chooseProfile=()=>{const reduced=matchMedia?.('(prefers-reduced-motion: reduce)').matches,conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection,save=!!conn?.saveData,slow=/2g/.test(conn?.effectiveType||''),mem=Number(navigator.deviceMemory||8),cores=Number(navigator.hardwareConcurrency||8);let p='full',r='baseline';if(reduced||save||slow||mem<=2||cores<=2){p='eco';r=reduced?'reduced-motion':save?'save-data':slow?'slow-network':'low-device'}else if(mem<=4||cores<=4){p='balanced';r='mid-device'}if(T.maxLongTask>=180||T.longTasks>=4){p='eco';r='long-task-pressure'}else if((T.maxLongTask>=110||T.longTasks>=2)&&p==='full'){p='balanced';r='runtime-pressure'}T.profile=p;T.reason=r;return p};
    const sendProfile=()=>{if(page()!=='home')return;const a=atlas();if(!a.frame?.contentWindow||!a.pathOK)return;chooseProfile();try{a.frame.contentWindow.postMessage({type:'maydayland:atlas-profile',profile:T.profile,reason:T.reason,source:'maydayland-v93'},location.origin);T.sent++}catch{}};
    const probe=()=>{const p=page(),a=atlas(),core=document.documentElement.dataset.v93Core==='ready',route=document.documentElement.dataset.v93RouteController==='ready',life=document.documentElement.dataset.v93ShellLifecycle==='ready',atlasLife=document.documentElement.dataset.v93AtlasLifecycle===(p==='home'?'mounted':'unmounted'),atlasOK=p==='home'?(a.mounted&&a.pathOK):!a.mounted,nativeOK=p==='home'?(T.atlasReady||T.acks>0):true,sections=[...document.querySelectorAll('.v45-section')],active=sections.length>0&&sections.filter(x=>x.classList.contains('active')).length===1,pass=core&&route&&life&&atlasLife&&atlasOK&&nativeOK&&active;T.matrix[p]={pass,hash:location.hash||'#home',atlas:p==='home'?'atlas-v92-native':'unmounted',nativeAck:T.acks>0,profile:T.profile,at:new Date().toISOString()};try{sessionStorage.setItem(STORE,JSON.stringify(T.matrix))}catch{}return{p,a,pass}};
    const audit=()=>{const q=probe(),res=performance.getEntriesByType?.('resource')||[],local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}}),css=local.filter(r=>/\/app-v(?:82-core|81-services|79-media-core|78-media|77|73)\.css(?:\?|$)/.test(r.name)).length,js=local.filter(r=>/\/app-v(?:93-core|81-services|79-media-core|78-media|77|73)\.js(?:\?|$)/.test(r.name)).length,legacy=local.some(r=>/\/app-v(?:47|48|49|83-archives|84-archives|85-core|88-core)\.js(?:\?|$)/.test(r.name)),oldAtlas=local.some(r=>/\/atlas-v74\.html(?:\?|$)/.test(r.name));return{q,css,js,pass:q.pass&&css<=6&&js<=6&&!legacy&&!oldAtlas,legacy,oldAtlas}};
    const snapshot=()=>{const a=audit();return{version:'v93',route:a.q.p,hash:location.hash||'#home',atlasEntry:a.q.a.src,atlasReady:T.atlasReady,atlasAcks:T.acks,performanceProfile:T.profile,profileReason:T.reason,observedRoutes:ROUTES.filter(r=>T.matrix[r]),passedRoutes:ROUTES.filter(r=>T.matrix[r]?.pass),matrix:{...T.matrix},localCss:a.css,localJs:a.js,legacyCoreLoaded:a.legacy,legacyAtlasRequested:a.oldAtlas,longTasks:T.longTasks,maxLongTaskMs:Math.round(T.maxLongTask||0)}};
    window.MAYDAYLAND_TELEMETRY_V93={snapshot,clear(){T.matrix={};try{sessionStorage.removeItem(STORE)}catch{}render();return snapshot()}};
    const ui=()=>{let e=document.querySelector('.v93-diag');if(e)return e;e=document.createElement('aside');e.className='v93-diag';e.innerHTML='<button class="v93-toggle" type="button" aria-expanded="false"><i class="v93-dot"></i><span>V93 · Quality evidence</span></button><section class="v93-panel"></section>';document.body.append(e);e.querySelector('.v93-toggle').onclick=()=>{e.classList.toggle('open');e.querySelector('button').setAttribute('aria-expanded',String(e.classList.contains('open')))};return e};
    const render=()=>{if(!document.body)return;chooseProfile();const a=audit(),s=snapshot(),e=ui(),observed=s.observedRoutes.length,passed=s.passedRoutes.length;e.classList.toggle('warn',!a.pass);e.querySelector('.v93-toggle span').textContent=`V93 · ${a.pass?'PASS':'CHECK'} · ${T.profile.toUpperCase()}`;e.querySelector('.v93-panel').innerHTML=`<b>Served regression evidence · ${passed}/${observed} passed</b><div class="v93-routes">${ROUTES.map(r=>`<span class="${T.matrix[r]?.pass?'pass':''}">${r}</span>`).join('')}</div><div class="v93-grid"><span><small>Atlas entry</small><strong>${a.q.p==='home'?(a.q.a.pathOK?'v92 direct':'pending'):'unmounted'}</strong></span><span><small>Native API</small><strong>${T.atlasReady?'ready':T.acks?'ack':'pending'}</strong></span><span><small>Budget</small><strong>${a.css} CSS · ${a.js} JS</strong></span><span><small>Legacy mount</small><strong>${a.oldAtlas?'detected':'none'}</strong></span></div>`;document.documentElement.dataset.v93Telemetry='ready';sendProfile();};
    addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(!/^maydayland:atlas-/.test(m.type||''))return;if(m.type==='maydayland:atlas-ready')T.atlasReady=true;if(m.type==='maydayland:atlas-profile-ack'||m.type==='maydayland:atlas-state')T.acks++;setTimeout(render,40)});
    try{new PerformanceObserver(list=>{for(const e of list.getEntries()){T.longTasks++;T.maxLongTask=Math.max(T.maxLongTask,e.duration||0)}sendProfile();}).observe({type:'longtask',buffered:true})}catch{}
    addEventListener('maydayland:shell-rendered',()=>setTimeout(render,120));addEventListener('hashchange',()=>setTimeout(render,220));document.addEventListener('DOMContentLoaded',()=>setTimeout(render,1800),{once:true});addEventListener('pageshow',()=>setTimeout(render,360));addEventListener('load',()=>setTimeout(render,700),{once:true});
  })();
  </script>
