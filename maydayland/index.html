  <script>
  (()=>{
    'use strict';
    const ATLAS='./atlas-v74.html';
    const EXPECT={css:12,js:13};
    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));
      const live=document.querySelector('.v45-live b');if(live)live.textContent='v76 LIVE';
      const brand=document.querySelector('.v45-brand small');if(brand)brand.textContent='PRODUCT SYSTEM · v76.0.0';
      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v76 · homepage core-layer consolidation · 12 CSS / 13 JS budget';
      document.documentElement.dataset.maydaylandRelease='v76';
    };
    const audit=()=>{
      document.querySelector('.v76-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:49|50|51|52|53|54|56|57|58|59|60|73)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|48|49|51|52|53|54|56|57|58|59|60|73)\.js(?:\?|$)/.test(r.name)).length;
      const obsolete=local.some(r=>/\/app-v(?:61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!obsolete;
      const el=document.createElement('aside');el.className='v76-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V76 · HOME CORE AUDIT</small><b>${css} CSS · ${js} JS LOCAL</b><strong>${pass?'CORE CONSOLIDATION PASS':'CHECK'}</strong><span>${obsolete?'legacy v61–v67 detected':'v61–v67 homepage release layers removed'} · Atlas v74 retained</span>`;document.body.append(el);
      document.body.dataset.v76HomeAudit=pass?'pass':'check';
    };
    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(()=>{rewrite();document.title='Maydayland · Homepage Core Layer Consolidation v76';},1750);
      setTimeout(audit,2150);
      const app=document.querySelector('#app');if(app)new MutationObserver(()=>requestAnimationFrame(rewrite)).observe(app,{childList:true,subtree:true});
    },{once:true});
    addEventListener('load',()=>setTimeout(audit,260),{once:true});
  })();
  </script>
