dingClientRect(),pts=t.stops.map(s=>{let[x,y]=P(s.lng,s.lat);return[x/W*r.width,y/H*r.height]}),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);let mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);if(t.stops.length===1){mnx-=r.width*.18;mxx+=r.width*.18;mny-=r.height*.18;mxy+=r.height*.18}let sc=Math.max(1,Math.min(2.4,Math.min((r.width-160)/Math.max(80,mxx-mnx),(r.height-120)/Math.max(80,mxy-mny))));st.tf={...st.tf,s:sc,x:r.width/2-(mnx+mxx)/2*sc,y:r.height/2-(mny+mxy)/2*sc};apply()}function apply(){$('canvas').style.transform=`translate3d(${st.tf.x}px,${st.tf.y}px,0) scale(${st.tf.s}) rotate(${st.tf.r}deg)`}function meta(s){return[s.date,s.venue,s.phase].filter(Boolean).join(' · ')||'官方城市档案未列逐场日期'}function pop(s,i){let r=$('map').getBoundingClientRect(),[x,y]=P(s.lng,s.lat),px=x/W*r.width*st.tf.s+st.tf.x,py=y/H*r.height*st.tf.s+st.tf.y,p=$('pop');p.hidden=false;p.style.left=`${Math.min(Math.max(18,px+24),r.width-280)}px`;p.style.top=`${Math.min(Math.max(18,py-72),r.height-170)}px`;p.innerHTML=`<img src="${hero(st.tour)}"><b>${i+1}. ${E(s.city)}</b><p>${E(meta(s))}</p>`}function detail(t){$('detail').classList.add('on');$('detail').innerHTML=`<div class="detail" style="--c:${t.color}"><div class="hero"><img id="hero"><div class="hc"><small>${E(t.years)} · TOUR ROUTE</small><h2>${E(t.name)}</h2></div></div><div class="dbody"><p>${E(t.summary)}</p><div class="stats"><div class="stat"><b>${t.stops.length}</b><small>路线节点</small></div><div class="stat"><b>${new Set(t.stops.map(s=>s.city)).size}</b><small>城市/场馆</small></div></div><div class="sources"><a href="${E(t.source)}" target="_blank">官方资料来源</a>${t.secondary?`<a href="${E(t.secondary)}" target="_blank">补充官方页</a>`:''}<button data-play-tour>播放巡演歌单</button></div><div class="stops">${t.stops.map((s,i)=>`<button class="stop" data-stop="${i}" style="--c:${t.color}"><i>${i+1}</i><span><b>${E(s.city)}</b><small>${E(meta(s))}</small></span></button>`).join('')}</div></div></div>`;im($('hero'),hero(t))}function selTour(id){let t=D.tours.find(x=>x.id===id);if(!t)return;st.tour=t;st.stop=0;tours();route(t);detail(t);fit();selStop(0,false);$('world').textContent=t.name}function selStop(i,focus){st.stop=Math.max(0,Math.min(i,st.tour.stops.length-1));document.querySelectorAll('.node').forEach((n,k)=>n.classList.toggle('on',k===st.stop));let s=st.tour.stops[st.stop];pop(s,st.stop);detail(st.tour);document.querySelector(`.stop[data-stop="${st.stop}"]`)?.scrollIntoView({block:'center',behavior:'smooth'});if(focus){let r=$('map').getBoundingClientRect(),[x,y]=P(s.lng,s.lat);st.tf.s=Math.max(1.65,st.tf.s);st.tf.x=r.width/2-x/W*r.width*st.tf.s;st.tf.y=r.height/2-y/H*r.height*st.tf.s;apply()}}function view(v){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));if(v==='map')$('mapView').classList.add('on');else{$('archive').classList.add('on');if(v==='albums')albums();if(v==='songs')songs();if(v==='books')books();if(v==='timeline')timeline()}}function albums(){let a=D.albums;$('atitle').textContent='五月天时光唱片室';$('abody').innerHTML=`<div class="room"><div class="horn"></div><div class="shelf">${a.map((x,i)=>`<button class="album" data-album="${i}"><img src="${x.image}"><b>${E(x.title)}</b><small>${E((x.date||'').slice(0,4))}</small></button>`).join('')}</div><div class="adetail" id="ad"><img src="${a[0]?.image||LOGO}"><h3>${E(a[0]?.title||'五月天')}</h3><p>点击左侧 CD 盒，查看发行日期、曲目与时代笔记。</p><button data-play-album="0">播放专辑</button></div></div>`}async function showAlbum(i){let a=D.albums[i],ad=$('ad');ad.innerHTML=`<img src="${a.image}"><h3>${E(a.title)}</h3><p>${E(a.date)} · ${E(a.english)}</p><button data-play-album="${i}">播放专辑</button><ol class="tracks"><li>正在核对曲目…</li></ol>`;let tr=await albumTracks(a);ad.querySelector('.tracks').innerHTML=(tr.length?tr:['可使用歌曲搜索播放该专辑']).map(x=>`<li>${E(x)}</li>`).join('')}async function albumTracks(a){try{let r=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent('五月天 '+a.title)}&entity=album&country=TW&limit=10`),j=await r.json(),h=(j.results||[]).find(x=>/五月天|Mayday/i.test(x.artistName||''))||j.results?.[0];if(!h?.collectionId)return[];let l=await fetch(`https://itunes.apple.com/lookup?id=${h.collectionId}&entity=song&country=TW`),o=await l.json();return(o.results||[]).filter(x=>x.wrapperType==='track').map(x=>x.trackName)}catch{return[]}}function songs(){let p=[['五月天全宇宙','五月天','从专辑、现场与主题曲里随机出发',I.live],['回到那一天现场','五月天 回到那一天 Live','二十五周年巡演气氛',I.his],['蓝色三部曲','五月天 爱情万岁 人生海海','回到最初的蓝色年代',I.blue],['倔强大合唱','五月天 倔强 Live','立刻点燃现场',I.live],['温柔与知足','五月天 温柔 知足','安静但很五月天的夜晚',I.a9]].sort(()=>Math.random()-.5);$('atitle').textContent='全曲库搜索与随机歌单';$('abody').innerHTML=`<div class="grid">${p.map(x=>`<article class="card"><img src="${x[3]}"><div><small class="ey">MAYDAY PLAYLIST</small><h3>${E(x[0])}</h3><p>${E(x[2])}</p><button data-q="${E(x[1])}">播放推荐</button></div></article>`).join('')}</div>`}function bid(u){let id=(u||'').match(/(\d{10})/)?.[1]||'0011029694';return`${id.slice(0,3)}/${id.slice(3,6)}/${id.slice(6,8)}/${id}`}function books(){$('atitle').textContent='书籍与出版品';$('abody').innerHTML=`<div class="grid">${D.books.map(b=>`<article class="card"><img src="https://www.books.com.tw/img/${bid(b.url)}.jpg" onerror="this.src='${LOGO}'"><div><small class="ey">${E(b.year)} · ${E(b.publisher)}</small><h3>${E(b.title)}</h3><p>${E(b.note)}</p><a href="${E(b.url)}" target="_blank">查看出版资料</a></div></article>`).join('')}</div>`}function timeline(){$('atitle').textContent='五月天历程档案';$('abody').innerHTML=D.timeline.map(([y,t,p])=>`<div class="time"><time>${E(y)}</time><i></i><div><h3>${E(t)}</h3><p>${E(p)}</p></div></div>`).join('')}async function api(u,t=6500){let c=new AbortController(),m=setTimeout(()=>c.abort(),t);try{let r=await fetch(u,{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(m)}}function norm(x,s){return{id:String(x.id||''),name:String(x.name||x.title||''),artist:Array.isArray(x.artist)?x.artist.join(' / '):String(x.artist||'五月天'),album:String(x.album||''),pic:x.pic_id||'',source:x.source||s}}async function searchSongs(q){let jobs=['netease','kuwo','qq','migu'].map(async s=>{let d=await api(`${API}?types=search&source=${s}&name=${encodeURIComponent(q)}&count=30&pages=1`,5200);return(Array.isArray(d)?d:[]).map(x=>norm(x,s)).filter(x=>x.id&&/五月天|Mayday/i.test(`${x.artist} ${x.album} ${x.name}`))});let f=[];try{f=await Promise.any(jobs)}catch{}let all=await Promise.allSettled(jobs),m=new Map;[...f,...all.flatMap(r=>r.status==='fulfilled'?r.value:[])].forEach(x=>m.set(`${x.source}:${x.id}`,x));return[...m.values()]}function cover(t){return t?.pic?`${API}?types=pic&id=${encodeURIComponent(t.pic)}&source=${t.source}&size=600`:LOGO}async function resolve(t){for(let br of[320,192,128])try{let d=await api(`${API}?types=url&id=${encodeURIComponent(t.id)}&source=${t.source}&br=${br}`,5000);if(d?.url)return String(d.url).replace(/^http:/,'https:')}catch{}return''}function upd(){let t=st.cur;im($('cover'),cover(t));im($('fcover'),cover(t));$('title').textContent=$('ftitle').textContent=t?.name||'五月天 Forever Radio';$('artist').textContent=$('fartist').textContent=t?.artist||'五月天';$('world').textContent=$('fworld').textContent=st.tour?.name||'MAYDAYLAND RADIO'}async function playAt(i){if(!st.tracks.length)return;st.i=(i+st.tracks.length)%st.tracks.length;st.cur=st.tracks[st.i];upd();let u=await resolve(st.cur);if(!u)return playAt(st.i+1);$('audio').src=u;$('audio').load();lyrics(st.cur);try{await $('audio').play();$('unlock').hidden=true}catch{$('unlock').hidden=false}}async function start(q='五月天'){let rows=await searchSongs(q);if(rows.length){st.tracks=rows.sort(()=>Math.random()-.5);playAt(0)}}async function lyrics(t){$('lyrics').innerHTML='<p>正在载入歌词…</p>';try{let d=await api(`${API}?types=lyric&id=${encodeURIComponent(t.id)}&source=${t.source}`,6000),raw=typeof d==='string'?d:(d.lyric||d.lrc?.l
