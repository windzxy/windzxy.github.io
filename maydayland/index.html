    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));

      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v78 · consolidated media assurance · 9 CSS / 10 JS budget';
      document.documentElement.dataset.maydaylandRelease='v78';
    };
    const audit=()=>{
      document.querySelector('.v78-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:49|50|51|52|53|54|73|77|78-media)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|48|49|51|52|53|54|73|77|78-media)\.js(?:\?|$)/.test(r.name)).length;
      const obsolete=local.some(r=>/\/app-v(?:56|57|58|59|60|61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const chronology=document.querySelector('.v60-chronology');
      const integrity=document.querySelector('#v56Integrity');
      const evidence=document.querySelector('#v57Evidence');
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!obsolete&&!!chronology&&!!integrity&&!!evidence;
      const el=document.createElement('aside');el.className='v78-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V78 · MEDIA ASSURANCE AUDIT</small><b>${css} CSS · ${js} JS LOCAL</b><strong>${pass?'CONSOLIDATION PASS':'CHECK'}</strong><span>${obsolete?'legacy v56–v67 detected':'v56/v57 merged'} · integrity ${integrity?'ready':'waiting'} · evidence ${evidence?'ready':'waiting'}</span>`;document.body.append(el);
      document.body.dataset.v78HomeAudit=pass?'pass':'check';

      const app=document.querySelector('#app');if(app)new MutationObserver(()=>requestAnimationFrame(rewrite)).observe(app,{childList:true,subtree:true});

    },{once:true});
    addEventListener('load',()=>setTimeout(audit,520),{once:true});
  })();
