    .v82-budget{position:fixed;left:14px;bottom:14px;z-index:9998;display:grid;gap:3px;min-width:250px;padding:10px 12px;border:1px solid rgba(125,230,189,.2);border-radius:12px;background:rgba(4,10,20,.84);backdrop-filter:blur(14px);box-shadow:0 12px 36px rgba(0,0,0,.22);font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:#b8cadb;pointer-events:none}.v82-budget small{letter-spacing:.12em;color:#6f8aa2}.v82-budget b{font-size:13px;color:#eafff7}.v82-budget strong{color:#7de6bd}.v82-budget.is-warn strong{color:#ffb57d}@media(max-width:720px){.v82-budget{left:8px;bottom:8px;min-width:0;max-width:calc(100vw - 16px);padding:8px 10px}}

<body>
  <div id="app"></div>
  <script>window.MAYDAYLAND_BUILD={version:'v82',release:'core-css-convergence-live-atlas',events:58,cities:9,segments:8,pending:['tokyo'],homeLocalRequestBudget:{css:6,js:8,total:14,imports:0},atlas:'v74'};</script>
  <script src="./app-v47.js?v=82.0.0" defer></script>

  <script src="./app-v79-media-core.js?v=82.0.0" defer></script>
  <script src="./app-v78-media.js?v=82.0.0" defer></script>
  <script src="./app-v77.js?v=82.0.0" defer></script>
  <script src="./app-v73.js?v=82.0.0" defer></script>
  <script>
  (()=>{
    'use strict';
    const ATLAS='./atlas-v74.html';
    const EXPECT={css:6,js:8};
    const rewrite=()=>{
      document.querySelectorAll('a[href*="atlas-v61.html"],a[href*="atlas-v62.html"],a[href*="atlas-v63.html"],a[href*="atlas-v64.html"],a[href*="atlas-v69.html"],a[href*="atlas-v70.html"],a[href*="atlas-v71.html"],a[href*="atlas-v72.html"],a[href*="atlas-v73.html"]').forEach(a=>a.setAttribute('href',ATLAS));
      document.querySelectorAll('iframe[src*="atlas-v43.html"],iframe[src*="atlas-v61.html"],iframe[src*="atlas-v64.html"],iframe[src*="atlas-v69.html"],iframe[src*="atlas-v72.html"],iframe[src*="atlas-v73.html"]').forEach(f=>{if(!f.src.includes('atlas-v74.html'))f.setAttribute('src',ATLAS)});
      const live=document.querySelector('.v45-live b');if(live)live.textContent='v82 LIVE';
      const brand=document.querySelector('.v45-brand small');if(brand)brand.textContent='PRODUCT SYSTEM · v82.0.0';
      const foot=document.querySelector('.v45-footer');if(foot)foot.textContent='Maydayland v82 · consolidated core CSS · live Atlas v74';
      document.documentElement.dataset.maydaylandRelease='v82';
    };
    const audit=()=>{
      document.querySelector('.v82-budget')?.remove();
      const res=performance.getEntriesByType?.('resource')||[];
      const local=res.filter(r=>{try{return new URL(r.name).origin===location.origin}catch{return false}});
      const css=local.filter(r=>/\/app-v(?:82-core|81-services|79-media-core|78-media|77|73)\.css(?:\?|$)/.test(r.name)).length;
      const js=local.filter(r=>/\/app-v(?:47|48|49|81-services|79-media-core|78-media|77|73)\.js(?:\?|$)/.test(r.name)).length;
      const legacyCoreCss=local.some(r=>/\/app-v(?:45|46|47|48|49)\.css(?:\?|$)/.test(r.name));
      const oldServices=local.some(r=>/\/app-v(?:51|52)\.(?:css|js)(?:\?|$)/.test(r.name));
      const obsolete=local.some(r=>/\/app-v(?:50|53|54|56|57|58|59|60|61|62|63|64|65|66|67)\.(?:css|js)(?:\?|$)/.test(r.name));
      const coreCss=[...document.styleSheets].filter(s=>/app-v82-core\.css/.test(s.href||'')).length===1;
      const imported=[...document.styleSheets].some(s=>{try{return [...s.cssRules].some(r=>r.type===CSSRule.IMPORT_RULE)}catch{return false}});
      const iframe=document.querySelector('.v45-atlas iframe');
      const atlasLive=!!iframe&&/atlas-v74\.html(?:\?|$)/.test(iframe.getAttribute('src')||'');
      const chronology=document.querySelector('.v60-chronology');
      const integrity=document.querySelector('#v56Integrity');
      const evidence=document.querySelector('#v57Evidence');
      const mediaCore=document.body.dataset.v79MediaCore==='ready';
      const registry=document.querySelector('#v79Registry');
      const health=document.querySelector('#v79Health');
      const search=document.querySelector('#v51SearchLauncher');
      const pass=css<=EXPECT.css&&js<=EXPECT.js&&!legacyCoreCss&&!oldServices&&!obsolete&&coreCss&&!imported&&atlasLive&&!!chronology&&!!integrity&&!!evidence&&mediaCore&&!!registry&&!!health&&!!search;
      const el=document.createElement('aside');el.className='v82-budget'+(pass?'':' is-warn');el.setAttribute('role','status');el.innerHTML=`<small>V82 · CORE CONVERGENCE</small><b>${css} CSS · ${js} JS RUNTIME</b><strong>${pass?'CORE PASS':'CHECK'}</strong><span>imports ${imported?'check':'0'} · Atlas ${atlasLive?'v74 live':'check'} · A–F core ${coreCss?'bundled':'waiting'}</span>`;document.body.append(el);
      document.body.dataset.v82HomeAudit=pass?'pass':'check';
    };
    document.addEventListener('DOMContentLoaded',()=>{
      setTimeout(()=>{rewrite();document.title='Maydayland · Core CSS Convergence v82';},1750);
      setTimeout(audit,3000);
      const app=document.querySelector('#app');if(app)new MutationObserver(()=>requestAnimationFrame(rewrite)).observe(app,{childList:true,subtree:true});
      addEventListener('maydayland:chronology-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:media-core-ready',()=>setTimeout(audit,180));
      addEventListener('maydayland:services-ready',()=>setTimeout(audit,220));
    },{once:true});
    addEventListener('load',()=>setTimeout(audit,760),{once:true});
  })();
  </script>
</body>
</html>
