  <script id="maydayland-runtime-audit">
  (()=>{
    const paint=(state,detail)=>{const e=document.querySelector('[data-safe-status]');if(!e)return;e.textContent=state+(detail?' · '+detail:'');};
    addEventListener('error',e=>{const src=e.filename?e.filename.split('/').pop():'';paint('互動層錯誤',src||e.message||'runtime error')},true);
    addEventListener('unhandledrejection',e=>paint('互動層 Promise 錯誤',String(e.reason||'unknown').slice(0,90)));
    addEventListener('DOMContentLoaded',()=>{setTimeout(()=>{
      const ready=/^v119-repaired-ready$/.test(document.documentElement.dataset.maydaylandRuntime||'');
      if(!ready&&document.getElementById('maydayland-static-fallback'))paint('BASE AUDIT · repaired v119 未啟動','已隔離 v120/v123/mobile');
    },2200);},{once:true});
  })();
  </script>
