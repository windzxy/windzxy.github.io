<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How To Chat Better</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#151515;--muted:#73736d;--line:#e8e8e2;--soft:#f7f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif}
button,input{font:inherit}.wrap{max-width:1140px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05)}
.nav{height:62px;display:flex;align-items:center;gap:10px}.brand{font-weight:800;letter-spacing:-.03em}.spacer{flex:1}
.langs,.row{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.langs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.langbtn,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#5d5d57;white-space:nowrap;cursor:pointer}
.langbtn{padding:7px 10px;font-size:12px}.active{background:#171717!important;color:#fff!important;border-color:#171717!important}
.hero{padding:58px 0 28px}h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.06em;margin:0 0 24px;max-width:860px}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 10px 28px rgba(0,0,0,.04)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 14px;font-size:16px}.search button{border:0;background:#171717;color:#fff;border-radius:13px;padding:0 16px;cursor:pointer}
.controls{padding:10px 0 22px}.control{margin-top:12px}.label{font-size:11px;font-weight:800;letter-spacing:.09em;color:#8b8b84;margin-bottom:7px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.meta{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:4px;height:4px;border-radius:50%;background:#bbb}.card h3{font-size:20px;margin:10px 0 8px;letter-spacing:-.025em}.reply{background:var(--soft);border-radius:14px;padding:14px 15px;line-height:1.7;min-height:82px}
.actions{margin-top:10px}.copy{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;cursor:pointer;color:#555}
.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:60px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#171717;color:#fff;border-radius:10px;padding:9px 13px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.wrap{padding:0 14px}.nav{height:56px}.hero{padding:40px 0 22px}h1{font-size:46px}.grid{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">How To Chat Better</div><div class="spacer"></div><div class="langs" id="uiLangs"></div></div></header>

<main>
<section class="hero"><div class="wrap">
<h1 id="heroTitle"></h1>
<div class="search"><input id="q"><button id="randomBtn"></button></div>
</div></section>

<section class="wrap">
<div class="controls">
  <div class="control"><div class="label" id="domainLabel"></div><div class="row" id="domainFilters"></div></div>
  <div class="control"><div class="label" id="replyLangLabel"></div><div class="row" id="replyLangs"></div></div>
  <div class="control"><div class="label" id="styleLabel"></div><div class="row" id="styles"></div></div>
</div>
<div class="grid" id="grid"></div>
</section>
</main>

<div class="toast" id="toast"></div>
<script src="./data.js"></script><script src="./i18n-data.js"></script><script src="./bulk-a.js"></script><script src="./bulk-b.js"></script>
<script>
(function(){
var S=window.CHAT_SCENARIOS||[];
var ui="hant",domain="all",replyLang="zh",style="formal";
var T={
 hant:{title:"把話說得更合適。",search:"搜尋情境…",random:"隨機",domain:"情境",replyLang:"回話語言",style:"風格",copy:"複製",copied:"已複製",empty:"沒有找到相符情境",all:"全部",workplace:"職場",study:"學習",family:"家庭",parenting:"育兒",elder:"長輩",friends:"朋友",formal:"正式",dark:"腹黑",roast:"吐槽",zh:"中文",en:"English",yue:"粵語"},
 hans:{title:"把话说得更合适。",search:"搜索情境…",random:"随机",domain:"情境",replyLang:"回复语言",style:"风格",copy:"复制",copied:"已复制",empty:"没有找到相符情境",all:"全部",workplace:"职场",study:"学习",family:"家庭",parenting:"育儿",elder:"长辈",friends:"朋友",formal:"正式",dark:"腹黑",roast:"吐槽",zh:"中文",en:"English",yue:"粤语"},
 en:{title:"Say it better.",search:"Search situations…",random:"Random",domain:"Situation",replyLang:"Reply language",style:"Style",copy:"Copy",copied:"Copied",empty:"No matching situation",all:"All",workplace:"Work",study:"Study",family:"Family",parenting:"Parenting",elder:"Elders",friends:"Friends",formal:"Formal",dark:"Dark",roast:"Roast",zh:"Chinese",en:"English",yue:"Cantonese"}
};
var domainLabels={}; S.forEach(function(s){if(s.domain&&s.domainLabel)domainLabels[s.domain]=s.domainLabel}); var domains=["all"].concat(Array.from(new Set(S.map(function(s){return domainKey(s)}).filter(function(k){return k&&k!=="all"}))));
var replyLangs=["zh","en","yue"],styles=["formal","dark","roast"];
function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]})}
function txt(v){if(v==null)return"";if(typeof v==="string")return v;return v[ui]||v.hant||v.hans||v.en||""}
function getReply(s){
 if(s.replies&&s.replies[replyLang]){
   var v=s.replies[replyLang][style];return txt(v);
 }
 if(replyLang==="zh")return s[style]||s.formal||"";
 if(replyLang==="en")return s.english||"";
 return s.cantonese||"";
}
function meta(s){
 if(s.relation)return txt(s.relation)+" · "+txt(s.goal);
 return (s.r||"")+" · "+(s.g||"");
}
function title(s){return s.title?txt(s.title):(s.t||"")}
function domainKey(s){
 if(s.domain)return s.domain;
 return {"職場":"workplace","學習":"study","家庭":"family","育兒":"parenting","長輩":"elder","朋友":"friends"}[s.d]||"all";
}
function renderControls(){
 document.documentElement.lang=ui==="hans"?"zh-Hans":ui==="hant"?"zh-Hant":"en";
 document.getElementById("heroTitle").textContent=T[ui].title;
 document.getElementById("q").placeholder=T[ui].search;
 document.getElementById("randomBtn").textContent=T[ui].random;
 document.getElementById("domainLabel").textContent=T[ui].domain;
 document.getElementById("replyLangLabel").textContent=T[ui].replyLang;
 document.getElementById("styleLabel").textContent=T[ui].style;
 document.getElementById("uiLangs").innerHTML=[
  ["hans","简中"],["hant","繁中"],["en","EN"]
 ].map(function(x){return '<button class="langbtn '+(ui===x[0]?'active':'')+'" data-ui="'+x[0]+'">'+x[1]+'</button>'}).join("");
 document.getElementById("domainFilters").innerHTML=domains.map(function(k){var label=k==="all"?T[ui].all:txt(domainLabels[k]||k);return '<button class="chip '+(domain===k?'active':'')+'" data-domain="'+k+'">'+label+'</button>'}).join("");
 document.getElementById("replyLangs").innerHTML=replyLangs.map(function(k){return '<button class="chip '+(replyLang===k?'active':'')+'" data-replylang="'+k+'">'+T[ui][k]+'</button>'}).join("");
 document.getElementById("styles").innerHTML=styles.map(function(k){return '<button class="chip '+(style===k?'active':'')+'" data-style="'+k+'">'+T[ui][k]+'</button>'}).join("");
}
function rows(){
 var q=document.getElementById("q").value.trim().toLowerCase();
 return S.filter(function(s){
  if(domain!=="all"&&domainKey(s)!==domain)return false;
  if(!q)return true;
  var h=[title(s),meta(s),getReply(s),s.t,s.r,s.g,s.x].join(" ").toLowerCase();
  return h.indexOf(q)>=0;
 });
}
function render(){
 var r=rows(),grid=document.getElementById("grid");
 if(!r.length){grid.innerHTML='<div class="empty">'+T[ui].empty+'</div>';return}
 grid.innerHTML=r.map(function(s){
  return '<article class="card"><div class="meta">'+esc(meta(s))+'</div><h3>'+esc(title(s))+'</h3><div class="reply">'+esc(getReply(s))+'</div><div class="actions"><button class="copy" data-id="'+esc(s.id||String(S.indexOf(s)))+'">'+T[ui].copy+'</button></div></article>';
 }).join("");
}
document.addEventListener("click",function(e){
 var v;
 if((v=e.target.getAttribute("data-ui"))){ui=v;localStorage.setItem("htcb-ui",ui);renderControls();render();return}
 if((v=e.target.getAttribute("data-domain"))){domain=v;renderControls();render();return}
 if((v=e.target.getAttribute("data-replylang"))){replyLang=v;renderControls();render();return}
 if((v=e.target.getAttribute("data-style"))){style=v;renderControls();render();return}
 if(e.target.classList.contains("copy")){
  var id=e.target.getAttribute("data-id");
  var s=S.find(function(x,i){return (x.id||String(i))===id});
  navigator.clipboard.writeText(getReply(s));
  var toast=document.getElementById("toast");toast.textContent=T[ui].copied;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show")},900);
 }
});
document.getElementById("q").addEventListener("input",render);
document.getElementById("randomBtn").addEventListener("click",function(){if(!S.length)return;var s=S[Math.floor(Math.random()*S.length)];document.getElementById("q").value=title(s);render()});
ui=localStorage.getItem("htcb-ui")||"hant";renderControls();render();
})();
</script>
</body>
</html>
