:root{--bg:#f5f5f2;--card:#fff;--ink:#151515;--muted:#73736d;--line:#e8e8e2;--soft:#f7f7f4}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1140px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05)}
.nav{height:62px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em}
.brand svg{width:27px;height:27px;flex:none}
.spacer{flex:1}
.langs,.row{display:flex;gap:7px;overflow:auto;scrollbar-width:none;flex-wrap:nowrap}
.langs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.langbtn,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#5d5d57;white-space:nowrap;flex:0 0 auto}
.langbtn{padding:7px 10px;font-size:12px}
.active{background:#171717!important;color:#fff!important;border-color:#171717!important}

.hero{padding:46px 0 18px}
h1{font-size:clamp(42px,6.8vw,70px);line-height:1.02;letter-spacing:-.058em;margin:0 0 22px;max-width:940px}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 10px 28px rgba(0,0,0,.04)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 14px;font-size:16px}
.search button{border:0;background:#171717;color:#fff;border-radius:13px;padding:0 16px}

.controls{padding:6px 0 8px}
#domainFilters{gap:6px;overflow:visible}
#domainFilters .chip{padding:7px 10px;font-size:14px}
@media(min-width:900px){
  #domainFilters{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%}
  #domainFilters .chip{width:100%;padding:7px 6px;text-align:center}
}
.control{margin-top:11px}
.label{font-size:11px;font-weight:800;letter-spacing:.09em;color:#8b8b84;margin-bottom:7px;text-transform:uppercase}

.deck-section{padding:22px 0 70px}
.deck-shell{max-width:720px;margin:0 auto}
.deck{position:relative;height:410px;perspective:1200px;touch-action:pan-y}
.play-card{
 position:absolute;left:50%;top:0;width:min(640px,92vw);min-height:350px;
 background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;
 box-shadow:0 22px 60px rgba(0,0,0,.08);
 transform-origin:50% 95%;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s ease,box-shadow .25s ease;
 user-select:none;
}
.play-card[data-depth="0"]{z-index:3;transform:translateX(-50%) translateY(0) scale(1) rotate(0deg)}
.play-card[data-depth="1"]{z-index:2;transform:translateX(-50%) translateY(18px) scale(.965) rotate(-1.3deg);opacity:.9;box-shadow:0 14px 36px rgba(0,0,0,.055)}
.play-card[data-depth="2"]{z-index:1;transform:translateX(-50%) translateY(34px) scale(.93) rotate(1.4deg);opacity:.72;box-shadow:0 10px 24px rgba(0,0,0,.035)}
.play-card.throw-left{transform:translateX(-155%) translateY(12px) rotate(-14deg)!important;opacity:0}
.play-card.throw-right{transform:translateX(55%) translateY(12px) rotate(14deg)!important;opacity:0}
.play-card.dragging{transition:none!important}
.card-inner{position:relative;min-height:294px;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.2,.75,.2,1)}
.play-card.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.card-back{transform:rotateY(180deg)}
.suit-corner{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.topic-icon{width:38px;height:38px;display:block;color:#111827}.topic-icon svg{width:100%;height:100%;display:block}
.suit-label{font-size:10px;color:#999;margin-top:5px;max-width:82px;text-align:center}
.face-center{flex:1;display:flex;flex-direction:column;justify-content:center}
.back-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#999;text-transform:uppercase;margin-bottom:10px}
.flip{border:0;background:transparent;padding:8px 0;color:#777}
.play-card[data-depth="1"] .card-inner,.play-card[data-depth="2"] .card-inner{pointer-events:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}
.meta{font-size:13px;color:var(--muted)}
.card-no{font-size:12px;color:#a0a099}
.play-card h2{font-size:clamp(27px,4vw,38px);line-height:1.2;letter-spacing:-.045em;margin:0;max-width:84%}
.reply{background:var(--soft);border-radius:18px;padding:20px;line-height:1.8;font-size:17px;min-height:150px;display:flex;align-items:center}
.card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.copy{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 13px;color:#555}.another{margin-left:7px}
.hint{font-size:12px;color:#aaa}

.deck-nav{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:22px}
.deck-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 15px;color:#555}
.deck-btn.primary{background:#171717;color:#fff;border-color:#171717}

.empty{text-align:center;color:var(--muted);padding:90px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#171717;color:#fff;border-radius:10px;padding:9px 13px;transition:.18s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:899px){
 #domainFilters{display:flex;overflow-x:auto}
 #domainFilters .chip{width:auto;padding:8px 12px}
}
@media(max-width:720px){
 .wrap{padding:0 14px}
 .nav{height:52px}
 .brand span{display:none}
 .brand svg{width:25px;height:25px}
 .langs{gap:6px}
 .langbtn{padding:6px 11px;font-size:12px}

 .hero{padding:22px 0 10px}
 h1{font-size:clamp(36px,10.5vw,40px);line-height:1.06;letter-spacing:-.052em;margin-bottom:16px;max-width:96%}
 .search{padding:6px;border-radius:18px;gap:6px}
 .search input{padding:10px 12px;font-size:15px}
 .search button{border-radius:12px;padding:0 15px;min-height:44px}

 .controls{padding:2px 0 4px}
 .control{margin-top:9px}
 .label{margin-bottom:6px;font-size:10px}
 #domainFilters{gap:6px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding-bottom:2px}
 #domainFilters .chip{padding:7px 11px;font-size:13px;scroll-snap-align:start}
 #replyLangs .chip{padding:7px 12px;font-size:13px}

 .deck-section{padding-top:10px;padding-bottom:58px}
 .deck{height:404px}
 .play-card{width:min(640px,94vw);padding:19px;border-radius:22px;min-height:345px}
 .card-inner{min-height:305px}
 .card-top{margin-bottom:18px}
 .meta{font-size:12px}
 .topic-icon{width:34px;height:34px}
 .suit-label{font-size:9px;margin-top:4px}
 .play-card h2{font-size:25px;line-height:1.18;max-width:100%}
 .reply{font-size:15px;line-height:1.7;min-height:128px;padding:17px}
 .card-actions{margin-top:16px}
 .copy{padding:8px 11px}
 .hint{display:none}
 .deck-nav{gap:7px;margin-top:16px}
 .deck-btn{padding:9px 11px}
}
</style>

 }).join("");
}

function buildRows(){
 var q=document.getElementById("q").value.trim().toLowerCase();
 currentRows=S.filter(function(s){
  if(domain!=="all"&&s.domain!==domain)return false;
  if(!q)return true;
  var hay=[s.title.hant,s.title.hans,s.title.en,s.relation.hant,s.relation.hans,s.relation.en,s.goal.hant,s.goal.hans,s.goal.en,getReply(s)].join(" ").toLowerCase();
  return hay.indexOf(q)>=0;
 });
 if(deckIndex>=currentRows.length)deckIndex=0;
}

function cardHTML(s,depth,index){
 var isFlip=depth===0&&flippedId===s.id;
 return '<article class="play-card '+(isFlip?'flipped':'')+'" data-depth="'+depth+'" data-id="'+esc(s.id)+'">'+
  '<div class="card-inner">'+
   '<section class="card-face card-front">'+
    '<div class="card-top"><div class="meta">'+esc(meta(s))+'</div></div>'+
    '<div class="suit-corner">'+topicIcon(s.domain)+'<span class="suit-label">'+esc(txt(s.domainLabel))+'</span></div>'+
    '<div class="face-center"><h2>'+esc(title(s))+'</h2></div>'+
    '<div class="card-actions"><button class="flip" data-flip="'+esc(s.id)+'">'+T[ui].flip+'</button><span class="hint">'+T[ui].swipe+'</span></div>'+
   '</section>'+
   '<section class="card-face card-back">'+
    '<div class="card-top"><div class="back-label">'+T[ui].answer+'</div></div>'+
    '<div class="face-center"><div class="reply">'+esc(getReply(s))+'</div></div>'+
    '<div class="card-actions"><div><button class="copy" data-id="'+esc(s.id)+'">'+T[ui].copy+'</button><button class="copy another" data-another="'+esc(s.id)+'"'+(repliesExhausted(s)?' disabled':'')+'>'+(repliesExhausted(s)?T[ui].exhausted:T[ui].another)+'</button></div><button class="flip" data-flip="'+esc(s.id)+'">'+T[ui].front+'</button></div>'+
   '</section>'+
  '</div>'+
 '</article>';
}

function renderDeck(){
 buildRows();
 var deck=document.getElementById("deck"),nav=document.getElementById("deckNav");
 if(!currentRows.length){
  deck.innerHTML='<div class="empty">'+T[ui].empty+'</div>';
  
  nav.style.opacity=.45;
  return;
 }
 nav.style.opacity=1;
 var html="";
 for(var d=2;d>=0;d--){
  if(d>=currentRows.length)continue;
  var idx=(deckIndex+d)%currentRows.length;
  html+=cardHTML(currentRows[idx],d,idx);
 }
 deck.innerHTML=html;
 
 bindDrag();
}

function moveNext(direction){
 flippedId=null;
 if(currentRows.length<2)return;
 var top=document.querySelector('.play-card[data-depth="0"]');
 if(top){
  top.classList.add(direction==="left"?"throw-left":"throw-right");
  setTimeout(function(){
   deckIndex=(deckIndex+1)%currentRows.length;
   renderDeck();
  },220);
 }else{
  deckIndex=(deckIndex+1)%currentRows.length;renderDeck();
 }
}
function movePrev(){
 flippedId=null;
 if(!currentRows.length)return;
 deckIndex=(deckIndex-1+currentRows.length)%currentRows.length;
 renderDeck();
}
function shuffle(){
 flippedId=null;
 for(var i=currentRows.length-1;i>0;i--){
  var j=Math.floor(Math.random()*(i+1)),tmp=currentRows[i];currentRows[i]=currentRows[j];currentRows[j]=tmp;
 }
 if(currentRows.length){deckIndex=Math.floor(Math.random()*currentRows.length)}
 renderDeck();
}

function bindDrag(){
 var top=document.querySelector('.play-card[data-depth="0"]');
 if(!top)return;
 top.addEventListener("pointerdown",function(e){
  if(e.target.closest("button"))return;
  dragging=true;wasDragged=false;dragStartX=e.clientX;dragX=0;top.setPointerCapture(e.pointerId);top.classList.add("dragging");
 });
 top.addEventListener("pointermove",function(e){
  if(!dragging)return;
  dragX=e.clientX-dragStartX;
  if(Math.abs(dragX)>8)wasDragged=true;
  var rot=Math.max(-8,Math.min(8,dragX/20));
  top.style.transform="translateX(calc(-50% + "+dragX+"px)) rotate("+rot+"deg)";
 });
 function end(){
  if(!dragging)return;
  dragging=false;top.classList.remove("dragging");
  top.style.transform="";
  if(Math.abs(dragX)>70)moveNext(dragX<0?"left":"right");
  dragX=0;
 }
 top.addEventListener("pointerup",end);
 top.addEventListener("pointercancel",end);
}

document.addEventListener("click",function(e){
 var v;
 if((v=e.target.getAttribute("data-ui"))){ui=v;flippedId=null;localStorage.setItem("htcb-ui",ui);renderControls();renderDeck();return}
 if((v=e.target.getAttribute("data-domain"))){domain=v;deckIndex=0;flippedId=null;renderControls();renderDeck();return}
 if((v=e.target.getAttribute("data-replylang"))){replyLang=v;deckIndex=0;flippedId=null;renderControls();renderDeck();return}
 var card=e.target.closest('.play-card[data-depth="0"]');
 if(card&&!e.target.closest("button")&&!wasDragged){var cid=card.getAttribute("data-id");flippedId=flippedId===cid?null:cid;renderDeck();return}
 if(wasDragged){wasDragged=false;return}
 var aid=e.target.getAttribute("data-another");
 if(aid){var as=S.find(function(x){return x.id===aid});if(as){nextReply(as);flippedId=aid;renderDeck()}return}
 var fid=e.target.getAttribute("data-flip");
 if(fid){flippedId=flippedId===fid?null:fid;renderDeck();return}
 if(e.target.classList.contains("copy")){
  var id=e.target.getAttribute("data-id"),s=S.find(function(x){return x.id===id});
  navigator.clipboard.writeText(getReply(s));
  var toast=document.getElementById("toast");toast.textContent=T[ui].copied;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show")},900);
 }
});

document.getElementById("q").addEventListener("input",function(){deckIndex=0;renderDeck()});
document.getElementById("randomBtn").addEventListener("click",function(){
 document.getElementById("q").value="";domain="all";buildRows();
 if(currentRows.length)deckIndex=Math.floor(Math.random()*currentRows.length);
 renderControls();renderDeck();
});
document.getElementById("nextBtn").addEventListener("click",function(){moveNext("left")});
document.getElementById("prevBtn").addEventListener("click",movePrev);
document.getElementById("shuffleBtn").addEventListener("click",shuffle);
document.addEventListener("keydown",function(e){
 if(e.key==="ArrowRight")moveNext("left");
 if(e.key==="ArrowLeft")movePrev();
});

ui=localStorage.getItem("htcb-ui")||"hant";if(!T[ui])ui="hant";
renderControls();
buildRows();
if(currentRows.length){
 var lastOpen=localStorage.getItem("htcb-last-open")||"";
 var choices=[];
 for(var oi=0;oi<currentRows.length;oi++){
  if(currentRows.length===1||currentRows[oi].id!==lastOpen)choices.push(oi);
 }
 deckIndex=choices[Math.floor(Math.random()*choices.length)];
 localStorage.setItem("htcb-last-open",currentRows[deckIndex].id);
}
renderDeck();
})();
</script>
</body>
</html>
