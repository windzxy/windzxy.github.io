<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How To Chat Better</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20x%3D'3'%20y%3D'3'%20width%3D'58'%20height%3D'58'%20rx%3D'14'%20fill%3D'%23f7f3eb'%2F%3E%3Cpath%20d%3D'M14%2018c0-5%204-9%209-9h16c5%200%209%204%209%209v7c0%205-4%209-9%209H27l-8%206v-7c-3-2-5-5-5-8v-7Z'%20fill%3D'none'%20stroke%3D'%23101827'%20stroke-width%3D'5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3Cpath%20d%3D'M28%2032c0-5%204-9%209-9h8c5%200%209%204%209%209v7c0%204-2%207-5%208v7l-8-6h-4c-5%200-9-4-9-9v-7Z'%20fill%3D'none'%20stroke%3D'%23101827'%20stroke-width%3D'5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E">
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#151515;--muted:#73736d;--line:#e8e8e2;--soft:#f7f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif}
button,input{font:inherit}.wrap{max-width:1140px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05)}
.nav{height:62px;display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em}.brand svg{width:26px;height:26px;flex:none}.spacer{flex:1}
.langs,.row{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.langs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.langbtn,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#5d5d57;white-space:nowrap;cursor:pointer}
.langbtn{padding:7px 10px;font-size:12px}.active{background:#171717!important;color:#fff!important;border-color:#171717!important}
.hero{padding:52px 0 24px}h1{font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.06em;margin:0 0 24px;max-width:860px}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 10px 28px rgba(0,0,0,.04)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 14px;font-size:16px}.search button{border:0;background:#171717;color:#fff;border-radius:13px;padding:0 16px;cursor:pointer}
.controls{padding:10px 0 22px}.control{margin-top:12px}.label{font-size:11px;font-weight:800;letter-spacing:.09em;color:#8b8b84;margin-bottom:7px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.meta{font-size:12px;color:var(--muted)}.card h3{font-size:20px;margin:9px 0 9px;letter-spacing:-.025em}.reply{background:var(--soft);border-radius:14px;padding:14px 15px;line-height:1.7;min-height:82px}
.actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.copy{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;cursor:pointer;color:#555}.count{font-size:12px;color:#92928b}
.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:60px 0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#171717;color:#fff;border-radius:10px;padding:9px 13px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){.wrap{padding:0 14px}.nav{height:56px}.hero{padding:38px 0 20px}h1{font-size:46px}.grid{grid-template-columns:1fr}.card{padding:16px}.brand span{display:none}}
</style>
</head>
<body>
<header><div class="wrap nav">
<div class="brand">
<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="14" fill="#f7f3eb"/><path d="M14 18c0-5 4-9 9-9h16c5 0 9 4 9 9v7c0 5-4 9-9 9H27l-8 6v-7c-3-2-5-5-5-8v-7Z" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 32c0-5 4-9 9-9h8c5 0 9 4 9 9v7c0 4-2 7-5 8v7l-8-6h-4c-5 0-9-4-9-9v-7Z" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>How To Chat Better</span>
</div>
<div class="spacer"></div><div class="langs" id="uiLangs"></div>
</div></header>

<main>
<section class="hero"><div class="wrap">
<h1 id="heroTitle"></h1>
<div class="search"><input id="q"><button id="randomBtn"></button></div>
</div></section>

<section class="wrap">
<div class="controls">
  <div class="control"><div class="label" id="domainLabel"></div><div class="row" id="domainFilters"></div></div>
  <div class="control"><div class="label" id="replyLangLabel"></div><div class="row" id="replyLangs"></div></div>
  <div class="control"><div class="label" id="styleLabel"></div><div class="row" id="styles"></div></div>
</div>
<div class="grid" id="grid"></div>
</section>
</main>

<div class="toast" id="toast"></div>
<script src="./catalog.js"></script>
<script>
(function(){
var RAW=window.CHAT_SCENARIOS||[];
var ui="hant",domain="all",replyLang="zh",style="formal";
var T={
 hant:{title:"把話說得更合適。",search:"搜尋情境…",random:"隨機",domain:"情境",replyLang:"回話語言",style:"風格",copy:"複製",copied:"已複製",empty:"沒有找到相符情境",all:"全部",formal:"正式",dark:"腹黑",roast:"吐槽",zh:"中文",en:"English",yue:"粵語",items:"條"},
 hans:{title:"把话说得更合适。",search:"搜索情境…",random:"随机",domain:"情境",replyLang:"回复语言",style:"风格",copy:"复制",copied:"已复制",empty:"没有找到相符情境",all:"全部",formal:"正式",dark:"腹黑",roast:"吐槽",zh:"中文",en:"English",yue:"粤语",items:"条"},
 en:{title:"Say it better.",search:"Search situations…",random:"Random",domain:"Situation",replyLang:"Reply language",style:"Style",copy:"Copy",copied:"Copied",empty:"No matching situation",all:"All",formal:"Formal",dark:"Dark",roast:"Roast",zh:"Chinese",en:"English",yue:"Cantonese",items:"items"}
};
var replyLangs=["zh","en","yue"],styles=["formal","dark","roast"];

function validTri(v){return v&&typeof v==="object"&&typeof v.hant==="string"&&typeof v.hans==="string"&&typeof v.en==="string"}
function validReply(s){
 if(!s.replies||!s.replies.zh||!s.replies.en||!s.replies.yue)return false;
 return styles.every(function(k){
   return s.replies.zh[k]&&typeof s.replies.zh[k].hant==="string"&&typeof s.replies.zh[k].hans==="string"&&
          typeof s.replies.en[k]==="string"&&typeof s.replies.yue[k]==="string";
 });
}
var S=RAW.filter(function(s){return validTri(s.domainLabel)&&validTri(s.relation)&&validTri(s.goal)&&validTri(s.title)&&validReply(s)});
var domainLabels={};S.forEach(function(s){domainLabels[s.domain]=s.domainLabel});
var domains=["all"].concat(Array.from(new Set(S.map(function(s){return s.domain}))));

function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]})}
function txt(v){return v[ui]}
function getReply(s){
 if(replyLang==="zh")return s.replies.zh[style][ui==="hans"?"hans":"hant"];
 return s.replies[replyLang][style];
}
function meta(s){return txt(s.relation)+" · "+txt(s.goal)}
function title(s){return txt(s.title)}

function renderControls(){
 document.documentElement.lang=ui==="hans"?"zh-Hans":ui==="hant"?"zh-Hant":"en";
 document.getElementById("heroTitle").textContent=T[ui].title;
 document.getElementById("q").placeholder=T[ui].search;
 document.getElementById("randomBtn").textContent=T[ui].random;
 document.getElementById("domainLabel").textContent=T[ui].domain;
 document.getElementById("replyLangLabel").textContent=T[ui].replyLang;
 document.getElementById("styleLabel").textContent=T[ui].style;
 document.getElementById("uiLangs").innerHTML=[["hans","简中"],["hant","繁中"],["en","EN"]].map(function(x){return '<button class="langbtn '+(ui===x[0]?'active':'')+'" data-ui="'+x[0]+'">'+x[1]+'</button>'}).join("");
 document.getElementById("domainFilters").innerHTML=domains.map(function(k){var label=k==="all"?T[ui].all:domainLabels[k][ui];return '<button class="chip '+(domain===k?'active':'')+'" data-domain="'+k+'">'+esc(label)+'</button>'}).join("");
 document.getElementById("replyLangs").innerHTML=replyLangs.map(function(k){return '<button class="chip '+(replyLang===k?'active':'')+'" data-replylang="'+k+'">'+T[ui][k]+'</button>'}).join("");
 document.getElementById("styles").innerHTML=styles.map(function(k){return '<button class="chip '+(style===k?'active':'')+'" data-style="'+k+'">'+T[ui][k]+'</button>'}).join("");
}
function rows(){
 var q=document.getElementById("q").value.trim().toLowerCase();
 return S.filter(function(s){
   if(domain!=="all"&&s.domain!==domain)return false;
   if(!q)return true;
   var hay=[s.title.hant,s.title.hans,s.title.en,s.relation.hant,s.relation.hans,s.relation.en,s.goal.hant,s.goal.hans,s.goal.en,getReply(s)].join(" ").toLowerCase();
   return hay.indexOf(q)>=0;
 });
}
function render(){
 var r=rows(),grid=document.getElementById("grid");
 if(!r.length){grid.innerHTML='<div class="empty">'+T[ui].empty+'</div>';return}
 grid.innerHTML=r.map(function(s){
   return '<article class="card"><div class="meta">'+esc(meta(s))+'</div><h3>'+esc(title(s))+'</h3><div class="reply">'+esc(getReply(s))+'</div><div class="actions"><button class="copy" data-id="'+esc(s.id)+'">'+T[ui].copy+'</button><span class="count">'+S.indexOf(s)+1+' / '+S.length+'</span></div></article>';
 }).join("");
}
document.addEventListener("click",function(e){
 var v;
 if((v=e.target.getAttribute("data-ui"))){ui=v;localStorage.setItem("htcb-ui",ui);renderControls();render();return}
 if((v=e.target.getAttribute("data-domain"))){domain=v;renderControls();render();return}
 if((v=e.target.getAttribute("data-replylang"))){replyLang=v;renderControls();render();return}
 if((v=e.target.getAttribute("data-style"))){style=v;renderControls();render();return}
 if(e.target.classList.contains("copy")){
  var id=e.target.getAttribute("data-id"),s=S.find(function(x){return x.id===id});
  navigator.clipboard.writeText(getReply(s));
  var toast=document.getElementById("toast");toast.textContent=T[ui].copied;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show")},900);
 }
});
document.getElementById("q").addEventListener("input",render);
document.getElementById("randomBtn").addEventListener("click",function(){if(!S.length)return;var s=S[Math.floor(Math.random()*S.length)];document.getElementById("q").value=title(s);domain="all";renderControls();render()});
ui=localStorage.getItem("htcb-ui")||"hant";if(!T[ui])ui="hant";renderControls();render();
})();
</script>
</body>
</html>
