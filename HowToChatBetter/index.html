<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>How To Chat Better</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20x%3D'3'%20y%3D'3'%20width%3D'58'%20height%3D'58'%20rx%3D'14'%20fill%3D'%23f7f3eb'%2F%3E%3Cpath%20d%3D'M14%2018c0-5%204-9%209-9h16c5%200%209%204%209%209v7c0%205-4%209-9%209H27l-8%206v-7c-3-2-5-5-5-8v-7Z'%20fill%3D'none'%20stroke%3D'%23101827'%20stroke-width%3D'5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3Cpath%20d%3D'M28%2032c0-5%204-9%209-9h8c5%200%209%204%209%209v7c0%204-2%207-5%208v7l-8-6h-4c-5%200-9-4-9-9v-7Z'%20fill%3D'none'%20stroke%3D'%23101827'%20stroke-width%3D'5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%2F%3E%3C%2Fsvg%3E">
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#151515;--muted:#73736d;--line:#e8e8e2;--soft:#f7f7f4}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","PingFang SC","Microsoft JhengHei","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1140px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(245,245,242,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05)}
.nav{height:62px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em}
.brand svg{width:27px;height:27px;flex:none}
.spacer{flex:1}
.langs,.row{display:flex;gap:7px;overflow:auto;scrollbar-width:none}
.langs::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
.langbtn,.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#5d5d57;white-space:nowrap}
.langbtn{padding:7px 10px;font-size:12px}
.active{background:#171717!important;color:#fff!important;border-color:#171717!important}

.hero{padding:46px 0 18px}
h1{font-size:clamp(42px,6.8vw,70px);line-height:1.02;letter-spacing:-.058em;margin:0 0 22px;max-width:940px}
.search{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px;box-shadow:0 10px 28px rgba(0,0,0,.04)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:12px 14px;font-size:16px}
.search button{border:0;background:#171717;color:#fff;border-radius:13px;padding:0 16px}

.controls{padding:6px 0 8px}
.control{margin-top:11px}
.label{font-size:11px;font-weight:800;letter-spacing:.09em;color:#8b8b84;margin-bottom:7px;text-transform:uppercase}

.deck-section{padding:22px 0 70px}
.deck-shell{max-width:720px;margin:0 auto}
.deck{position:relative;height:410px;perspective:1200px;touch-action:pan-y}
.play-card{
 position:absolute;left:50%;top:0;width:min(640px,92vw);min-height:350px;
 background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;
 box-shadow:0 22px 60px rgba(0,0,0,.08);
 transform-origin:50% 95%;transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s ease,box-shadow .25s ease;
 user-select:none;
}
.play-card[data-depth="0"]{z-index:3;transform:translateX(-50%) translateY(0) scale(1) rotate(0deg)}
.play-card[data-depth="1"]{z-index:2;transform:translateX(-50%) translateY(18px) scale(.965) rotate(-1.3deg);opacity:.9;box-shadow:0 14px 36px rgba(0,0,0,.055)}
.play-card[data-depth="2"]{z-index:1;transform:translateX(-50%) translateY(34px) scale(.93) rotate(1.4deg);opacity:.72;box-shadow:0 10px 24px rgba(0,0,0,.035)}
.play-card.throw-left{transform:translateX(-155%) translateY(12px) rotate(-14deg)!important;opacity:0}
.play-card.throw-right{transform:translateX(55%) translateY(12px) rotate(14deg)!important;opacity:0}
.play-card.dragging{transition:none!important}
.card-inner{position:relative;min-height:294px;transform-style:preserve-3d;transition:transform .46s cubic-bezier(.2,.75,.2,1)}
.play-card.flipped .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column}
.card-back{transform:rotateY(180deg)}
.suit-corner{position:absolute;right:0;top:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.suit-symbol{font-size:34px;font-weight:800;letter-spacing:-.08em}
.suit-label{font-size:10px;color:#999;margin-top:5px;max-width:82px;text-align:center}
.face-center{flex:1;display:flex;flex-direction:column;justify-content:center}
.back-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#999;text-transform:uppercase;margin-bottom:10px}
.flip{border:0;background:transparent;padding:8px 0;color:#777}
.play-card[data-depth="1"] .card-inner,.play-card[data-depth="2"] .card-inner{pointer-events:none}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}
.meta{font-size:13px;color:var(--muted)}
.card-no{font-size:12px;color:#a0a099}
.play-card h2{font-size:clamp(27px,4vw,38px);line-height:1.2;letter-spacing:-.045em;margin:0;max-width:84%}
.reply{background:var(--soft);border-radius:18px;padding:20px;line-height:1.8;font-size:17px;min-height:150px;display:flex;align-items:center}
.card-actions{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.copy{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 13px;color:#555}
.hint{font-size:12px;color:#aaa}

.deck-nav{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:22px}
.deck-btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 15px;color:#555}
.deck-btn.primary{background:#171717;color:#fff;border-color:#171717}
.deck-status{min-width:74px;text-align:center;font-size:12px;color:#8d8d86}
.empty{text-align:center;color:var(--muted);padding:90px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#171717;color:#fff;border-radius:10px;padding:9px 13px;transition:.18s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:720px){
 .wrap{padding:0 14px}.nav{height:56px}.brand span{display:none}
 .hero{padding:34px 0 16px}h1{font-size:43px}
 .deck-section{padding-top:16px}.deck{height:430px}
 .play-card{padding:22px;border-radius:24px;min-height:365px}
 .play-card h2{font-size:27px;max-width:100%}
 .reply{font-size:15px;min-height:135px}
 .hint{display:none}
 .deck-nav{gap:7px}.deck-btn{padding:10px 12px}
}
</style>
</head>
<body>
<header><div class="wrap nav">
<div class="brand">
<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="3" y="3" width="58" height="58" rx="14" fill="#f7f3eb"/><path d="M14 18c0-5 4-9 9-9h16c5 0 9 4 9 9v7c0 5-4 9-9 9H27l-8 6v-7c-3-2-5-5-5-8v-7Z" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 32c0-5 4-9 9-9h8c5 0 9 4 9 9v7c0 4-2 7-5 8v7l-8-6h-4c-5 0-9-4-9-9v-7Z" fill="none" stroke="#101827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span>How To Chat Better</span>
</div>
<div class="spacer"></div><div class="langs" id="uiLangs"></div>
</div></header>

<main>
<section class="hero"><div class="wrap">
<h1 id="heroTitle"></h1>
<div class="search"><input id="q"><button id="randomBtn"></button></div>
</div></section>

<section class="wrap">
<div class="controls">
 <div class="control"><div class="label" id="domainLabel"></div><div class="row" id="domainFilters"></div></div>
 <div class="control"><div class="label" id="replyLangLabel"></div><div class="row" id="replyLangs"></div></div>
 <div class="control"><div class="label" id="styleLabel"></div><div class="row" id="styles"></div></div>
</div>
</section>

<section class="deck-section"><div class="wrap">
 <div class="deck-shell">
  <div class="deck" id="deck"></div>
  <div class="deck-nav" id="deckNav">
   <button class="deck-btn" id="prevBtn"></button>
   <span class="deck-status" id="deckStatus"></span>
   <button class="deck-btn primary" id="nextBtn"></button>
   <button class="deck-btn" id="shuffleBtn"></button>
  </div>
 </div>
</div></section>
</main>

<div class="toast" id="toast"></div>

<script src="./catalog.js"></script><script src="./catalog-extra.js"></script><script src="./catalog-wave3.js"></script><script src="./catalog-wave4.js"></script>
<script>
(function(){
var RAW=window.CHAT_SCENARIOS||[];
var ui="hant",domain="all",replyLang="zh",style="formal",deckIndex=0,currentRows=[];
var dragStartX=0,dragX=0,dragging=false,flippedId=null;
var suits={workplace:"♠",study:"♦",family:"♥",parenting:"★",elder:"♣",friends:"☻",relationship:"♥",social:"✦",service:"◇",job:"↑",business:"◆",travel:"✈",medical:"+",online:"@"};

var T={
 hant:{title:"同一句話，換個更合適的說法。",search:"搜尋情境…",random:"隨機",domain:"情境",replyLang:"回話語言",style:"風格",copy:"複製",copied:"已複製",empty:"沒有找到相符情境",all:"全部",formal:"正式",dark:"腹黑",roast:"吐槽",zh:"中文",en:"English",yue:"粵語",prev:"上一張",next:"下一張",shuffle:"洗牌",swipe:"左右滑動",flip:"翻牌",front:"看情境",answer:"建議說法"},
 hans:{title:"同一句话，换个更合适的说法。",search:"搜索情境…",random:"随机",domain:"情境",replyLang:"回复语言",style:"风格",copy:"复制",copied:"已复制",empty:"没有找到相符情境",all:"全部",formal:"正式",dark:"腹黑",roast:"吐槽",zh:"中文",en:"English",yue:"粤语",prev:"上一张",next:"下一张",shuffle:"洗牌",swipe:"左右滑动",flip:"翻牌",front:"看情境",answer:"建议说法"},
 en:{title:"Same words. A better way to say them.",search:"Search situations…",random:"Random",domain:"Situation",replyLang:"Reply language",style:"Style",copy:"Copy",copied:"Copied",empty:"No matching situation",all:"All",formal:"Formal",dark:"Dark",roast:"Roast",zh:"Chinese",en:"English",yue:"Cantonese",prev:"Previous",next:"Next",shuffle:"Shuffle",swipe:"Swipe left or right",flip:"Flip",front:"Situation",answer:"Suggested reply"}
};
var replyLangs=["zh","en","yue"],styles=["formal","dark","roast"];

function validTri(v){return v&&typeof v==="object"&&typeof v.hant==="string"&&typeof v.hans==="string"&&typeof v.en==="string"}
function validReply(s){
 if(!s.replies||!s.replies.zh||!s.replies.en||!s.replies.yue)return false;
 return styles.every(function(k){
  return s.replies.zh[k]&&typeof s.replies.zh[k].hant==="string"&&typeof s.replies.zh[k].hans==="string"&&
         typeof s.replies.en[k]==="string"&&typeof s.replies.yue[k]==="string";
 });
}
var S=RAW.filter(function(s){return validTri(s.domainLabel)&&validTri(s.relation)&&validTri(s.goal)&&validTri(s.title)&&validReply(s)});
var domainLabels={};S.forEach(function(s){domainLabels[s.domain]=s.domainLabel});
var domains=["all"].concat(Array.from(new Set(S.map(function(s){return s.domain}))));

function esc(s){return String(s||"").replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]})}
function txt(v){return v[ui]}
function getReply(s){
 if(replyLang==="zh")return s.replies.zh[style][ui==="hans"?"hans":"hant"];
 return s.replies[replyLang][style];
}
function meta(s){return txt(s.domainLabel)+" · "+txt(s.relation)+" · "+txt(s.goal)}
function title(s){return txt(s.title)}

function renderControls(){
 document.documentElement.lang=ui==="hans"?"zh-Hans":ui==="hant"?"zh-Hant":"en";
 document.getElementById("heroTitle").textContent=T[ui].title;
 document.getElementById("q").placeholder=T[ui].search;
 document.getElementById("randomBtn").textContent=T[ui].random;
 document.getElementById("domainLabel").textContent=T[ui].domain;
 document.getElementById("replyLangLabel").textContent=T[ui].replyLang;
 document.getElementById("styleLabel").textContent=T[ui].style;
 document.getElementById("prevBtn").textContent=T[ui].prev;
 document.getElementById("nextBtn").textContent=T[ui].next;
 document.getElementById("shuffleBtn").textContent=T[ui].shuffle;
 document.getElementById("uiLangs").innerHTML=[["hans","简中"],["hant","繁中"],["en","EN"]].map(function(x){
  return '<button class="langbtn '+(ui===x[0]?'active':'')+'" data-ui="'+x[0]+'">'+x[1]+'</button>'
 }).join("");
 document.getElementById("domainFilters").innerHTML=domains.map(function(k){
  var label=k==="all"?T[ui].all:domainLabels[k][ui];
  return '<button class="chip '+(domain===k?'active':'')+'" data-domain="'+k+'">'+esc(label)+'</button>'
 }).join("");
 document.getElementById("replyLangs").innerHTML=replyLangs.map(function(k){
  return '<button class="chip '+(replyLang===k?'active':'')+'" data-replylang="'+k+'">'+T[ui][k]+'</button>'
 }).join("");
 document.getElementById("styles").innerHTML=styles.map(function(k){
  return '<button class="chip '+(style===k?'active':'')+'" data-style="'+k+'">'+T[ui][k]+'</button>'
 }).join("");
}

function buildRows(){
 var q=document.getElementById("q").value.trim().toLowerCase();
 currentRows=S.filter(function(s){
  if(domain!=="all"&&s.domain!==domain)return false;
  if(!q)return true;
  var hay=[s.title.hant,s.title.hans,s.title.en,s.relation.hant,s.relation.hans,s.relation.en,s.goal.hant,s.goal.hans,s.goal.en,getReply(s)].join(" ").toLowerCase();
  return hay.indexOf(q)>=0;
 });
 if(deckIndex>=currentRows.length)deckIndex=0;
}

function cardHTML(s,depth,index){
 var isFlip=depth===0&&flippedId===s.id;
 var suit=suits[s.domain]||"•";
 return '<article class="play-card '+(isFlip?'flipped':'')+'" data-depth="'+depth+'" data-id="'+esc(s.id)+'">'+
  '<div class="card-inner">'+
   '<section class="card-face card-front">'+
    '<div class="card-top"><div class="meta">'+esc(meta(s))+'</div><div class="card-no">'+(index+1)+' / '+currentRows.length+'</div></div>'+
    '<div class="suit-corner"><span class="suit-symbol">'+suit+'</span><span class="suit-label">'+esc(txt(s.domainLabel))+'</span></div>'+
    '<div class="face-center"><h2>'+esc(title(s))+'</h2></div>'+
    '<div class="card-actions"><button class="flip" data-flip="'+esc(s.id)+'">'+T[ui].flip+'</button><span class="hint">'+T[ui].swipe+'</span></div>'+
   '</section>'+
   '<section class="card-face card-back">'+
    '<div class="card-top"><div class="back-label">'+T[ui].answer+'</div><div class="card-no">'+(index+1)+' / '+currentRows.length+'</div></div>'+
    '<div class="face-center"><div class="reply">'+esc(getReply(s))+'</div></div>'+
    '<div class="card-actions"><button class="copy" data-id="'+esc(s.id)+'">'+T[ui].copy+'</button><button class="flip" data-flip="'+esc(s.id)+'">'+T[ui].front+'</button></div>'+
   '</section>'+
  '</div>'+
 '</article>';
}

function renderDeck(){
 buildRows();
 var deck=document.getElementById("deck"),nav=document.getElementById("deckNav");
 if(!currentRows.length){
  deck.innerHTML='<div class="empty">'+T[ui].empty+'</div>';
  document.getElementById("deckStatus").textContent="0 / 0";
  nav.style.opacity=.45;
  return;
 }
 nav.style.opacity=1;
 var html="";
 for(var d=2;d>=0;d--){
  if(d>=currentRows.length)continue;
  var idx=(deckIndex+d)%currentRows.length;
  html+=cardHTML(currentRows[idx],d,idx);
 }
 deck.innerHTML=html;
 document.getElementById("deckStatus").textContent=(deckIndex+1)+" / "+currentRows.length;
 bindDrag();
}

function moveNext(direction){
 flippedId=null;
 if(currentRows.length<2)return;
 var top=document.querySelector('.play-card[data-depth="0"]');
 if(top){
  top.classList.add(direction==="left"?"throw-left":"throw-right");
  setTimeout(function(){
   deckIndex=(deckIndex+1)%currentRows.length;
   renderDeck();
  },220);
 }else{
  deckIndex=(deckIndex+1)%currentRows.length;renderDeck();
 }
}
function movePrev(){
 flippedId=null;
 if(!currentRows.length)return;
 deckIndex=(deckIndex-1+currentRows.length)%currentRows.length;
 renderDeck();
}
function shuffle(){
 flippedId=null;
 for(var i=currentRows.length-1;i>0;i--){
  var j=Math.floor(Math.random()*(i+1)),tmp=currentRows[i];currentRows[i]=currentRows[j];currentRows[j]=tmp;
 }
 if(currentRows.length){deckIndex=Math.floor(Math.random()*currentRows.length)}
 renderDeck();
}

function bindDrag(){
 var top=document.querySelector('.play-card[data-depth="0"]');
 if(!top)return;
 top.addEventListener("pointerdown",function(e){
  if(e.target.closest("button"))return;
  dragging=true;dragStartX=e.clientX;dragX=0;top.setPointerCapture(e.pointerId);top.classList.add("dragging");
 });
 top.addEventListener("pointermove",function(e){
  if(!dragging)return;
  dragX=e.clientX-dragStartX;
  var rot=Math.max(-8,Math.min(8,dragX/20));
  top.style.transform="translateX(calc(-50% + "+dragX+"px)) rotate("+rot+"deg)";
 });
 function end(){
  if(!dragging)return;
  dragging=false;top.classList.remove("dragging");
  top.style.transform="";
  if(Math.abs(dragX)>70)moveNext(dragX<0?"left":"right");
  dragX=0;
 }
 top.addEventListener("pointerup",end);
 top.addEventListener("pointercancel",end);
}

document.addEventListener("click",function(e){
 var v;
 if((v=e.target.getAttribute("data-ui"))){ui=v;flippedId=null;localStorage.setItem("htcb-ui",ui);renderControls();renderDeck();return}
 if((v=e.target.getAttribute("data-domain"))){domain=v;deckIndex=0;flippedId=null;renderControls();renderDeck();return}
 if((v=e.target.getAttribute("data-replylang"))){replyLang=v;deckIndex=0;flippedId=null;renderControls();renderDeck();return}
 if((v=e.target.getAttribute("data-style"))){style=v;deckIndex=0;flippedId=null;renderControls();renderDeck();return}
 var fid=e.target.getAttribute("data-flip");
 if(fid){flippedId=flippedId===fid?null:fid;renderDeck();return}
 if(e.target.classList.contains("copy")){
  var id=e.target.getAttribute("data-id"),s=S.find(function(x){return x.id===id});
  navigator.clipboard.writeText(getReply(s));
  var toast=document.getElementById("toast");toast.textContent=T[ui].copied;toast.classList.add("show");setTimeout(function(){toast.classList.remove("show")},900);
 }
});

document.getElementById("q").addEventListener("input",function(){deckIndex=0;renderDeck()});
document.getElementById("randomBtn").addEventListener("click",function(){
 document.getElementById("q").value="";domain="all";buildRows();
 if(currentRows.length)deckIndex=Math.floor(Math.random()*currentRows.length);
 renderControls();renderDeck();
});
document.getElementById("nextBtn").addEventListener("click",function(){moveNext("left")});
document.getElementById("prevBtn").addEventListener("click",movePrev);
document.getElementById("shuffleBtn").addEventListener("click",shuffle);
document.addEventListener("keydown",function(e){
 if(e.key==="ArrowRight")moveNext("left");
 if(e.key==="ArrowLeft")movePrev();
});

ui=localStorage.getItem("htcb-ui")||"hant";if(!T[ui])ui="hant";
renderControls();renderDeck();
})();
</script>
</body>
</html>
