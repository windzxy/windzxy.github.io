<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Windzxy Test</title>
  <style>
    :root { color-scheme: dark; --bg:#07111f; --card:#0f2238; --line:rgba(145,170,194,.22); --text:#ecf8ff; --muted:#91aac2; --mint:#66f2c2; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--text); background: radial-gradient(circle at 20% 10%, rgba(86,216,255,.2), transparent 35%), linear-gradient(135deg,#07111f,#0d2035); display:grid; place-items:center; padding:24px; }
    main { width:min(760px,100%); border:1px solid var(--line); border-radius:8px; background:rgba(15,34,56,.82); padding:24px; box-shadow:0 24px 80px rgba(0,0,0,.32); }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,48px); }
    p { color:var(--muted); line-height:1.7; }
    a { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border:1px solid rgba(102,242,194,.36); border-radius:8px; color:#07111f; background:linear-gradient(180deg,#66f2c2,#56d8ff); font-weight:850; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <h1>Windzxy Test</h1>
    <p>公開測試入口。遊戲已同步到 GitHub Pages 可訪問路徑。</p>
    <a href="./Game/beex-tower-defense/">Open BeeX Tower Defense</a>
  </main>
</body>
</html>
