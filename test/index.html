<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test</title>
  <style>
    :root {
      color-scheme: light;
      --text: #172033;
      --muted: rgba(23, 32, 51, 0.62);
      --glass: rgba(255, 255, 255, 0.34);
      --line: rgba(255, 255, 255, 0.58);
      --shadow: 0 28px 90px rgba(58, 83, 122, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 255, 255, 0.72), transparent 26%),
        radial-gradient(circle at 82% 12%, rgba(255, 255, 255, 0.42), transparent 24%),
        linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 46vmin;
      aspect-ratio: 1;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(6px);
      opacity: 0.72;
    }

    body::before {
      left: -13vmin;
      bottom: -10vmin;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
    }

    body::after {
      right: -12vmin;
      top: -12vmin;
      background: linear-gradient(135deg, #fddb92, #d1fdff);
    }

    main {
      position: relative;
      z-index: 1;
      width: min(860px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    a {
      min-height: 230px;
      display: grid;
      align-content: space-between;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(1.18);
      -webkit-backdrop-filter: blur(22px) saturate(1.18);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      overflow: hidden;
    }

    a:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 255, 255, 0.86);
      box-shadow: 0 34px 110px rgba(58, 83, 122, 0.32);
    }

    a::before {
      content: "";
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.28));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.82), 0 18px 36px rgba(74, 94, 128, 0.18);
    }

    a::after {
      content: "";
      justify-self: start;
      width: 46px;
      height: 46px;
      border-radius: 999px;
      background:
        linear-gradient(135deg, rgba(23, 32, 51, 0.18), rgba(23, 32, 51, 0.06)),
        rgba(255, 255, 255, 0.46);
    }

    strong {
      display: block;
      margin: 26px 0 18px;
      font-size: clamp(44px, 9vw, 82px);
      line-height: 0.94;
      letter-spacing: 0;
    }

    .game {
      background:
        radial-gradient(circle at 78% 22%, rgba(255, 255, 255, 0.64), transparent 26%),
        linear-gradient(135deg, rgba(255, 236, 210, 0.74), rgba(252, 182, 159, 0.46));
    }

    .study {
      background:
        radial-gradient(circle at 82% 24%, rgba(255, 255, 255, 0.62), transparent 28%),
        linear-gradient(135deg, rgba(137, 247, 254, 0.68), rgba(102, 166, 255, 0.44));
    }

    @media (max-width: 680px) {
      body {
        padding: 18px;
        overflow: auto;
      }

      main {
        grid-template-columns: 1fr;
      }

      a {
        min-height: 190px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Branch">
    <a class="game" href="./Game/"><strong>Game</strong></a>
    <a class="study" href="./Study/"><strong>Study</strong></a>
  </main>
</body>
</html>
