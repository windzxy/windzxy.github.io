<main class="kids" id="root">
  <h1>孩子档案</h1>
  <p class="lede">给每个孩子建一份档案。诊断页选好当前孩子，结果就按孩子分开保存，之后可以回看每次的记录和还没补上的知识点。</p>
  <p id="back" class="quiet-link" hidden></p>
  <div id="list" aria-live="polite"></div>
  <section class="kid-form" id="form-card" aria-labelledby="form-title">
    <h2 id="form-title">添加孩子</h2>
    <form id="form" novalidate>
      <label for="f-name">昵称</label>
      <input id="f-name" type="text" maxlength="12" autocomplete="off" placeholder="例如：小满（最多 12 个字）">
      <label for="f-grade">年级</label>
      <select id="f-grade"></select>
      <label for="f-book">教材版本</label>
      <select id="f-book"></select>
      <p class="muted small" id="book-note">图谱的知识点和章节按人教版编排。选其他版本也能用，章节名称可能和手上的教材略有不同。</p>
      <p class="err" id="f-error" role="alert" hidden></p>
      <div class="form-actions">
        <button type="submit" class="primary" id="f-submit">添加孩子</button>
        <button type="button" id="f-cancel" hidden>取消编辑</button>
      </div>
    </form>
  </section>
  <p class="muted small kid-note">档案和诊断记录只保存在这台设备的浏览器里，不上传，也没有账号。清除浏览器数据，或者换一台设备，档案不会跟过去。</p>
</main>
