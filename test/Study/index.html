<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fb">
  <meta name="description" content="面向学生学习、巩固练习、延伸拓展与家长陪学的 Wind 学堂。">
  <title>Wind 学堂｜每天学懂一点</title>
  <link rel="stylesheet" href="assets/platform-v1.css?v=20261028-2">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="platform-shell">
    <header class="platform-header">
      <a class="platform-brand" href="#home" aria-label="Wind 学堂首页">
        <span class="brand-mark">W</span>
        <span><strong>Wind 学堂</strong><small>每天学懂一点</small></span>
      </a>

      <nav class="desktop-nav" aria-label="主导航">
        <button class="nav-item active" data-view="home" type="button">今日</button>
        <button class="nav-item" data-view="learn" type="button">知识点</button>
        <button class="nav-item" data-view="practice" type="button">练习</button>
        <a class="nav-item" href="math.html?v=20261028-3">拼豆数学</a>
        <button class="nav-item" data-view="parent" type="button">家长</button>
      </nav>

      <div class="header-actions">
        <label class="grade-picker region-picker" aria-label="选择课程地区">
          <span id="region-caption">中国内地</span>
          <select id="region-select"></select>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
        </label>
        <label class="grade-picker" aria-label="选择年级">
          <span id="grade-caption">一年级</span>
          <select id="grade-select"></select>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4"/></svg>
        </label>
        <button class="profile-button" id="profile-button" type="button" aria-label="学习档案">
          <span id="profile-avatar">小</span>
        </button>
      </div>
    </header>

    <div class="subject-bar" id="subject-bar" aria-label="选择学科"></div>
    <div class="curriculum-context" id="curriculum-context" aria-live="polite"></div>

    <main class="platform-main" id="app" aria-live="polite">
      <div class="loading-view">
        <span class="loading-orb"></span>
        <p>正在准备今天的学习内容…</p>
      </div>
    </main>
  </div>

  <nav class="mobile-tabbar" aria-label="移动端导航">
    <button class="mobile-tab active" data-view="home" type="button"><span data-icon="sun"></span><small>今日</small></button>
    <button class="mobile-tab" data-view="learn" type="button"><span data-icon="map"></span><small>知识点</small></button>
    <button class="mobile-tab" data-view="practice" type="button"><span data-icon="pencil"></span><small>练习</small></button>
    <button class="mobile-tab" data-view="parent" type="button"><span data-icon="family"></span><small>家长</small></button>
  </nav>

  <div class="modal-layer" id="modal-layer" hidden>
    <button class="modal-backdrop" type="button" data-close-modal aria-label="关闭"></button>
    <section class="modal-card" id="modal-card" role="dialog" aria-modal="true"></section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="math-path/assets/data-loader.js?v=20261026-1"></script>
  <script src="assets/platform-v1.js?v=20261028-3"></script>
</body>
</html>
