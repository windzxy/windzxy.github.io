<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Html</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #172033;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.62), transparent 28%),
        linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
    }

    main {
      width: min(720px, 100%);
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.34);
      box-shadow: 0 28px 80px rgba(54, 93, 149, 0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 14vw, 112px);
      line-height: 0.94;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Html</h1>
  </main>
</body>
</html>
