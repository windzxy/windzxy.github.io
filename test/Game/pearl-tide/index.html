ottom:0;transform:rotate(180deg);border-color:#b48c61}.gem{position:absolute;left:86px;bottom:35px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 29% 24%,white 0 5%,#fff5df 12%,#d3a9d0 51%,#725e98 100%);box-shadow:0 0 32px #e3aacaad,inset -8px -9px 13px #594c7b66;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:9px;margin-bottom:13px}.nav button,.btn{border-radius:14px;padding:13px 20px;color:#f6f3e9;background:#ffffff12;border:1px solid #ffffff25;white-space:nowrap}.nav button.active,.btn.gold{background:linear-gradient(135deg,#edcd91,#d5a966);color:#23333a;border-color:#ffe1a6;font-weight:800}.btn:hover,.nav button:hover{filter:brightness(1.16)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.panel{background:#153440d9;border:1px solid #ffffff24;border-radius:22px;padding:22px;min-height:360px;box-shadow:0 15px 32px #07152055}.panel h2{font:28px Georgia,serif;color:#ffe4ac;margin:0 0 10px}.muted{color:#a9c6cc;font-size:13px;line-height:1.65}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:20px 0}.item{padding:19px 14px;background:linear-gradient(150deg,#28505b,#17313e);border:1px solid #ffffff28;border-radius:18px;min-height:155px;display:flex;flex-direction:column;gap:9px;align-items:flex-start}.item .art{font-size:43px;line-height:1.1}.item strong{color:#fff1d0}.item button{margin-top:auto}.pill{font-size:11px;border-radius:99px;padding:5px 9px;color:#f5d395;background:#d5a96626}.pearl{display:inline-block;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 29% 24%,#fff 0 5%,var(--tone) 36%,#5a6b82 120%);box-shadow:inset -5px -6px 11px #282b4b45,0 4px 16px #0005}.mini{width:22px;height:22px;vertical-align:middle;margin-right:6px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn.small{padding:8px 12px;font-size:12px}.log{height:194px;overflow:auto;color:#bdd6d8;line-height:1.65;font-size:13px}.log div{border-bottom:1px solid #ffffff14;padding:7px 0}.live{padding:14px;background:#071d29;border:1px solid #d2ae6a55;border-radius:15px}.live strong{color:#ffe0a1}.field{width:100%;padding:12px;border:1px solid #ffffff45;background:#09222e;color:white;border-radius:11px;margin:5px 0 11px}.badge{font-size:12px;color:#fee0a4}.footer{color:#81a5ac;font-size:12px;text-align:center;margin:23px 0}dialog{border:1px solid #d9b881;border-radius:22px;background:#153542;color:#fff;padding:25px;max-width:min(500px,93vw);box-shadow:0 20px 85px #000c}dialog::backdrop{background:#020d16bd}.reveal{text-align:center;font-size:65px;margin:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#f5d6a0;color:#12303b;padding:12px 22px;border-radius:15px;font-weight:700;z-index:5;max-width:90vw}.empty{padding:40px;text-align:center;color:#9ebdc1}.notice{border-left:3px solid #f2cd83;padding:10px;background:#eac98612;line-height:1.65}@media(max-width:800px){.wrap{padding:12px}.hero{padding:25px;min-height:205px}.hero h1{font-size:33px}.hero .oyster{transform:scale(.65);margin-right:-48px;margin-left:-50px}.layout{grid-template-columns:1fr}.panel{padding:16px;min-height:230px}.stats{width:100%}.stat{flex:1;min-width:85px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:12px;min-height:160px}.nav button{padding:11px 15px}}
</style></head><body><div class="wrap"><header class="top"><div><div class="sub">A little ocean, a little wonder</div><div class="logo">✧ 潮汐珠寶屋</div></div><div class="stats"><div class="stat">營業資金<b id="cash">—</b></div><div class="stat">店舖聲望<b id="fame">—</b></div><div class="stat">第 <span id="day">1</span> 天<b id="energy">—</b></div></div></header><section class="hero"><div><div class="sub">Pearl Tide · Original Game</div><h1>每一顆珍珠，<br>都是海的來信。</h1><p>在清晨漁市尋找寶貝，親手開蚌、鑑定、製作珠寶，經營屬於你的海邊小店。</p><button class="btn gold" data-tab="market">前往今日漁市 →</button></div><div class="oyster" aria-hidden="true"><div class="shell top"></div><div class="shell bottom"></div><div class="gem"></div></div></section><nav class="nav" id="nav"><button class="active" data-tab="market">🐚 漁市</button><button data-tab="open">✧ 開蚌台</button><button data-tab="studio">💍 工坊</button><button data-tab="orders">📜 訂單</button><button data-tab="live">🔴 直播</button><button data-tab="collection">💠 珠匣</button><button data-tab="ranking">🏆 排行與雲端</button></nav><div class="layout"><main class="panel" id="main" aria-live="polite"></main><aside class="panel"><h2>航海日誌</h2><p class="muted">所有操作會自動儲存在目前瀏覽器。設定雲端後，才能跨裝置同步和共享排行榜。</p><div class="live row"><span>今日行動力</span><strong id="sideEnergy">—</strong></div><p class="muted">先買蚌，然後開啟並收集珍珠。工坊成品可以交付訂單，也能在直播間出售。</p><button class="btn gold" id="next" style="width:100%">結束營業 · 下一天</button><h3 style="color:#ffe5ac">最近消息</h3><div class="log" id="log"></div></aside></div><div class="footer">PEARL TIDE · 原創海邊經營遊戲 · 無付費、無廣告 · 本地存檔 / 可選雲端</div></div><dialog id="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><p><button class="btn gold" id="closeModal">繼續旅程</button></p></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script><script>
'use strict';
const KEY='pearl-tide-v1', CFG='pearl-tide-cloud-v1';
const $=id=>document.getElementById(id), money=n=>'✦ '+Math.floor(n).toLocaleString('zh-Hant');
const kinds=[{name:'溪流青貝',price:75,risk:0,boost:0,icon:'🐚'},{name:'月灣花蛤',price:230,risk:.08,boost:1,icon:'🦪'},{name:'深海金唇貝',price:820,risk:.16,boost:2,icon:'🐚'},{name:'星夜秘藏貝',price:2600,risk:.23,boost:3,icon:'🦪'}];
const colors=[['月光白','#f8ecdf'],['珊瑚粉','#ffadcf'],['海霧藍','#96d9f1'],['香檳金','#f8d086'],['幻紫','#c4a2f4'],['極光黑','#738da9']];
const rarities=['普通','精良','稀有','傳說','神話'], mult=[1,2.1,5,13,35];
const fresh=()=>({version:1,cash:1200,fame:0,day:1,energy:6,stock:[],pearls:[],jewels:[],orders:[],purchases:0,opened:0,sold:0,totalEarned:0,logs:['歡迎來到潮汐珠寶屋！先去漁市挑一枚貝殼。'],seq:0});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'null')};if(!Array.isArray(s.stock)||!Array.isArray(s.pearls)||!Array.isArray(s.jewels))throw Error('bad save')}catch{s=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{toast('本地儲存失敗：請檢查瀏覽器空間')}};
const id=()=>`${Date.now().toString(36)}-${++s.seq}`;
function log(t){s.logs.unshift(`第 ${s.day} 天 · ${t}`);s.logs=s.logs.slice(0,35)}
function toast(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}
$('closeModal').onclick=()=>$('modal').close();
function ensureOrders(){if(!s.orders.length){s.orders=[{id:id(),type:0,count:1,pay:230},{id:id(),type:1,count:1,pay:620},{id:id(),type:2,count:2,pay:2000}]}}
ensureOrders();let tab='market',client=null,user=null,cloudTimer=null;
function pearlHTML(p){return `<span class="pearl mini" style="--tone:${p.color}"></span>${p.name} <span class="pill">${p.rarity}</span>`}
function render(){save();$('cash').textContent=money(s.cash);$('fame').textContent=s.fame;$('day').textContent=s.day;$('energy').textContent=`${s.energy}/6 行動`;$('sideEnergy').textContent=`${s.energy}/6`;$('log').replaceChildren(...s.logs.slice(0,12).map(t=>{let d=document.createElement('div');d.textContent=t;return d}));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let out='';
if(tab==='market'){out=`<h2>晨光漁市</h2><p class="muted">依貝殼價格與種類決定珍珠品質機率；價格較高不代表一定回本。每日可購買多枚，保留資金很重要。</p><div class="cards">${kinds.map((k,i)=>`<article class="item"><span class="art">${k.icon}</span><strong>${k.name}</strong><span class="muted">品質加成 +${k.boost} · 空貝風險 ${Math.round(k.risk*100)}%</span><span class="badge">${money(k.price)}</span><button class="btn gold small" data-buy="${i}" ${s.cash<k.price||s.energy<1?'disabled':''}>購買 · 1 行動</button></article>`).join('')}</div><p class="notice">貨源每天刷新。想提高收益？先完成訂單，再探索高價海貝。</p>`}
if(tab==='open'){out=`<h2>珍珠開蚌台</h2><p class="muted">點選一枚未開的貝殼，選擇開口位置；偏離安全位置可能刮傷珍珠。每次消耗 1 行動力。</p><div class="cards">${s.stock.map((k,i)=>`<article class="item"><span class="art">${k.icon}</span><strong>${k.name}</strong><span class="muted">購買成本 ${money(k.price)}</span><button class="btn gold small" data-open="${i}" ${s.energy<1?'disabled':''}>開始開蚌 ✧</button></article>`).join('')}</div>${!s.stock.length?'<div class="empty">還沒有貝殼，先到漁市購買吧。</div>':''}`}
if(tab==='studio'){out=`<h2>月光珠寶工坊</h2><p class="muted">選擇配方消耗珍珠製作首飾。高品質原珠能提高成品售價；製作需要 1 行動。</p><div class="cards">${[['海星吊墜',1,1.6,'⭐'],['潮汐耳環',2,2.05,'💫'],['星河項鍊',3,2.7,'📿']].map((v,i)=>`<article class="item"><span class="art">${v[3]}</span><strong>${v[0]}</strong><span class="muted">需要 ${v[1]} 顆珍珠 · 成品倍率 ${v[2]}×</span><button class="btn gold small" data-craft="${i}" ${s.pearls.length<v[1]||s.energy<1?'disabled':''}>挑選並製作</button></article>`).join('')}</div><h3>可用珍珠（${s.pearls.length}）</h3><div class="muted">${s.pearls.map(p=>pearlHTML(p)).join('　')||'尚未收集珍珠'}</div>`}
if(tab==='collection'){out=`<h2>收藏珠匣</h2><p class="muted">珍珠和成品都會保留。可直接出售珍珠換取周轉資金，或留給工坊增值。</p><div class="cards">${s.pearls.map(p=>`<article class="item"><span class="pearl" style="--tone:${p.color}"></span><strong>${p.name}</strong><span class="pill">${p.rarity} · ${p.size} mm ${p.scratch?'· 微瑕':''}</span><span class="badge">估價 ${money(p.value)}</span><button class="btn small" data-sell-pearl="${p.id}">出售原珠</button></article>`).join('')}${s.jewels.map(j=>`<article class="item"><span class="art">💍</span><strong>${j.name}</strong><span class="pill">${j.count} 顆珍珠</span><span class="badge">估價 ${money(j.value)}</span><button class="btn small" data-sell-jewel="${j.id}">直接出售</button></article>`).join('')}</div>${!s.pearls.length&&!s.jewels.length?'<div class="empty">珠匣空空如也，去開蚌吧。</div>':''}`}
if(tab==='orders'){out=`<h2>海灣委託訂單</h2><p class="muted">完成固定報價訂單能獲得營業資金與聲望。交付需有對應首飾，無需額外行動力。</p><div class="cards">${s.orders.map(o=>`<article class="item"><span class="art">📜</span><strong>${['海星吊墜','潮汐耳環','星河項鍊'][o.type]}委託</strong><span class="muted">交付 ${o.count} 件指定首飾</span><span class="badge">報酬 ${money(o.pay)} · 聲望 +${(o.type+1)*3}</span><button class="btn gold small" data-order="${o.id}" ${s.jewels.filter(j=>j.type===o.type).length<o.count?'disabled':''}>交付訂單</button></article>`).join('')}</div>`}
if(tab==='live'){out=`<h2>珍珠直播間 <span class="badge">● LIVE</span></h2><p class="muted">直播能以熱度加成出售珠寶，熱度由聲望決定；每次售出消耗 1 行動。這是模擬觀眾訊息，不是真實多人聊天室。</p><div class="live">👩🏻‍💻 主播：歡迎來到海灣！今日粉絲 ${s.fame*7+28} 人 · 售價加成 ${Math.min(18,Math.floor(s.fame/12))}%<br><br>💬 海風旅人：今天有甚麼特別的珍珠？<br>💬 月亮收藏家：想看看你親手做的首飾！</div><div class="cards">${s.jewels.map(j=>`<article class="item"><span class="art">💍</span><strong>${j.name}</strong><span class="badge">直播價 ${money(Math.floor(j.value*(1+Math.min(18,Math.floor(s.fame/12))/100)))}</span><button class="btn gold small" data-live="${j.id}" ${s.energy<1?'disabled':''}>直播售出 · 1 行動</button></article>`).join('')}</div>${!s.jewels.length?'<div class="empty">先去工坊製作首飾，直播才有商品可賣。</div>':''}`}
if(tab==='ranking'){out=`<h2>雲端存檔與排行榜</h2><p class="notice" id="cloudStatus">目前使用本地存檔。雲端功能需由站長先部署 Supabase 後端，輸入專案 URL 與公開 anon key。</p><label class="muted">Supabase Project URL</label><input class="field" id="cloudUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"><label class="muted">Supabase publishable / anon key（不是 service_role 密鑰）</label><input class="field" id="cloudKey" placeholder="sb_publishable_... / eyJ..." autocomplete="off"><button class="btn small" id="connectCloud">連接後端</button><hr style="border-color:#ffffff22;margin:20px 0"><label class="muted">帳號 Email（魔法登入連結）</label><input class="field" type="email" id="email" placeholder="you@example.com"><button class="btn gold small" id="login">寄送登入連結</button> <button class="btn small" id="logout">登出</button><p class="muted" id="account">尚未登入。雲端覆蓋存檔前，請先自行匯出本地備份。</p><button class="btn small" id="upload">↑ 上傳本地存檔</button> <button class="btn small" id="download">↓ 讀取雲端存檔</button> <button class="btn small" id="export">匯出 JSON 備份</button> <button class="btn small" id="import">匯入 JSON 備份</button><input id="importFile" type="file" accept="application/json" hidden><hr style="border-color:#ffffff22;margin:20px 0"><h3>全球財富榜（已連接時顯示）</h3><label class="muted">排行暱稱</label><input class="field" id="nickname" maxlength="18" placeholder="海灣旅人"><button class="btn gold small" id="submitScore">提交我的成績</button> <button class="btn small" id="refreshRank">刷新排行</button><div id="rankList" class="muted" style="margin-top:14px">尚未連接後端。</div><p class="muted">注意：純前端遊戲無法防止篡改成績。公開正式排行須把玩法與得分驗證搬至可信伺服器。</p>`}
$('main').innerHTML=out;if(tab==='ranking')setupCloudUI();}
function show(t){tab=t;render();if(t==='ranking')refreshRanks()}
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});document.querySelector('.hero').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)show(b.dataset.tab)});
function buy(i){let k=kinds[i];if(!k||s.cash<k.price||s.energy<1)return toast('資金或行動力不足');s.cash-=k.price;s.energy--;s.purchases++;s.stock.push({...k,id:id()});log(`購入 ${k.name}，花費 ${money(k.price)}`);render()}
function openShell(i){let k=s.stock[i];if(!k||s.energy<1)return toast('行動力不足');modal('開蚌挑戰',`<p class="muted">觀察貝殼邊緣，請選擇切入位置。中間的貝縫比較安全。</p><div style="text-align:center;font-size:85px;margin:10px">🦪</div><div class="row"><button class="btn small" data-cut="0" data-index="${i}">左側切入</button><button class="btn gold small" data-cut="1" data-index="${i}">中央貝縫</button><button class="btn small" data-cut="2" data-index="${i}">右側切入</button></div>`)}
$('modal').addEventListener('click',e=>{let b=e.target.closest('[data-cut]');if(!b)return;let i=+b.dataset.index,k=s.stock[i];if(!k||s.energy<1)return;$('modal').close();s.stock.splice(i,1);s.energy--;s.opened++;if(Math.random()<k.risk){log(`${k.name} 是空貝，未找到珍珠。`);render();modal('海的玩笑','<div class="reveal">🐚</div><p>這次是空貝。下一枚或許藏著驚喜。</p>');return}let roll=Math.random()+k.boost*.115,r=roll>.96?4:roll>.80?3:roll>.59?2:roll>.29?1:0,ci=Math.floor(Math.random()*colors.length),size=+(5+Math.random()*7+k.boost*1.9).toFixed(1),scratch=b.dataset.cut!=='1'&&Math.random()<.65,value=Math.round((60+k.price*.55+size*15)*mult[r]*(scratch?.64:1)),p={id:id(),name:colors[ci][0]+'珍珠',color:colors[ci][1],rarity:rarities[r],size,scratch,value};s.pearls.push(p);s.fame+=r+1;log(`開出 ${p.rarity} ${p.name}，估價 ${money(value)}${scratch?'（微瑕）':''}`);render();modal('✧ 珍珠出世',`<div class="reveal"><span class="pearl" style="width:87px;height:87px;--tone:${p.color}"></span></div><p style="text-align:center">${p.rarity} · ${p.name}<br>${size} mm · ${scratch?'微瑕':'完整'}<br><strong>估價 ${money(value)}</strong></p>`)});
function craft(type){let needs=type+1;if(s.energy<1||s.pearls.length<needs)return toast('原珠或行動力不足');let available=s.pearls.slice().sort((a,b)=>b.value-a.value);modal('工坊 · 挑選珍珠',`<p class="muted">將使用價值最高的 ${needs} 顆珍珠，確認後不可復原。</p>${available.slice(0,needs).map(p=>`<p>${pearlHTML(p)} · ${money(p.value)}</p>`).join('')}<button class="btn gold" id="confirmCraft">確認製作</button>`);$('confirmCraft').onclick=()=>{if(s.energy<1||s.pearls.length<needs)return;$('modal').close();let picked=available.slice(0,needs);s.pearls=s.pearls.filter(p=>!picked.some(q=>q.id===p.id));s.energy--;let value=Math.round(picked.reduce((n,p)=>n+p.value,0)*[1.6,2.05,2.7][type]);let j={id:id(),type,name:['海星吊墜','潮汐耳環','星河項鍊'][type],count:needs,value};s.jewels.push(j);s.fame+=needs*2;log(`製成 ${j.name}，估價 ${money(value)}`);render();toast('珠寶製作成功！')}}
function sell(id,type,live=false){let arr=type==='pearl'?s.pearls:s.jewels,i=arr.findIndex(x=>x.id===id);if(i<0||live&&s.energy<1)return;let item=arr.splice(i,1)[0],value=live?Math.floor(item.value*(1+Math.min(18,Math.floor(s.fame/12))/100)):item.value;s.cash+=value;s.totalEarned+=value;s.sold++;if(live){s.energy--;s.fame+=4}log(`${live?'直播售出':'出售'} ${item.name}，收入 ${money(value)}`);render();toast(`成交！+${money(value)}`)}
function order(id){let o=s.orders.find(x=>x.id===id);if(!o)return;let matches=s.jewels.filter(j=>j.type===o.type).slice(0,o.count);if(matches.length<o.count)return;s.jewels=s.jewels.filter(j=>!matches.includes(j));s.cash+=o.pay;s.totalEarned+=o.pay;s.sold+=o.count;s.fame+=(o.type+1)*3;s.orders=s.orders.filter(x=>x.id!==id);log(`交付訂單，收款 ${money(o.pay)}`);render();toast('委託已完成！')}
$('main').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.buy!==undefined)buy(+b.dataset.buy);if(b.dataset.open!==undefined)openShell(+b.dataset.open);if(b.dataset.craft!==undefined)craft(+b.dataset.craft);if(b.dataset.sellPearl)sell(b.dataset.sellPearl,'pearl');if(b.dataset.sellJewel)sell(b.dataset.sellJewel,'jewel');if(b.dataset.live)sell(b.dataset.live,'jewel',true);if(b.dataset.order)order(b.dataset.order)});
$('next').onclick=()=>{s.day++;s.energy=6;ensureOrders();if(s.orders.length<3){let n=3-s.orders.length;for(let i=0;i<n;i++){let type=Math.min(2,Math.floor(Math.random()*3));s.orders.push({id:id(),type,count:1,pay:[250,740,1900][type]+s.day*15})}}log('新的一天開始，行動力恢復！');render();toast(`第 ${s.day} 天，海風正好`)};
function validate(v){if(!v||v.version!==1||!Number.isFinite(v.cash)||v.cash<0||!Number.isInteger(v.day)||v.day<1||!Array.isArray(v.pearls)||!Array.isArray(v.jewels)||!Array.isArray(v.stock)||!Array.isArray(v.orders)||!Array.isArray(v.logs))throw Error('存檔格式不正確');if(JSON.stringify(v).length>500000)throw Error('存檔太大');return {...fresh(),...v}}
function downloadFile(name,text){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function cfg(){try{return JSON.parse(localStorage.getItem(CFG)||'null')}catch{return null}}
async function connect(){let c=cfg();if(!c?.url||!c?.key||!window.supabase)return null;try{client=window.supabase.createClient(c.url,c.key);let {data}=await client.auth.getUser();user=data.user||null;return client}catch(e){toast('雲端連線失敗：'+e.message);return null}}
async function account(){if(!client)await connect();return user}
function setupCloudUI(){let c=cfg();$('cloudUrl').value=c?.url||'';$('cloudKey').value=c?.key||'';$('account').textContent=user?`已登入：${user.email||user.id}`:'尚未登入';$('cloudStatus').textContent=client?'已設定後端。請登入以同步存檔、提交排行。':'目前使用本地存檔。請先由站長部署 SQL 後端並設定連線。';$('connectCloud').onclick=async()=>{let url=$('cloudUrl').value.trim(),key=$('cloudKey').value.trim();if(!/^https:\/\/[a-z0-9.-]+\.supabase\.co\/?$/i.test(url)||!key||/service_role/i.test(key))return toast('請提供有效 Supabase URL 和公開 key，絕不可填 service_role');localStorage.setItem(CFG,JSON.stringify({url,key}));client=null;await connect();render();toast('後端設定已儲存')};$('login').onclick=async()=>{if(!client)await connect();if(!client)return toast('請先連接後端');let email=$('email').value.trim();if(!/^\S+@\S+\.\S+$/.test(email))return toast('請輸入有效 Email');let {error}=await client.auth.signInWithOtp({email,emailRedirectTo:location.origin+location.pathname});toast(error?error.message:'登入連結已寄出，請查看郵箱')};$('logout').onclick=async()=>{if(client)await client.auth.signOut();user=null;render()};$('upload').onclick=async()=>{if(!await account())return toast('請先登入');let {error}=await client.from('pearl_saves').upsert({user_id:user.id,state:s,updated_at:new Date().toISOString()},{onConflict:'user_id'});toast(error?'上傳失敗：'+error.message:'雲端存檔已更新')};$('download').onclick=async()=>{if(!await account())return toast('請先登入');let {data,error}=await client.from('pearl_saves').select('state').eq('user_id',user.id).maybeSingle();if(error||!data)return toast(error?.message||'沒有雲端存檔');if(!confirm('雲端存檔會覆蓋本機進度。已匯出備份了嗎？'))return;try{s=validate(data.state);render();toast('雲端存檔已載入')}catch(e){toast(e.message)}};$('export').onclick=()=>downloadFile('pearl-tide-save.json',JSON.stringify(s,null,2));$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=validate(JSON.parse(await f.text()));if(confirm('匯入將覆蓋目前本地存檔，確定嗎？')){s=data;render();toast('本地存檔已匯入')}}catch(err){toast(err.message)}};$('submitScore').onclick=async()=>{if(!await account())return toast('登入後才可排行');let nickname=$('nickname').value.trim().slice(0,18);if(!nickname)return toast('請輸入暱稱');let {error}=await client.from('pearl_scores').upsert({user_id:user.id,nickname,score:Math.floor(s.totalEarned),day:s.day,updated_at:new Date().toISOString()},{onConflict:'user_id'});toast(error?'提交失敗：'+error.message:'成績已提交');refreshRanks()};$('refreshRank').onclick=refreshRanks;}
async function refreshRanks(){if(tab!=='ranking')return;if(!client)await connect();let el=$('rankList');if(!el)return;if(!client){el.textContent='請先配置後端，排行榜目前未啟用。';return}let {data,error}=await client.from('pearl_scores').select('nickname,score,day').order('score',{ascending:false}).limit(20);if(error){el.textContent='讀取失敗：'+error.message;return}el.replaceChildren(...(data||[]).map((x,i)=>{let d=document.createElement('div');d.className='row';d.style.padding='9px 0';d.style.borderBottom='1px solid #ffffff20';let name=document.createElement('span'),score=document.createElement('strong');name.textContent=`${i+1}. ${x.nickname} · 第 ${x.day} 天`;score.textContent=money(x.score);d.append(name,score);return d}));if(!data?.length)el.textContent='暫無排行，成為第一位珠寶店主！'}
(async()=>{await connect();if(client){client.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;if(tab==='ranking')render()})}render()})();
</script></body></html>
