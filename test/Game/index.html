<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      color: #221607;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.64), transparent 26%),
        linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    }

    main {
      width: min(720px, 100%);
      display: grid;
      gap: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 96px);
      line-height: 0.94;
    }

    a {
      min-height: 118px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      color: inherit;
      background: rgba(255, 255, 255, 0.34);
      box-shadow: 0 28px 80px rgba(111, 72, 30, 0.22);
      text-decoration: none;
      font-size: clamp(24px, 5vw, 42px);
      font-weight: 900;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    a span:last-child {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.46);
      font-size: 26px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Game</h1>
    <a href="./beex-tower-defense/"><span>蜂巢古城守衛</span><span>›</span></a>
  </main>
</body>
</html>
