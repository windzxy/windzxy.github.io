name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep canonical Maydayland map runtime entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260911-mayday-openfreemap-v2.9-raster-pan-watchdog" defer></script>',
              s,
              count=1,
          )
          if "'raster-pan-watchdog'" not in s:
              s = s.replace("'raster-viewport-health',", "'raster-viewport-health','raster-pan-watchdog',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit canonical entry if needed
        run: |
          if git diff --quiet -- maydayland/index.html; then
            echo 'Maydayland map runtime entry already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/index.html
          git commit -m 'Keep Mayday raster pan watchdog loaded'
          git pull --rebase origin master
          git push
