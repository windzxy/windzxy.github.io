name: Ensure Maydayland Map Interaction Guard
on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Publish current map recovery runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            r'tour-map-openfreemap-v2\.js\?v=[^"\']+':'tour-map-openfreemap-v2.js?v=20260913-mayday-openfreemap-v4.10-shared-resize-owner',
            r'tour-map-interaction-guard-v1\.js\?v=[^"\']+':'tour-map-interaction-guard-v1.js?v=20260913-tour-map-interaction-guard-v1.2-visual-viewport-settle',
            r'tour-map-stability-v1\.js\?v=[^"\']+':'tour-map-stability-v1.js?v=20260913-tour-map-stability-v1.5-raster-owner-aware',
          }
          for pattern,new in replacements.items():
            if not re.search(pattern,s): raise SystemExit('Missing runtime entry: '+pattern)
            s=re.sub(pattern,new,s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit formal entry if needed
        run: |
          if ! git diff --quiet -- maydayland/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add maydayland/index.html
            git commit -m "Publish Maydayland mobile viewport recovery [skip-mayday-map-publish]"
            git push
          fi
      - name: Verify current Maydayland map recovery baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime=Path('maydayland/tour-map-openfreemap-v2.js').read_text(encoding='utf-8')
          interaction=Path('maydayland/tour-map-interaction-guard-v1.js').read_text(encoding='utf-8')
          stability=Path('maydayland/tour-map-stability-v1.js').read_text(encoding='utf-8')
          index=Path('maydayland/index.html').read_text(encoding='utf-8')
          checks=[
            ('map runtime',runtime,['20260913-mayday-openfreemap-v4.10-shared-resize-owner','function nextRasterProviderBackoff','function probeRasterProvider','rasterProviderProbeGeneration=Object.create(null)']),
            ('interaction guard',interaction,['20260913-tour-map-interaction-guard-v1.2-visual-viewport-settle','requestResize:resizePulse','MIN_RESIZE_GAP=220','window.visualViewport']),
            ('stability guard',stability,['20260913-tour-map-stability-v1.5-raster-owner-aware','MAYDAYLAND_MAP_INTERACTION?.requestResize']),
            ('production entry',index,['20260913-mayday-openfreemap-v4.10-shared-resize-owner','20260913-tour-map-interaction-guard-v1.2-visual-viewport-settle','20260913-tour-map-stability-v1.5-raster-owner-aware',"'shared-resize-coordinator'","'adaptive-provider-backoff'","'viewport-quorum-probe'"])
          ]
          missing=[]
          for label,text,required in checks:
            for marker in required:
              if marker not in text: missing.append(f'{label}: {marker}')
          if missing: raise SystemExit('Maydayland map baseline regression detected:\n- '+'\n- '.join(missing))
          print('Maydayland v4.10 + visual viewport recovery baseline verified.')
          PY
