name: Ensure Maydayland Map Interaction Guard
on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify current Maydayland map recovery baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('maydayland/tour-map-openfreemap-v2.js').read_text(encoding='utf-8')
          interaction = Path('maydayland/tour-map-interaction-guard-v1.js').read_text(encoding='utf-8')
          stability = Path('maydayland/tour-map-stability-v1.js').read_text(encoding='utf-8')
          index = Path('maydayland/index.html').read_text(encoding='utf-8')

          runtime_required = [
              '20260913-mayday-openfreemap-v4.9-probe-settle-budget',
              'function nextRasterProviderBackoff',
              'function probeRasterProvider',
              'function rasterProbeCoords',
              'function cancelRasterProviderProbe',
              'function rasterProbeStartDelay',
              'function waitRasterProbeSettle',
              'rasterProviderProbeGeneration=Object.create(null)',
              'rasterProviderProbeAbort=Object.create(null)',
              'rasterProviderProbeStarts=Object.create(null)',
          ]
          interaction_required = [
              '20260913-tour-map-interaction-guard-v1.1-resize-coordinator',
              'requestResize:resizePulse',
              'MIN_RESIZE_GAP=220',
          ]
          stability_required = [
              '20260913-tour-map-stability-v1.4-shared-resize-coordinator',
              'MAYDAYLAND_MAP_INTERACTION?.requestResize',
          ]
          index_required = [
              '20260913-mayday-openfreemap-v4.9-probe-settle-budget',
              '20260913-tour-map-interaction-guard-v1.1-resize-coordinator',
              '20260913-tour-map-stability-v1.4-shared-resize-coordinator',
              "'shared-resize-coordinator'",
              "'adaptive-provider-backoff'",
              "'provider-recovery-probe'",
              "'viewport-quorum-probe'",
              "'probe-generation-cancel'",
              "'probe-request-budget'",
              "'probe-settle-budget'",
          ]

          checks = [
              ('map runtime', runtime, runtime_required),
              ('interaction guard', interaction, interaction_required),
              ('stability guard', stability, stability_required),
              ('production entry', index, index_required),
          ]
          missing = []
          for label, text, required in checks:
              for marker in required:
                  if marker not in text:
                      missing.append(f'{label}: {marker}')
          if missing:
              raise SystemExit('Maydayland map baseline regression detected:\n- ' + '\n- '.join(missing))
          print('Maydayland map v4.9 + shared resize coordinator baseline verified.')
          PY
