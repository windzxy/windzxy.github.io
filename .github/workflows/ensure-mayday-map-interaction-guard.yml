name: Ensure Maydayland Map Interaction Guard
on:
  push:
    branches: [master]
    paths: ['maydayland/index.html','maydayland/tour-map-openfreemap-v2.js','.github/workflows/ensure-mayday-map-interaction-guard.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Make raster watchdog stall aware
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('maydayland/tour-map-openfreemap-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("20260912-mayday-openfreemap-v4.2-tile-progress-grace","20260912-mayday-openfreemap-v4.3-stall-aware-watchdog",1)
          s=s.replace("rasterLastTileProgressAt=0,rasterWatchProbe=null,rasterTileProgressHandler=null", "rasterLastTileProgressAt=0,rasterLastTileErrorAt=0,rasterTileErrorCount=0,rasterWatchProbe=null,rasterTileProgressHandler=null,rasterTileErrorHandler=null",1)
          s=s.replace("function unbindRasterTileProgress(){if(rasterWatchProbe&&rasterTileProgressHandler)try{rasterWatchProbe.off('tileload',rasterTileProgressHandler)}catch(_){}rasterWatchProbe=null;rasterTileProgressHandler=null;rasterLastTileProgressAt=0}", "function unbindRasterTileProgress(){if(rasterWatchProbe){if(rasterTileProgressHandler)try{rasterWatchProbe.off('tileload',rasterTileProgressHandler)}catch(_){}if(rasterTileErrorHandler)try{rasterWatchProbe.off('tileerror',rasterTileErrorHandler)}catch(_){}}rasterWatchProbe=null;rasterTileProgressHandler=null;rasterTileErrorHandler=null;rasterLastTileProgressAt=0;rasterLastTileErrorAt=0;rasterTileErrorCount=0}",1)
          s=s.replace("rasterTileProgressHandler=()=>{rasterLastTileProgressAt=Date.now();rasterBadSamples=0};try{probe.on('tileload',rasterTileProgressHandler)}", "rasterTileProgressHandler=()=>{rasterLastTileProgressAt=Date.now();rasterTileErrorCount=Math.max(0,rasterTileErrorCount-1);rasterBadSamples=0};rasterTileErrorHandler=()=>{rasterLastTileErrorAt=Date.now();rasterTileErrorCount=Math.min(12,rasterTileErrorCount+1)};try{probe.on('tileload',rasterTileProgressHandler);probe.on('tileerror',rasterTileErrorHandler)}",1)
          s=s.replace("const c=rasterCoverage(probe);const bad=c.total>=3&&(c.loaded<2||c.ratio<.34);if(!bad){rasterBadSamples=0;return}rasterBadSamples++;if(rasterBadSamples<2)return;", "const c=rasterCoverage(probe);const stalledFor=rasterLastTileProgressAt?now-rasterLastTileProgressAt:Infinity;const recentError=rasterLastTileErrorAt&&now-rasterLastTileErrorAt<5000;const errorStall=rasterTileErrorCount>=2&&recentError&&stalledFor>=1800;const bad=c.total>=3&&(c.loaded<2||c.ratio<.34);if(!bad&&!errorStall){rasterBadSamples=0;return}rasterBadSamples++;if(!errorStall&&rasterBadSamples<3)return;if(errorStall&&rasterBadSamples<2)return;",1)
          if "stall-aware-watchdog" not in s or "rasterTileErrorHandler" not in s or "const errorStall=" not in s: raise SystemExit('stall-aware patch failed')
          p.write_text(s,encoding='utf-8')
          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'tour-map-openfreemap-v2\.js\?v=[^\" ]+', 'tour-map-openfreemap-v2.js?v=20260912-mayday-openfreemap-v4.3-stall-aware-watchdog', s, count=1)
          if "'stall-aware-watchdog'" not in s: s=s.replace("'tile-progress-grace',", "'tile-progress-grace','stall-aware-watchdog',",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit runtime
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Make Mayday raster watchdog stall aware'
          git pull --rebase origin master
          git push
