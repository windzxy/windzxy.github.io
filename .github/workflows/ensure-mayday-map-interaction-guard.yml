name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Cooldown failed raster providers and prefer healthy fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          old_ver = "const VER='20260912-mayday-openfreemap-v3.7-raster-watchdog-dedupe';"
          new_ver = "const VER='20260912-mayday-openfreemap-v3.8-raster-provider-cooldown';"
          if old_ver in r:
              r = r.replace(old_ver, new_ver, 1)
          elif new_ver not in r:
              raise SystemExit('unexpected Mayday map runtime version; refusing unsafe rewrite')

          old_state = "let depsPromise=null,map=null,base=null,raster=null,routeLayer=null,markerLayer=null,mode='street',mountedStage=null,switchSeq=0,resizeObserver=null,vectorBackoffUntil=0,rasterWatchTimer=null,rasterRepairBackoffUntil=0,rasterRepairKey='',rasterRepairInFlight=false,rasterRepairGeneration=0,rasterBadSamples=0,modeSwitchTimer=0,pendingMode=null;"
          new_state = "let depsPromise=null,map=null,base=null,raster=null,routeLayer=null,markerLayer=null,mode='street',mountedStage=null,switchSeq=0,resizeObserver=null,vectorBackoffUntil=0,rasterWatchTimer=null,rasterRepairBackoffUntil=0,rasterRepairKey='',rasterRepairInFlight=false,rasterRepairGeneration=0,rasterBadSamples=0,rasterProviderBackoff=Object.create(null),rasterProviderHealthy=Object.create(null),modeSwitchTimer=0,pendingMode=null;"
          if old_state in r:
              r = r.replace(old_state, new_state, 1)
          elif new_state not in r:
              raise SystemExit('raster provider health state anchor not found')

          old_fallback = "async function fallbackRaster(which,seq){const spec=FALLBACKS[which]||FALLBACKS.street;try{return await tryRaster(spec,which,seq,which==='sat')}catch(err){const secondary=SECONDARY_FALLBACKS[which];if(!secondary)throw err;if(seq!==switchSeq)return false;status(MODES[which].label+'主底圖暫時不可用，正在切換第二備援…',false);return tryRaster(secondary,which,seq,false)}}"
          new_fallback = "async function fallbackRaster(which,seq){const primary=FALLBACKS[which]||FALLBACKS.street,secondary=SECONDARY_FALLBACKS[which],now=Date.now(),primaryCooling=!!secondary&&now<(rasterProviderBackoff[which]||0);if(primaryCooling){status(MODES[which].label+'主底圖仍在冷卻，直接使用已驗證備援…',false);try{const ok=await tryRaster(secondary,which,seq,false);if(ok&&seq===switchSeq)rasterProviderHealthy[which]='secondary';return ok}catch(err){if(seq!==switchSeq)return false;rasterProviderBackoff[which]=0;throw err}}try{const ok=await tryRaster(primary,which,seq,which==='sat');if(ok&&seq===switchSeq){rasterProviderBackoff[which]=0;rasterProviderHealthy[which]='primary'}return ok}catch(err){if(!secondary)throw err;if(seq!==switchSeq)return false;rasterProviderBackoff[which]=Date.now()+90000;rasterProviderHealthy[which]='secondary';status(MODES[which].label+'主底圖暫時不可用，90 秒內優先使用第二備援…',false);try{return await tryRaster(secondary,which,seq,false)}catch(secondaryErr){if(seq===switchSeq)rasterProviderHealthy[which]='';throw secondaryErr}}}"
          if old_fallback in r:
              r = r.replace(old_fallback, new_fallback, 1)
          elif new_fallback not in r:
              raise SystemExit('fallbackRaster anchor not found')

          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260912-mayday-openfreemap-v3.8-raster-provider-cooldown" defer></script>',
              s,
              count=1,
          )
          if "'raster-provider-cooldown'" not in s:
              if "'raster-watchdog-dedupe'" not in s:
                  raise SystemExit('raster watchdog preserve marker anchor not found')
              s = s.replace("'raster-watchdog-dedupe',", "'raster-watchdog-dedupe','raster-provider-cooldown',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit raster provider cooldown if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland raster provider cooldown already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Cooldown failed Mayday raster providers before retry'
          git pull --rebase origin master
          git push
