name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Suspend raster watchdog when raster is inactive
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          old_ver = "const VER='20260912-mayday-openfreemap-v3.9-mode-switch-repair-reset';"
          new_ver = "const VER='20260912-mayday-openfreemap-v4.0-raster-watchdog-suspend';"
          if old_ver in r:
              r = r.replace(old_ver, new_ver, 1)
          elif new_ver not in r:
              raise SystemExit('unexpected Mayday map runtime version; refusing unsafe rewrite')

          old_watch = "function ensureRasterWatch(){if(rasterWatchTimer)return;rasterWatchTimer=setInterval(()=>{if(!map||!raster||rasterRepairInFlight)return;"
          new_watch = "function stopRasterWatch(){if(!rasterWatchTimer)return;clearInterval(rasterWatchTimer);rasterWatchTimer=null;rasterBadSamples=0;rasterRepairKey='';rasterRepairBackoffUntil=0}\nfunction ensureRasterWatch(){if(!raster){stopRasterWatch();return}if(rasterWatchTimer)return;rasterWatchTimer=setInterval(()=>{if(!map||!raster){stopRasterWatch();return}if(rasterRepairInFlight)return;"
          if old_watch in r:
              r = r.replace(old_watch, new_watch, 1)
          elif "function stopRasterWatch()" not in r:
              raise SystemExit('raster watchdog anchor not found')

          old_vector = "base=next;raster=null;rasterBadSamples=0;removeLayer(oldBase);removeLayer(oldRaster);"
          new_vector = "base=next;raster=null;rasterBadSamples=0;stopRasterWatch();removeLayer(oldBase);removeLayer(oldRaster);"
          if old_vector in r:
              r = r.replace(old_vector, new_vector, 1)
          elif new_vector not in r:
              raise SystemExit('vector activation anchor not found')

          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260912-mayday-openfreemap-v4.0-raster-watchdog-suspend" defer></script>',
              s,
              count=1,
          )
          if "'raster-watchdog-suspend'" not in s:
              if "'mode-switch-repair-reset'" not in s:
                  raise SystemExit('mode-switch repair preserve marker anchor not found')
              s = s.replace("'mode-switch-repair-reset',", "'mode-switch-repair-reset','raster-watchdog-suspend',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit raster watchdog suspension if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland raster watchdog suspension already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Suspend Mayday raster watchdog outside raster modes'
          git pull --rebase origin master
          git push
