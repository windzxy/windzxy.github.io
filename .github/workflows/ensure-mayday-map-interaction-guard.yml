name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Stage vector providers and keep canonical entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          r = r.replace(
              "const VER='20260911-mayday-openfreemap-v3.1-raster-seamless-handoff';",
              "const VER='20260911-mayday-openfreemap-v3.2-vector-seamless-handoff';",
              1,
          )

          old_helper = "function removeLayer(layer){if(layer&&map)try{map.removeLayer(layer)}catch(_){} }"
          new_helper = "function removeLayer(layer){if(layer&&map)try{map.removeLayer(layer)}catch(_){} }\nfunction reducedMotion(){try{return !!window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches}catch(_){return false}}\nfunction setVectorOpacity(layer,value,transition=false){try{const gl=layer?._glMap||layer?._maplibreGL;const c=layer?.getContainer?.()||layer?._container||gl?.getContainer?.()?.closest?.('.leaflet-maplibre-gl')||gl?.getCanvasContainer?.()?.parentElement;if(!c)return false;c.style.pointerEvents='none';c.style.transition=transition&&!reducedMotion()?'opacity .18s ease-out':'none';c.style.opacity=String(value);return true}catch(_){return false}}"
          if 'function setVectorOpacity(' not in r:
              if old_helper not in r:
                  raise SystemExit('removeLayer anchor not found; refusing unsafe helper injection')
              r = r.replace(old_helper, new_helper, 1)

          old_vector = "async function addVector(style,which,seq){if(!map||!window.L?.maplibreGL)throw new Error('vector unavailable');if(Date.now()<vectorBackoffUntil){status('OpenFreeMap 暫時不可用，直接使用「'+MODES[which].label+'」備援底圖…',false);return fallbackRaster(which,seq)}const next=window.L.maplibreGL({style:OFM+style,pane:'tilePane',interactive:false,attributionControl:false,renderWorldCopies:true,fadeDuration:0,padding:.08});next.addTo(map);try{await waitVector(next);if(seq!==switchSeq){removeLayer(next);return false}vectorBackoffUntil=0;const oldBase=base,oldRaster=raster;base=next;raster=null;rasterBadSamples=0;removeLayer(oldBase);removeLayer(oldRaster);try{map.attributionControl.addAttribution('OpenFreeMap © OpenMapTiles · OpenStreetMap')}catch(_){}return true}catch(err){removeLayer(next);vectorBackoffUntil=Date.now()+120000;status('OpenFreeMap '+MODES[which].label+' 暫時不可用，正在切換備援…',false);return fallbackRaster(which,seq)}}"
          new_vector = "async function addVector(style,which,seq){if(!map||!window.L?.maplibreGL)throw new Error('vector unavailable');if(Date.now()<vectorBackoffUntil){status('OpenFreeMap 暫時不可用，直接使用「'+MODES[which].label+'」備援底圖…',false);return fallbackRaster(which,seq)}const hasOld=!!(base||raster);const next=window.L.maplibreGL({style:OFM+style,pane:'tilePane',interactive:false,attributionControl:false,renderWorldCopies:true,fadeDuration:0,padding:.08});next.addTo(map);if(hasOld){setVectorOpacity(next,0,false);requestAnimationFrame(()=>setVectorOpacity(next,0,false))}try{await waitVector(next);if(seq!==switchSeq){removeLayer(next);return false}vectorBackoffUntil=0;const oldBase=base,oldRaster=raster;if(hasOld){setVectorOpacity(next,1,true);if(!reducedMotion())await new Promise(res=>setTimeout(res,190));if(seq!==switchSeq){removeLayer(next);return false}}base=next;raster=null;rasterBadSamples=0;removeLayer(oldBase);removeLayer(oldRaster);try{map.attributionControl.addAttribution('OpenFreeMap © OpenMapTiles · OpenStreetMap')}catch(_){}return true}catch(err){removeLayer(next);vectorBackoffUntil=Date.now()+120000;status('OpenFreeMap '+MODES[which].label+' 暫時不可用，正在切換備援…',false);return fallbackRaster(which,seq)}}"
          if old_vector in r:
              r = r.replace(old_vector, new_vector, 1)
          elif 'v3.2-vector-seamless-handoff' not in r or 'setVectorOpacity(next,0,false)' not in r:
              raise SystemExit('addVector canonical block not found; refusing unsafe rewrite')

          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260911-mayday-openfreemap-v3.2-vector-seamless-handoff" defer></script>',
              s,
              count=1,
          )
          if "'raster-pan-watchdog'" not in s:
              s = s.replace("'raster-viewport-health',", "'raster-viewport-health','raster-pan-watchdog',", 1)
          if "'raster-motion-stable'" not in s:
              s = s.replace("'raster-pan-watchdog',", "'raster-pan-watchdog','raster-motion-stable',", 1)
          if "'raster-seamless-handoff'" not in s:
              s = s.replace("'raster-motion-stable',", "'raster-motion-stable','raster-seamless-handoff',", 1)
          if "'vector-seamless-handoff'" not in s:
              s = s.replace("'raster-seamless-handoff',", "'raster-seamless-handoff','vector-seamless-handoff',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit vector handoff if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland vector handoff runtime already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Stage Mayday vector layers before seamless reveal'
          git pull --rebase origin master
          git push
