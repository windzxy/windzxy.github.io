name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Cancel superseded vector providers and keep canonical entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          old_ver = "const VER='20260911-mayday-openfreemap-v3.2-vector-seamless-handoff';"
          new_ver = "const VER='20260911-mayday-openfreemap-v3.3-vector-supersede-cancel';"
          if old_ver in r:
              r = r.replace(old_ver, new_ver, 1)
          elif new_ver not in r:
              raise SystemExit('unexpected Mayday map runtime version; refusing unsafe rewrite')

          old_sig = 'function waitVector(layer,timeout=5200){'
          new_sig = 'function waitVector(layer,timeout=5200,stillCurrent=null){'
          if old_sig in r:
              r = r.replace(old_sig, new_sig, 1)
          elif new_sig not in r:
              raise SystemExit('waitVector signature anchor not found')

          old_tick = "const tick=()=>{if(done)return;const gl=layer?._glMap||layer?._maplibreGL;"
          new_tick = "const tick=()=>{if(done)return;if(stillCurrent&&!stillCurrent())return finish(false,new Error('vector switch superseded'));const gl=layer?._glMap||layer?._maplibreGL;"
          if old_tick in r:
              r = r.replace(old_tick, new_tick, 1)
          elif new_tick not in r:
              raise SystemExit('waitVector cancellation anchor not found')

          old_wait = 'await waitVector(next);if(seq!==switchSeq){removeLayer(next);return false}'
          new_wait = 'await waitVector(next,5200,()=>seq===switchSeq);if(seq!==switchSeq){removeLayer(next);return false}'
          if old_wait in r:
              r = r.replace(old_wait, new_wait, 1)
          elif new_wait not in r:
              raise SystemExit('addVector readiness anchor not found')

          old_catch = "}catch(err){removeLayer(next);vectorBackoffUntil=Date.now()+120000;status('OpenFreeMap '+MODES[which].label+' 暫時不可用，正在切換備援…',false);return fallbackRaster(which,seq)}}"
          new_catch = "}catch(err){removeLayer(next);if(seq!==switchSeq)return false;vectorBackoffUntil=Date.now()+120000;status('OpenFreeMap '+MODES[which].label+' 暫時不可用，正在切換備援…',false);return fallbackRaster(which,seq)}}"
          if old_catch in r:
              r = r.replace(old_catch, new_catch, 1)
          elif new_catch not in r:
              raise SystemExit('addVector stale catch anchor not found')

          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260911-mayday-openfreemap-v3.3-vector-supersede-cancel" defer></script>',
              s,
              count=1,
          )
          if "'vector-supersede-cancel'" not in s:
              if "'vector-seamless-handoff'" not in s:
                  raise SystemExit('vector preserve marker anchor not found')
              s = s.replace("'vector-seamless-handoff',", "'vector-seamless-handoff','vector-supersede-cancel',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit superseded vector cancellation if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland superseded vector cancellation already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Cancel superseded Mayday vector providers early'
          git pull --rebase origin master
          git push
