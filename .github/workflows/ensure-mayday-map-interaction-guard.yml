name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Deduplicate raster watchdog repairs by viewport
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          old_ver = "const VER='20260912-mayday-openfreemap-v3.6-raster-supersede-cancel';"
          new_ver = "const VER='20260912-mayday-openfreemap-v3.7-raster-watchdog-dedupe';"
          if old_ver in r:
              r = r.replace(old_ver, new_ver, 1)
          elif new_ver not in r:
              raise SystemExit('unexpected Mayday map runtime version; refusing unsafe rewrite')

          old_state = "let depsPromise=null,map=null,base=null,raster=null,routeLayer=null,markerLayer=null,mode='street',mountedStage=null,switchSeq=0,resizeObserver=null,vectorBackoffUntil=0,rasterWatchTimer=null,rasterRepairBackoffUntil=0,rasterBadSamples=0,modeSwitchTimer=0,pendingMode=null;"
          new_state = "let depsPromise=null,map=null,base=null,raster=null,routeLayer=null,markerLayer=null,mode='street',mountedStage=null,switchSeq=0,resizeObserver=null,vectorBackoffUntil=0,rasterWatchTimer=null,rasterRepairBackoffUntil=0,rasterRepairKey='',rasterRepairInFlight=false,rasterRepairGeneration=0,rasterBadSamples=0,modeSwitchTimer=0,pendingMode=null;"
          if old_state in r:
              r = r.replace(old_state, new_state, 1)
          elif new_state not in r:
              raise SystemExit('raster watchdog state anchor not found')

          old_watch = "function ensureRasterWatch(){if(rasterWatchTimer)return;rasterWatchTimer=setInterval(()=>{if(!map||!raster||Date.now()<rasterRepairBackoffUntil)return;try{if(map._animatingZoom||map.dragging?._draggable?._moving)return}catch(_){}const probe=rasterProbe();if(!probe)return;const c=rasterCoverage(probe);const bad=c.total>=3&&(c.loaded<2||c.ratio<.34);if(!bad){rasterBadSamples=0;return}rasterBadSamples++;if(rasterBadSamples<2)return;rasterBadSamples=0;rasterRepairBackoffUntil=Date.now()+30000;status(MODES[mode].label+'底圖局部載入不足，正在重新建立可見區域…',false,2600);switchMode(mode,true).catch(()=>{})},2200)}"
          new_watch = "function rasterViewportKey(){try{const z=Math.round(map.getZoom());const p=map.project(map.getCenter(),z);return mode+':'+z+':'+Math.floor(p.x/256)+':'+Math.floor(p.y/256)}catch(_){return mode+':unknown'}}\nfunction ensureRasterWatch(){if(rasterWatchTimer)return;rasterWatchTimer=setInterval(()=>{if(!map||!raster||rasterRepairInFlight)return;try{if(map._animatingZoom||map.dragging?._draggable?._moving)return}catch(_){}const key=rasterViewportKey(),now=Date.now();if(key===rasterRepairKey&&now<rasterRepairBackoffUntil)return;const probe=rasterProbe();if(!probe)return;const c=rasterCoverage(probe);const bad=c.total>=3&&(c.loaded<2||c.ratio<.34);if(!bad){rasterBadSamples=0;return}rasterBadSamples++;if(rasterBadSamples<2)return;rasterBadSamples=0;rasterRepairKey=key;rasterRepairBackoffUntil=now+30000;rasterRepairInFlight=true;const generation=++rasterRepairGeneration;status(MODES[mode].label+'底圖局部載入不足，正在重新建立可見區域…',false,2600);Promise.resolve(switchMode(mode,true)).catch(()=>{}).finally(()=>{if(generation===rasterRepairGeneration)rasterRepairInFlight=false})},2200)}"
          if old_watch in r:
              r = r.replace(old_watch, new_watch, 1)
          elif new_watch not in r:
              raise SystemExit('ensureRasterWatch anchor not found')

          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260912-mayday-openfreemap-v3.7-raster-watchdog-dedupe" defer></script>',
              s,
              count=1,
          )
          if "'raster-watchdog-dedupe'" not in s:
              if "'raster-supersede-cancel'" not in s:
                  raise SystemExit('raster supersede preserve marker anchor not found')
              s = s.replace("'raster-supersede-cancel',", "'raster-supersede-cancel','raster-watchdog-dedupe',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit raster watchdog dedupe if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland raster watchdog dedupe already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Deduplicate Mayday raster watchdog repairs by viewport'
          git pull --rebase origin master
          git push