name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Reset stale raster repair ownership on manual mode switch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          old_ver = "const VER='20260912-mayday-openfreemap-v3.8-raster-provider-cooldown';"
          new_ver = "const VER='20260912-mayday-openfreemap-v3.9-mode-switch-repair-reset';"
          if old_ver in r:
              r = r.replace(old_ver, new_ver, 1)
          elif new_ver not in r:
              raise SystemExit('unexpected Mayday map runtime version; refusing unsafe rewrite')

          old_switch = "function requestModeSwitch(next){if(!MODES[next])return;pendingMode=next;++switchSeq;busy(true);status('準備切換至「'+MODES[next].label+'」底圖…');clearTimeout(modeSwitchTimer);modeSwitchTimer=setTimeout(()=>{const target=pendingMode;pendingMode=null;modeSwitchTimer=0;if(!target||target===mode){busy(false);status('',false);return}switchMode(target).catch(()=>{})},90)}"
          new_switch = "function requestModeSwitch(next){if(!MODES[next])return;pendingMode=next;++switchSeq;++rasterRepairGeneration;rasterRepairInFlight=false;rasterRepairKey='';rasterRepairBackoffUntil=0;rasterBadSamples=0;busy(true);status('準備切換至「'+MODES[next].label+'」底圖…');clearTimeout(modeSwitchTimer);modeSwitchTimer=setTimeout(()=>{const target=pendingMode;pendingMode=null;modeSwitchTimer=0;if(!target||target===mode){busy(false);status('',false);return}switchMode(target).catch(()=>{})},90)}"
          if old_switch in r:
              r = r.replace(old_switch, new_switch, 1)
          elif new_switch not in r:
              raise SystemExit('requestModeSwitch anchor not found')

          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260912-mayday-openfreemap-v3.9-mode-switch-repair-reset" defer></script>',
              s,
              count=1,
          )
          if "'mode-switch-repair-reset'" not in s:
              if "'raster-provider-cooldown'" not in s:
                  raise SystemExit('raster provider cooldown preserve marker anchor not found')
              s = s.replace("'raster-provider-cooldown',", "'raster-provider-cooldown','mode-switch-repair-reset',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit mode-switch repair reset if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland mode-switch repair reset already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Reset Mayday raster repair state on manual mode switch'
          git pull --rebase origin master
          git push
