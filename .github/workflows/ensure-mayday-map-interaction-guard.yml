name: Ensure Maydayland Map Interaction Guard
on:
  push:
    branches: [master]
    paths: ['maydayland/index.html','maydayland/tour-map-openfreemap-v2.js','.github/workflows/ensure-mayday-map-interaction-guard.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep stall-aware watchdog and adaptive provider cooldown
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('maydayland/tour-map-openfreemap-v2.js')
          s=p.read_text(encoding='utf-8')
          old_ver='20260912-mayday-openfreemap-v4.3-stall-aware-watchdog'
          new_ver='20260913-mayday-openfreemap-v4.4-adaptive-provider-backoff'
          s=s.replace(old_ver,new_ver,1)

          old_vars="rasterProviderBackoff=Object.create(null),rasterProviderHealthy=Object.create(null),rasterMotionActive=false"
          new_vars="rasterProviderBackoff=Object.create(null),rasterProviderFailures=Object.create(null),rasterProviderHealthy=Object.create(null),rasterMotionActive=false"
          if old_vars in s:
              s=s.replace(old_vars,new_vars,1)

          old_fn="""async function fallbackRaster(which,seq){const primary=FALLBACKS[which]||FALLBACKS.street,secondary=SECONDARY_FALLBACKS[which],now=Date.now(),primaryCooling=!!secondary&&now<(rasterProviderBackoff[which]||0);if(primaryCooling){status(MODES[which].label+'主底圖仍在冷卻，直接使用已驗證備援…',false);try{const ok=await tryRaster(secondary,which,seq,false);if(ok&&seq===switchSeq)rasterProviderHealthy[which]='secondary';return ok}catch(err){if(seq!==switchSeq)return false;rasterProviderBackoff[which]=0;throw err}}try{const ok=await tryRaster(primary,which,seq,which==='sat');if(ok&&seq===switchSeq){rasterProviderBackoff[which]=0;rasterProviderHealthy[which]='primary'}return ok}catch(err){if(!secondary)throw err;if(seq!==switchSeq)return false;rasterProviderBackoff[which]=Date.now()+90000;rasterProviderHealthy[which]='secondary';status(MODES[which].label+'主底圖暫時不可用，90 秒內優先使用第二備援…',false);try{return await tryRaster(secondary,which,seq,false)}catch(secondaryErr){if(seq===switchSeq)rasterProviderHealthy[which]='';throw secondaryErr}}}"""
          new_fn="""function nextRasterProviderBackoff(which){const failures=Math.min(4,(rasterProviderFailures[which]||0)+1);rasterProviderFailures[which]=failures;const delay=Math.min(360000,45000*Math.pow(2,failures-1));rasterProviderBackoff[which]=Date.now()+delay;return delay}function resetRasterProviderBackoff(which){rasterProviderFailures[which]=0;rasterProviderBackoff[which]=0}async function fallbackRaster(which,seq){const primary=FALLBACKS[which]||FALLBACKS.street,secondary=SECONDARY_FALLBACKS[which],now=Date.now(),primaryCooling=!!secondary&&now<(rasterProviderBackoff[which]||0);if(primaryCooling){const remain=Math.max(1,Math.ceil(((rasterProviderBackoff[which]||0)-now)/1000));status(MODES[which].label+'主底圖仍在冷卻（約 '+remain+' 秒），直接使用已驗證備援…',false);try{const ok=await tryRaster(secondary,which,seq,false);if(ok&&seq===switchSeq)rasterProviderHealthy[which]='secondary';return ok}catch(err){if(seq!==switchSeq)return false;rasterProviderBackoff[which]=0;throw err}}try{const ok=await tryRaster(primary,which,seq,which==='sat');if(ok&&seq===switchSeq){resetRasterProviderBackoff(which);rasterProviderHealthy[which]='primary'}return ok}catch(err){if(!secondary)throw err;if(seq!==switchSeq)return false;const delay=nextRasterProviderBackoff(which),secs=Math.round(delay/1000);rasterProviderHealthy[which]='secondary';status(MODES[which].label+'主底圖暫時不可用，約 '+secs+' 秒內優先使用第二備援…',false);try{return await tryRaster(secondary,which,seq,false)}catch(secondaryErr){if(seq===switchSeq){rasterProviderHealthy[which]='';rasterProviderBackoff[which]=0}throw secondaryErr}}}"""
          if old_fn in s:
              s=s.replace(old_fn,new_fn,1)

          required=['adaptive-provider-backoff','rasterProviderFailures=Object.create(null)','function nextRasterProviderBackoff','function resetRasterProviderBackoff','Math.min(360000,45000*Math.pow(2,failures-1))']
          if not all(x in s for x in required):
              raise SystemExit('adaptive provider backoff patch failed')
          p.write_text(s,encoding='utf-8')

          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'tour-map-openfreemap-v2\.js\?v=[^\" ]+', 'tour-map-openfreemap-v2.js?v='+new_ver, s, count=1)
          if "'adaptive-provider-backoff'" not in s:
              s=s.replace("'stall-aware-watchdog',", "'stall-aware-watchdog','adaptive-provider-backoff',",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit runtime
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Adapt Mayday raster provider retry cooldown'
          git pull --rebase origin master
          git push
