name: Ensure Maydayland Map Interaction Guard

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-interaction-guard-v1.js'
      - 'maydayland/tour-map-stability-v1.js'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-map-interaction-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Stabilize raster rendering and keep canonical entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('maydayland/tour-map-openfreemap-v2.js')
          r = runtime.read_text(encoding='utf-8')

          r = r.replace(
              "const VER='20260911-mayday-openfreemap-v3.0-raster-motion-stable';",
              "const VER='20260911-mayday-openfreemap-v3.1-raster-seamless-handoff';",
              1,
          )
          old_try = "async function tryRaster(spec,which,seq,withSatLabels=false){const probe=makeTile(spec);const extras=[];if(withSatLabels)extras.push(makeTile({url:'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',maxNativeZoom:20,attribution:'© CARTO'},{opacity:.82}));const group=L.layerGroup([probe,...extras]).addTo(map);try{await waitTiles(probe);if(seq!==switchSeq){removeLayer(group);return false}const oldBase=base,oldRaster=raster;base=null;raster=group;removeLayer(oldBase);if(oldRaster!==group)removeLayer(oldRaster);rasterBadSamples=0;ensureRasterWatch();return true}catch(err){removeLayer(group);throw err}}"
          new_try = "async function tryRaster(spec,which,seq,withSatLabels=false){const hasOld=!!(base||raster);const probe=makeTile(spec,{opacity:hasOld?0:1});const extras=[];if(withSatLabels)extras.push(makeTile({url:'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',maxNativeZoom:20,attribution:'© CARTO'},{opacity:hasOld?0:.82}));const group=L.layerGroup([probe,...extras]).addTo(map);try{await waitTiles(probe);if(seq!==switchSeq){removeLayer(group);return false}const oldBase=base,oldRaster=raster;if(hasOld){for(const layer of [probe,...extras]){try{const c=layer.getContainer?.();if(c)c.style.transition='opacity .18s ease-out'}catch(_){}}probe.setOpacity?.(1);extras.forEach(l=>l.setOpacity?.(.82));await new Promise(res=>setTimeout(res,190));if(seq!==switchSeq){removeLayer(group);return false}}base=null;raster=group;removeLayer(oldBase);if(oldRaster!==group)removeLayer(oldRaster);rasterBadSamples=0;ensureRasterWatch();return true}catch(err){removeLayer(group);throw err}}"
          if old_try in r:
              r = r.replace(old_try, new_try, 1)
          elif 'v3.1-raster-seamless-handoff' not in r:
              raise SystemExit('tryRaster canonical block not found; refusing unsafe rewrite')
          runtime.write_text(r, encoding='utf-8')

          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(
              r'<script src="\./tour-map-openfreemap-v2\.js\?v=[^"]+" defer></script>',
              '<script src="./tour-map-openfreemap-v2.js?v=20260911-mayday-openfreemap-v3.1-raster-seamless-handoff" defer></script>',
              s,
              count=1,
          )
          if "'raster-pan-watchdog'" not in s:
              s = s.replace("'raster-viewport-health',", "'raster-viewport-health','raster-pan-watchdog',", 1)
          if "'raster-motion-stable'" not in s:
              s = s.replace("'raster-pan-watchdog',", "'raster-pan-watchdog','raster-motion-stable',", 1)
          if "'raster-seamless-handoff'" not in s:
              s = s.replace("'raster-motion-stable',", "'raster-motion-stable','raster-seamless-handoff',", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit runtime stabilization if needed
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then
            echo 'Maydayland raster handoff runtime already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Stage Mayday raster layers before seamless reveal'
          git pull --rebase origin master
          git push
