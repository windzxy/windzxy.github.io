name: Verify Typhoon Overlay Motion Runtime

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-overlay-motion-coordinator-v1.js'
      - 'Html_tools/typhoon-radar-v4-1.js'
      - 'Html_tools/typhoon-satellite-pan-v1.js'
      - 'Html_tools/typhoon-weather-layer-interaction-fix-v1.js'
      - 'Html_tools/typhoon-dynamic-city-labels-v1.js'
      - 'Html_tools/typhoon-zoom-motion-v2-1.js'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'index.html'
      - '.github/workflows/ensure-typhoon-overlay-motion-coordinator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdesk-weather-runtime-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify current shared overlay motion runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              'Html_tools/global-weather-lazy-v1.js': [
                  "const VERSION='20260913-global-weather-lazy-v3.3-radar-visibility-idle'",
                  "['Html_tools/typhoon-radar-v4-1.js','20260913-typhoon-radar-v4.6-visibility-idle']",
                  "['Html_tools/typhoon-satellite-pan-v1.js','20260912-typhoon-satellite-pan-v1.4-visibility-idle']",
                  "['Html_tools/typhoon-weather-layer-interaction-fix-v1.js','20260912-typhoon-layer-interaction-v10-post-settle-stagger']",
                  "['Html_tools/typhoon-dynamic-city-labels-v1.js','20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle']",
                  "['Html_tools/typhoon-zoom-motion-v2-1.js','20260912-typhoon-zoom-motion-v2.5-visibility-idle']",
                  'radar-visibility-idle',
                  'provider-failover',
              ],
              'Html_tools/typhoon-radar-v4-1.js': [
                  "const VER='20260913-typhoon-radar-v4.6-visibility-idle'",
                  'sharedMotionCoordinator:true',
                  'visibilityIdle:true',
                  'offscreenPlaybackPause:true',
              ],
              'Html_tools/typhoon-satellite-pan-v1.js': [
                  '20260912-typhoon-satellite-pan-v1.4-visibility-idle',
                  'visibilityIdle:true',
              ],
              'Html_tools/typhoon-weather-layer-interaction-fix-v1.js': [
                  '20260912-typhoon-layer-interaction-v10-post-settle-stagger',
              ],
              'Html_tools/typhoon-dynamic-city-labels-v1.js': [
                  '20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle',
                  'sharedMotionCoordinator:true',
                  'postSettleStagger:true',
                  'visibilityIdle:true',
              ],
              'Html_tools/typhoon-zoom-motion-v2-1.js': [
                  '20260912-typhoon-zoom-motion-v2.5-visibility-idle',
                  'sharedMotionCoordinator:true',
                  'postSettleStagger:true',
                  'visibilityIdle:true',
              ],
          }

          failures=[]
          for path, markers in expected.items():
              text=Path(path).read_text(encoding='utf-8')
              missing=[m for m in markers if m not in text]
              if missing:
                  failures.append(f"{path}: missing {', '.join(missing)}")

          forbidden={
              'Html_tools/global-weather-lazy-v1.js': [
                  '20260912-global-weather-lazy-v3.2-raster-visibility-idle',
                  '20260912-typhoon-radar-v4.5-shared-motion-coordinator',
              ],
              'Html_tools/typhoon-radar-v4-1.js': [
                  "const VER='20260912-typhoon-radar-v4.5-shared-motion-coordinator'",
              ],
          }
          for path, markers in forbidden.items():
              text=Path(path).read_text(encoding='utf-8')
              present=[m for m in markers if m in text]
              if present:
                  failures.append(f"{path}: stale runtime refs present: {', '.join(present)}")

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Current WebDesk weather runtime verified; legacy rewrite disabled.')
          PY
