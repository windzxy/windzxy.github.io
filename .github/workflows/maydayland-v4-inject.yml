name: 接入 Maydayland 4.0 體驗

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "maydayland/experience.css"
      - "maydayland/experience.js"
      - ".github/workflows/maydayland-v4-inject.yml"

permissions:
  contents: write

concurrency:
  group: maydayland-v4-inject
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 接入自適應樣式並修正入口結構
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('maydayland/index.html')
          html = path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./experience.css?v=4.0.0">'
          if css not in html:
              html = html.replace('<link rel="stylesheet" href="./styles.css?v=4.0.0">', '<link rel="stylesheet" href="./styles.css?v=4.0.0">\n  ' + css, 1)
          html = html.replace(
              '<button class="enter-world" id="enterButton" disabled><span>進入五月天理想世界</span><i>→</i></button>',
              '<button class="enter-world" id="enterButton" disabled><i>→</i><span>進入五月天理想世界</span></button>',
              1
          )
          path.write_text(html, encoding='utf-8')
          PY

      - name: 驗證腳本
        run: node --check maydayland/app.js && node --check maydayland/experience.js

      - name: 提交並移除一次性工作流
        run: |
          rm -f .github/workflows/maydayland-v4-inject.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maydayland/index.html .github/workflows/maydayland-v4-inject.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "完成 Maydayland 4.0 自適應接入"
          git push
