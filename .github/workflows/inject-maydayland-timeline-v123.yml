name: Inject Maydayland Timeline v123

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/timeline-v123.js'
      - '.github/workflows/inject-maydayland-timeline-v123.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Ensure Timeline v123 is wired into the entry page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('maydayland/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="./timeline-v123.js?v=123.0.1" defer></script>\n'
          if 'timeline-v123.js' not in s:
              anchor = '  <script src="./songs-v120.js?v=123.0.0" defer></script>\n'
              if anchor not in s:
                  raise SystemExit('Maydayland script anchor not found; refusing unsafe rewrite')
              s = s.replace(anchor, tag + anchor, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit entry wiring when changed
        run: |
          if git diff --quiet -- maydayland/index.html; then
            echo "Timeline v123 already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maydayland/index.html
          git commit -m "Wire Maydayland Timeline v123 into entry"
          git push origin master
