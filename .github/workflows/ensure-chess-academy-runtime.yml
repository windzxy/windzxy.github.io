name: Ensure Chess Academy Runtime
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/chess-card-v1.js'
      - 'Html_tools/chess-render-stability-v1.js'
      - 'Html_tools/xiangqi-card-v1.js'
      - 'Html_tools/xiangqi-interaction-fix-v1.js'
      - 'Html_tools/chess-enhancement-lazy-v1.js'
      - 'Html_tools/chess-academy-v1.js'
      - 'Html_tools/chess-fun-learning-v1.js'
      - 'Html_tools/chess-piece-visuals-v1.js'
      - 'Html_tools/chess-academy-hero-v1.js'
      - 'Html_tools/chess-generated-pieces-v1.js'
      - '.github/workflows/ensure-chess-academy-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Repair Xiangqi 9x10 startup position
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          start="['r','n','b','a','k','a','b','n','r',null,null,null,null,null,null,null,null,null,null,'c',null,null,null,null,null,'c',null,'p',null,'p',null,'p',null,'p',null,'p',null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,'P',null,'P',null,'P',null,'P',null,'P',null,'C',null,null,null,null,null,'C',null,null,null,null,null,null,null,null,null,'R','N','B','A','K','A','B','N','R']"
          targets=[
            ('Html_tools/xiangqi-card-v1.js','20260911-xiangqi-v1.1-fixed-90-cell-board'),
            ('Html_tools/xiangqi-interaction-fix-v1.js','20260911-xiangqi-interaction-fix-v1.2-segmented-difficulty')
          ]
          for name,version in targets:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s,n=re.subn(r"const START=\[[^;]*\];","const START="+start+";",s,count=1)
              if n!=1:
                  raise SystemExit(f'Could not replace START in {name}')
              s=re.sub(r"const VERSION='[^']+';",f"const VERSION='{version}';",s,count=1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Keep chess cards visible and optional enhancements lazy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          optional=('chess-academy-v1','chess-fun-learning-v1','chess-piece-visuals-v1','chess-academy-hero-v1','chess-generated-pieces-v1','chess-enhancement-lazy-v1')
          for name in optional:
              s=re.sub(r'\n?<script src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)

          xiangqi='<script src="Html_tools/xiangqi-card-v1.js?v=20260911-xiangqi-v1.1-fixed-90-cell-board"></script>'
          s=re.sub(r'\n?<script src="Html_tools/xiangqi-card-v1\.js\?v=[^"]+"></script>','',s)
          chess=re.search(r'<script\s+src="Html_tools/chess-card-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if chess:
              pos=chess.end(); s=s[:pos]+'\n'+xiangqi+s[pos:]
          else:
              s=s.replace('</body>',xiangqi+'\n</body>',1)

          fix='<script src="Html_tools/xiangqi-interaction-fix-v1.js?v=20260911-xiangqi-interaction-fix-v1.2-segmented-difficulty"></script>'
          s=re.sub(r'\n?<script src="Html_tools/xiangqi-interaction-fix-v1\.js\?v=[^"]+"></script>','',s)
          xq=re.search(r'<script\s+src="Html_tools/xiangqi-card-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if xq:
              pos=xq.end(); s=s[:pos]+'\n'+fix+s[pos:]
          else:
              s=s.replace('</body>',fix+'\n</body>',1)

          render_fix='<script src="Html_tools/chess-render-stability-v1.js?v=20260911-chess-render-stability-v1.1-no-flicker"></script>'
          s=re.sub(r'\n?<script src="Html_tools/chess-render-stability-v1\.js\?v=[^"]+"></script>','',s)
          polish=re.search(r'<script\s+src="Html_tools/boardgame-polish-v3-lite\.js\?v=[^"]+"\s*>\s*</script>',s)
          if polish:
              pos=polish.end(); s=s[:pos]+'\n'+render_fix+s[pos:]
          else:
              s=s.replace('</body>',render_fix+'\n</body>',1)

          lazy='<script src="Html_tools/chess-enhancement-lazy-v1.js?v=20260911-chess-enhancement-lazy-v1.1-explicit-tutorial"></script>'
          anchor=re.search(r'<script\s+src="Html_tools/xiangqi-interaction-fix-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if anchor:
              pos=anchor.end(); s=s[:pos]+'\n'+lazy+s[pos:]
          else:
              s=s.replace('</body>',lazy+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit chess runtime corrections
        run: |
          if git diff --quiet -- index.html Html_tools/xiangqi-card-v1.js Html_tools/xiangqi-interaction-fix-v1.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html Html_tools/xiangqi-card-v1.js Html_tools/xiangqi-interaction-fix-v1.js
          git commit -m 'Polish Xiangqi difficulty controls'
          git pull --rebase origin master
          git push
