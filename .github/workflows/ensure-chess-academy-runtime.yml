name: Ensure Chess Academy Runtime
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/chess-academy-v1.js'
      - 'Html_tools/xiangqi-card-v1.js'
      - '.github/workflows/ensure-chess-academy-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep canonical chess academy loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('chess-academy-v1','xiangqi-card-v1'):
              s=re.sub(r'\n?<script src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)
          anchor='<script src="Html_tools/boardgame-polish-v2.js?v=20260910-boardgame-polish-v2.0"></script>'
          tags=[
              '<script src="Html_tools/chess-academy-v1.js?v=20260910-chess-academy-v1.0-zero-to-competition"></script>',
              '<script src="Html_tools/xiangqi-card-v1.js?v=20260910-xiangqi-v1.0-learn-play"></script>'
          ]
          if anchor not in s:
              raise SystemExit('boardgame anchor missing')
          s=s.replace(anchor,anchor+'\n'+'\n'.join(tags))
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit formal entry update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep Chess Academy and Xiangqi runtimes loaded'
          git push