name: Ensure Chess Academy Runtime
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/chess-enhancement-lazy-v1.js'
      - 'Html_tools/chess-academy-v1.js'
      - 'Html_tools/chess-fun-learning-v1.js'
      - 'Html_tools/chess-piece-visuals-v1.js'
      - 'Html_tools/chess-academy-hero-v1.js'
      - 'Html_tools/chess-generated-pieces-v1.js'
      - '.github/workflows/ensure-chess-academy-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep optional chess features off startup path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          heavy=('chess-academy-v1','xiangqi-card-v1','chess-fun-learning-v1','chess-piece-visuals-v1','chess-academy-hero-v1','chess-generated-pieces-v1','chess-enhancement-lazy-v1')
          for name in heavy:
              s=re.sub(r'\n?<script src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)
          tag='<script src="Html_tools/chess-enhancement-lazy-v1.js?v=20260911-chess-enhancement-lazy-v1.1-explicit-tutorial"></script>'
          anchor=re.search(r'<script\s+src="Html_tools/chess-card-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if anchor:
              pos=anchor.end(); s=s[:pos]+'\n'+tag+s[pos:]
          else:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit startup performance update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep Chess Academy opt-in and lazy'
          git pull --rebase origin master
          git push