name: Ensure Chess Academy Runtime
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/chess-card-v1.js'
      - 'Html_tools/xiangqi-card-v1.js'
      - 'Html_tools/chess-enhancement-lazy-v1.js'
      - 'Html_tools/chess-academy-v1.js'
      - 'Html_tools/chess-fun-learning-v1.js'
      - 'Html_tools/chess-piece-visuals-v1.js'
      - 'Html_tools/chess-academy-hero-v1.js'
      - 'Html_tools/chess-generated-pieces-v1.js'
      - '.github/workflows/ensure-chess-academy-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep chess cards visible and optional enhancements lazy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Core game cards must stay on the startup path so they are visible in Function Center.
          # Only optional teaching/visual enhancement modules remain lazy.
          optional=('chess-academy-v1','chess-fun-learning-v1','chess-piece-visuals-v1','chess-academy-hero-v1','chess-generated-pieces-v1','chess-enhancement-lazy-v1')
          for name in optional:
              s=re.sub(r'\n?<script src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"></script>','',s)

          xiangqi='<script src="Html_tools/xiangqi-card-v1.js?v=20260910-xiangqi-v1.0-learn-play"></script>'
          # Remove stale/duplicate Xiangqi tags, then place exactly once beside the chess card.
          s=re.sub(r'\n?<script src="Html_tools/xiangqi-card-v1\.js\?v=[^"]+"></script>','',s)
          chess=re.search(r'<script\s+src="Html_tools/chess-card-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if chess:
              pos=chess.end(); s=s[:pos]+'\n'+xiangqi+s[pos:]
          else:
              s=s.replace('</body>',xiangqi+'\n</body>',1)

          lazy='<script src="Html_tools/chess-enhancement-lazy-v1.js?v=20260911-chess-enhancement-lazy-v1.1-explicit-tutorial"></script>'
          chess_or_xq=re.search(r'<script\s+src="Html_tools/xiangqi-card-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if chess_or_xq:
              pos=chess_or_xq.end(); s=s[:pos]+'\n'+lazy+s[pos:]
          else:
              s=s.replace('</body>',lazy+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit chess card startup update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Expose Chinese Xiangqi card in WebDesk'
          git pull --rebase origin master
          git push