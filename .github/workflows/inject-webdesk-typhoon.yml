name: Inject WebDesk Typhoon Widget

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-widget.js'
      - 'Html_tools/typhoon-window-p0-fix.js'
      - 'Html_tools/typhoon-radar-v4-1.js'
      - 'Html_tools/typhoon-atmosphere-v5-1.js'
      - 'Html_tools/typhoon-openfreemap-v6.js'
      - 'Html_tools/typhoon-product-shell-v6.js'
      - 'Html_tools/typhoon-weather-runtime-v11.js'
      - 'Html_tools/typhoon-weather-ui-recovery-v11-1.js'
      - '.github/workflows/inject-webdesk-typhoon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Wire consolidated Zoom Earth style typhoon stack
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          widget='<script src="Html_tools/typhoon-widget.js?v=20260901-typhoon-p0-unified-runtime"></script>'
          window_fix='<script src="Html_tools/typhoon-window-p0-fix.js?v=20260903-typhoon-window-p0-fix5-restore-weather"></script>'
          radar='<script src="Html_tools/typhoon-radar-v4-1.js?v=20260902-typhoon-radar-v4.2-sync"></script>'
          atmosphere='<script src="Html_tools/typhoon-atmosphere-v5-1.js?v=20260902-typhoon-atmosphere-v5.2-sync"></script>'
          openfreemap='<script src="Html_tools/typhoon-openfreemap-v6.js?v=20260902-typhoon-openfreemap-v6.3-antiflicker"></script>'
          shell='<script src="Html_tools/typhoon-product-shell-v6.js?v=20260902-typhoon-product-shell-v6-keyless"></script>'
          weather='<script src="Html_tools/typhoon-weather-runtime-v11.js?v=20260902-typhoon-weather-v11-consolidated"></script>'
          recovery='<script src="Html_tools/typhoon-weather-ui-recovery-v11-1.js?v=20260903-typhoon-weather-ui-recovery-v11.2-passive"></script>'
          patterns=[
            r'\n?<script src="Html_tools/typhoon-widget\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-window-p0-fix\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-radar-v4-1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-atmosphere-v5-1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-runtime-repair-v8\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-hotfix-v7\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-runtime-v7\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-runtime-v10\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-runtime-v11\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-ui-recovery-v11-1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-native-weather-v2\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-openfreemap-v6\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-product-shell-v5\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-product-shell-v6\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-keyless-basemap-v5-1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-layers-v5-5\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-layers-toolbar-v1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-zoomearth-sync-v4\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-product-v5\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-product-v5-2\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-layout-v5-3\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-polish-v5-4\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-layers-v5-6-fix\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-weather-smooth-v5-7\.js\?v=[^"]+"></script>'
          ]
          s2=s
          for pat in patterns:
              s2=re.sub(pat,'',s2)
          anchor='<script src="Html_tools/fx-widget.js?v=20260819-fx-widget6-custom-dropdown"></script>'
          if anchor not in s2:
              raise SystemExit('fx widget anchor not found')
          stack='\n'.join([widget,window_fix,radar,atmosphere,openfreemap,shell,weather,recovery])
          s2=s2.replace(anchor,anchor+'\n'+stack,1)
          if s2!=s:
              p.write_text(s2,encoding='utf-8')
              print('wired consolidated typhoon weather v11 + weather-control restore bridge')
          else:
              print('weather-control restore bridge already wired')
          PY
      - name: Verify consolidated typhoon stack
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          wanted=[
            'Html_tools/typhoon-widget.js',
            'Html_tools/typhoon-window-p0-fix.js',
            'Html_tools/typhoon-radar-v4-1.js',
            'Html_tools/typhoon-atmosphere-v5-1.js',
            'Html_tools/typhoon-openfreemap-v6.js',
            'Html_tools/typhoon-product-shell-v6.js',
            'Html_tools/typhoon-weather-runtime-v11.js',
            'Html_tools/typhoon-weather-ui-recovery-v11-1.js'
          ]
          pos=[]
          for f in wanted:
              c=s.count(f)
              if c!=1: raise SystemExit(f'{f}: expected once, got {c}')
              pos.append(s.index(f))
          if pos!=sorted(pos): raise SystemExit('load order invalid')
          if 'typhoon-window-p0-fix5-restore-weather' not in s: raise SystemExit('weather-control restore cache token missing')
          if 'typhoon-weather-v11-consolidated' not in s: raise SystemExit('v11 cache token missing')
          if 'typhoon-weather-ui-recovery-v11.2-passive' not in s: raise SystemExit('v11.2 passive recovery cache token missing')
          print('consolidated v11 stack + weather-control restore bridge verified')
          PY
      - name: Commit injected entry update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore typhoon weather controls in window bridge'
          git push
