name: Inject WebDesk Typhoon Widget

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-widget.js'
      - 'Html_tools/typhoon-radar-v4-1.js'
      - '.github/workflows/inject-webdesk-typhoon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Wire typhoon widget into WebDesk entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          widget = '<script src="Html_tools/typhoon-widget.js?v=20260901-typhoon-widget4-interactive-map"></script>'
          radar = '<script src="Html_tools/typhoon-radar-v4-1.js?v=20260901-typhoon-radar-v4.1"></script>'
          s2 = re.sub(r'\n?<script src="Html_tools/typhoon-widget\.js\?v=[^"]+"></script>', '', s)
          s2 = re.sub(r'\n?<script src="Html_tools/typhoon-radar-v4-1\.js\?v=[^"]+"></script>', '', s2)
          anchor = '<script src="Html_tools/fx-widget.js?v=20260819-fx-widget6-custom-dropdown"></script>'
          if anchor not in s2:
              raise SystemExit('fx widget anchor not found; refusing unsafe rewrite')
          s2 = s2.replace(anchor, anchor + '\n' + widget + '\n' + radar, 1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('wired typhoon v4 + animated radar v4.1 into WebDesk entry')
          else:
              print('typhoon v4.1 already wired')
          PY
      - name: Commit injected entry update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire WebDesk typhoon animated radar v4.1'
          git push
