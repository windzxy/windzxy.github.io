name: Inject WebDesk Typhoon Widget

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-widget.js'
      - 'Html_tools/typhoon-radar-v4-1.js'
      - 'Html_tools/typhoon-product-v5.js'
      - 'Html_tools/typhoon-atmosphere-v5-1.js'
      - 'Html_tools/typhoon-product-v5-2.js'
      - 'Html_tools/typhoon-layout-v5-3.js'
      - 'Html_tools/typhoon-polish-v5-4.js'
      - '.github/workflows/inject-webdesk-typhoon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Wire typhoon widget into WebDesk entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          widget = '<script src="Html_tools/typhoon-widget.js?v=20260901-typhoon-widget4-interactive-map"></script>'
          radar = '<script src="Html_tools/typhoon-radar-v4-1.js?v=20260901-typhoon-radar-v4.1"></script>'
          product = '<script src="Html_tools/typhoon-product-v5.js?v=20260901-typhoon-product-v5-impact-center"></script>'
          atmosphere = '<script src="Html_tools/typhoon-atmosphere-v5-1.js?v=20260901-typhoon-atmosphere-v5.1-himawari-alerts"></script>'
          runtime = '<script src="Html_tools/typhoon-product-v5-2.js?v=20260901-typhoon-product-v5.2-runtime-hardened"></script>'
          layout = '<script src="Html_tools/typhoon-layout-v5-3.js?v=20260901-typhoon-layout-v5.3-overlay-safe"></script>'
          polish = '<script src="Html_tools/typhoon-polish-v5-4.js?v=20260901-typhoon-polish-v5.4-freshness"></script>'
          patterns = [
            r'\n?<script src="Html_tools/typhoon-widget\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-radar-v4-1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-product-v5\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-atmosphere-v5-1\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-product-v5-2\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-layout-v5-3\.js\?v=[^"]+"></script>',
            r'\n?<script src="Html_tools/typhoon-polish-v5-4\.js\?v=[^"]+"></script>'
          ]
          s2=s
          for pattern in patterns:
              s2=re.sub(pattern,'',s2)
          anchor = '<script src="Html_tools/fx-widget.js?v=20260819-fx-widget6-custom-dropdown"></script>'
          if anchor not in s2:
              raise SystemExit('fx widget anchor not found; refusing unsafe rewrite')
          s2=s2.replace(anchor,anchor+'\n'+widget+'\n'+radar+'\n'+product+'\n'+atmosphere+'\n'+runtime+'\n'+layout+'\n'+polish,1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
              print('wired typhoon through polish v5.4')
          else:
              print('typhoon product v5.4 already wired')
          PY
      - name: Commit injected entry update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire WebDesk typhoon polish v5.4'
          git push
