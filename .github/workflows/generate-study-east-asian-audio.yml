name: Generate Study East Asian Audio

on:
  push:
    branches: [master]
    paths:
      - tools/generate-study-east-asian-audio.py
      - .github/workflows/generate-study-east-asian-audio.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: study-east-asian-audio
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check edge-tts==7.2.8
      - run: python tools/generate-study-east-asian-audio.py
      - run: |
          test "$(find test/Study/assets/audio/east-asian -name '*.mp3' -size +2k | wc -l)" -eq 40
          python -m json.tool test/Study/assets/audio/east-asian/manifest.json >/dev/null
          grep -q 'ja-JP-NanamiNeural' test/Study/assets/audio/east-asian/manifest.json
          grep -q 'ko-KR-SunHiNeural' test/Study/assets/audio/east-asian/manifest.json
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/Study/assets/audio/east-asian
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Japanese and Korean lesson audio"
          git pull --rebase origin master
          git push
