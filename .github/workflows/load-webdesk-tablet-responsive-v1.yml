name: Load WebDesk Tablet Responsive V1
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/webdesk-tablet-responsive-v1.js'
      - '.github/workflows/load-webdesk-tablet-responsive-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inject tablet responsive runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/webdesk-tablet-responsive-v1\.js\?v=[^"]+"></script>','',s)
          tag='<script src="Html_tools/webdesk-tablet-responsive-v1.js?v=20260913-webdesk-tablet-responsive-v1.0"></script>'
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load tablet responsive WebDesk UI'
          git pull --rebase origin master
          git push
