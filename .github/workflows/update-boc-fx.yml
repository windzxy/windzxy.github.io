name: Update BOC FX Rates

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/update-boc-fx.py'
      - '.github/workflows/update-boc-fx.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch BOC FX rates
        run: python scripts/update-boc-fx.py

      - name: Commit BOC FX snapshot
        run: |
          if git diff --quiet -- data/boc-fx.json; then
            echo "BOC FX snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boc-fx.json
          git commit -m "Update BOC FX rates snapshot"
          git push
