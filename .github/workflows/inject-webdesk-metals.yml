name: Inject WebDesk Metals Widget

on:
  push:
    branches:
      - master
    paths:
      - 'Html_tools/metals-widget.js'
      - '.github/workflows/inject-webdesk-metals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch and inject metals widget script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260819-gold-widget31-medium-chart'
          js_path = Path('Html_tools/metals-widget.js')
          if js_path.exists():
              js = js_path.read_text(encoding='utf-8')
              js = re.sub(r"const VER='[^']+';", f"const VER='{version}';", js, count=1)
              js = re.sub(
                  r"const DEFAULT_W=620,DEFAULT_H=410,MIN_W=300,MIN_H=238,CHART_W=\d+,CHART_H=\d+;",
                  "const DEFAULT_W=620,DEFAULT_H=410,MIN_W=300,MIN_H=238,CHART_W=310,CHART_H=260;",
                  js,
                  count=1,
              )
              js = js.replace("['xpt','現貨鉑金','鉑金','XPT','OANDA:XPTUSD','https://www.gkoudai.com/quotesTrend/74.html']", "['xpt','現貨鉑金','鉑金','XPT','hf_XPT','OANDA:XPTUSD','https://www.gkoudai.com/quotesTrend/74.html']")
              js = js.replace("['xpd','現貨鈀金','鈀金','XPD','OANDA:XPDUSD','https://www.gkoudai.com/quotesTrend/75.html']", "['xpd','現貨鈀金','鈀金','XPD','hf_XPD','OANDA:XPDUSD','https://www.gkoudai.com/quotesTrend/75.html']")
              js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          tag = f'<script src="Html_tools/metals-widget.js?v={version}"></script>'
          pattern = r'<script\s+src="Html_tools/metals-widget\.js\?v=[^"]+"\s*>\s*</script>'
          if re.search(pattern, html):
              html = re.sub(pattern, tag, html, count=1)
          else:
              html = html.replace('</body>', tag + '\n</body>', 1)
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit metals widget updates
        run: |
          if git diff --quiet -- Html_tools/metals-widget.js index.html; then
            echo "Metals widget already has medium chart patch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Html_tools/metals-widget.js index.html
          git commit -m "Patch WebDesk metals medium chart mode"
          git push