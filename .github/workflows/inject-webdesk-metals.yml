name: Inject WebDesk Metals Widget

on:
  push:
    branches:
      - master
    paths:
      - 'Html_tools/metals-widget.js'
      - '.github/workflows/inject-webdesk-metals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch metals widget to trading desk final
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = '20260819-gold-widget24-tradingdesk-final'
          js_path = Path('Html_tools/metals-widget.js')
          js = js_path.read_text(encoding='utf-8')

          js = re.sub(
              r"const APP='metals',VER='[^']+',MS=\d+,DW=\d+,DH=\d+,MINW=\d+,MINH=\d+;",
              "const APP='metals',VER='20260819-gold-widget24-tradingdesk-final',MS=200,DW=560,DH=380,MINW=300,MINH=238;",
              js,
              count=1,
          )
          js = js.replace("TradingView 快速圖表 + 自適應數值看板。", "交易主管版貴金屬看板：大窗只看圖表，小窗只看數值，快速備援刷新。")
          js = js.replace("const initialNum=(card.w||DW)<520||(card.h||DH)<330;", "const initialNum=(card.w||DW)<560||(card.h||DH)<340;")
          js = js.replace("const label=feed==='api'?'口袋 API':'備援行情';", "const label=feed==='api'?'口袋 API':'高速備援';")
          js = js.replace("TradingView · 1分鐘", "TradingView · 1m live")
          js = js.replace("圖表為準</b><span>TradingView 自動刷新；外層數值為備援快照。</span>", "專業圖表</b><span>大窗只保留 TradingView 圖表區；外層數值不干擾判斷。</span>")
          js = js.replace("w.clientWidth<520||w.clientHeight<330", "w.clientWidth<560||w.clientHeight<340")
          js = js.replace("'備援行情時間 '+esc(q.sourceTime||q.t||'--')+' · 非口袋同步'", "'快照時間 '+esc(q.sourceTime||q.t||'--')+' · TradingView 圖表自動刷新'")
          js = js.replace("'https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(p.tv)+'&interval=1&range=1D&hidesidetoolbar=1&hide_side_toolbar=1&symboledit=0&allow_symbol_change=0&saveimage=0&save_image=0&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Asia%2FShanghai&withdateranges=1&hideideas=1&locale=zh_CN'", "'https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(p.tv)+'&interval=1&range=1D&hidesidetoolbar=1&hide_side_toolbar=1&hide_top_toolbar=1&symboledit=0&allow_symbol_change=0&saveimage=0&save_image=0&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Asia%2FShanghai&withdateranges=1&hideideas=1&locale=zh_CN'")

          override = "/* v24 delivery overrides */.tm:not(.num-mode) .quote-panel,.tm:not(.num-mode) .stats{display:none!important}.tm:not(.num-mode) .chart-panel{display:flex!important;grid-template-columns:1fr!important;padding:12px!important}.tm:not(.num-mode) .chart-panel>aside{display:none!important}.tm:not(.num-mode) .tvbox{min-height:220px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.tm:not(.num-mode) .chart-head{margin-bottom:8px}.tm:not(.num-mode) .chart-meta{font-size:11px}.tm.num-mode .chart-panel{display:none!important}.tm.num-mode .quote-panel{display:grid!important}.tm.num-mode .stats{display:grid!important}.tm.num-mode .tvbox{display:none!important}.tm.num-mode .tabs{margin-bottom:0}.tm:not(.num-mode) footer span{max-width:70%}@container (min-width:760px){.tm:not(.num-mode) .tvbox{min-height:300px}}"
          if '/* v24 delivery overrides */' not in js:
              js = js.replace("`;document.head.appendChild(s);}", override + "`;document.head.appendChild(s);}", 1)

          js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          tag = f'<script src="Html_tools/metals-widget.js?v={version}"></script>'
          pattern = r'<script\s+src="Html_tools/metals-widget\.js\?v=[^"]+"\s*>\s*</script>'
          if re.search(pattern, html):
              html = re.sub(pattern, tag, html, count=1)
          else:
              html = html.replace('</body>', tag + '\n</body>', 1)
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Commit metals widget delivery
        run: |
          if git diff --quiet -- Html_tools/metals-widget.js index.html; then
            echo "Metals widget already at final delivery version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Html_tools/metals-widget.js index.html
          git commit -m "Finalize WebDesk metals trading panel"
          git push