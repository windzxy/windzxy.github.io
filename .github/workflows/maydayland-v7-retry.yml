name: Retry Maydayland 7.0 Tracker

on:
  push:
    paths:
      - .github/workflows/maydayland-v7-retry.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and assemble tracker package
        shell: python
        run: |
          import base64, io, re, shutil, tarfile
          from pathlib import Path

          source = Path('.github/workflows/maydayland-v7-build.yml').read_text(encoding='utf-8')
          match = re.search(r'payload = """(.*?)"""', source, re.S)
          if not match:
              raise RuntimeError('Maydayland package payload was not found')

          payload = ''.join(re.findall(r'[A-Za-z0-9+/=]', match.group(1)))
          archive = base64.b64decode(payload)
          staging = Path('.maydayland-v7')
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()

          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
              members = tar.getmembers()
              if not members:
                  raise RuntimeError('Maydayland package is empty')
              tar.extractall(staging)

          required = ['index.html', 'styles.css', 'app.js', 'release.json']
          for name in required:
              if not (staging / name).is_file():
                  raise RuntimeError(f'Missing required file: {name}')

          target = Path('maydayland')
          target.mkdir(exist_ok=True)
          for name in required:
              shutil.copy2(staging / name, target / name)

          assets_target = target / 'assets' / 'mojo'
          if assets_target.exists():
              shutil.rmtree(assets_target)
          assets_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(staging / 'assets' / 'mojo', assets_target)

          shutil.rmtree(staging)
          Path('.github/workflows/maydayland-v7-build.yml').unlink(missing_ok=True)
          Path('.github/workflows/maydayland-v7-retry.yml').unlink(missing_ok=True)

      - name: Validate and publish
        run: |
          node --check maydayland/app.js
          grep -q 'Maydayland Tracker' maydayland/index.html
          grep -q 'styles.css?v=7.0.0' maydayland/index.html
          grep -q 'app.js?v=7.0.0' maydayland/index.html
          grep -q 'interactive Mayday memory signal map' maydayland/release.json
          for image in orange peach banana apple watermelon cherry; do
            test -s "maydayland/assets/mojo/${image}.png"
          done
          if grep -R -E 'Spidey|Spider-Man|spider-man|spideytracker|mojo-data\.js|Solara|giscus' maydayland; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '從零切換 Maydayland 7.0 訊號追蹤器風格'
          git push
