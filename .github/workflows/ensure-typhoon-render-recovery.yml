name: Ensure Typhoon Render Recovery
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-render-recovery-v1.js'
      - '.github/workflows/ensure-typhoon-render-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep typhoon render recovery loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/typhoon-render-recovery-v1\.js\?v=[^"]+"></script>','',s)
          anchor_pat=r'(<script src="Html_tools/typhoon-weather-ui-recovery-v11-1\.js\?v=[^"]+"></script>)'
          tag='<script src="Html_tools/typhoon-render-recovery-v1.js?v=20260911-typhoon-render-recovery-v1.1-leaflet"></script>'
          if re.search(anchor_pat,s):
              s=re.sub(anchor_pat,r'\1\n'+tag,s,count=1)
          else:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit formal entry update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load typhoon render recovery guard'
          git push
