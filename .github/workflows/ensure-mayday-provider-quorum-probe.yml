name: Ensure Maydayland Provider Quorum Probe
on:
  push:
    branches: [master]
    paths: ['maydayland/index.html','maydayland/tour-map-openfreemap-v2.js','.github/workflows/ensure-mayday-provider-quorum-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maydayland-map-runtime
  cancel-in-progress: false
jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Bind recovery probes to switch and viewport generation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('maydayland/tour-map-openfreemap-v2.js')
          s=p.read_text(encoding='utf-8')
          old_ver='20260913-mayday-openfreemap-v4.6-viewport-quorum-probe'
          new_ver='20260913-mayday-openfreemap-v4.7-probe-generation-cancel'
          if old_ver in s:
              s=s.replace(old_ver,new_ver,1)
          elif new_ver not in s:
              raise SystemExit('Unexpected Mayday map version; refusing unsafe patch')

          old_state='rasterProviderProbe=Object.create(null),rasterMotionActive=false'
          new_state='rasterProviderProbe=Object.create(null),rasterProviderProbeGeneration=Object.create(null),rasterMotionActive=false'
          if old_state in s:
              s=s.replace(old_state,new_state,1)
          elif 'rasterProviderProbeGeneration=Object.create(null)' not in s:
              raise SystemExit('Provider probe state anchor missing; refusing unsafe patch')

          old_probe="""function probeRasterProvider(which,spec,timeout=1900){if(rasterProviderProbe[which])return rasterProviderProbe[which];const tiles=rasterProbeCoords().slice(0,3);rasterProviderProbe[which]=Promise.all(tiles.map(tile=>probeRasterImage(spec,tile,timeout))).then(results=>results.filter(Boolean).length>=2).catch(()=>false).finally(()=>{rasterProviderProbe[which]=null});return rasterProviderProbe[which]}"""
          new_probe="""function rasterProbeSignature(tiles){return tiles.map(t=>t.z+':'+t.x+':'+t.y).join('|')}function probeRasterProvider(which,spec,seq,timeout=1900){const active=rasterProviderProbe[which];if(active&&active.seq===seq)return active.promise;const generation=(rasterProviderProbeGeneration[which]||0)+1;rasterProviderProbeGeneration[which]=generation;const tiles=rasterProbeCoords().slice(0,3),signature=rasterProbeSignature(tiles);const stillValid=()=>seq===switchSeq&&generation===rasterProviderProbeGeneration[which]&&signature===rasterProbeSignature(rasterProbeCoords().slice(0,3));const promise=Promise.all(tiles.map(tile=>probeRasterImage(spec,tile,timeout))).then(results=>({ok:results.filter(Boolean).length>=2,valid:stillValid()})).catch(()=>({ok:false,valid:stillValid()})).finally(()=>{if(rasterProviderProbe[which]?.generation===generation)rasterProviderProbe[which]=null});rasterProviderProbe[which]={seq,generation,promise};return promise}"""
          if old_probe in s:
              s=s.replace(old_probe,new_probe,1)
          elif 'function rasterProbeSignature(tiles)' not in s:
              raise SystemExit('Expected v4.6 quorum probe not found; refusing unsafe patch')

          old_recovery="""const recovered=await probeRasterProvider(which,primary);if(seq!==switchSeq)return false;if(!recovered){"""
          new_recovery="""const recovery=await probeRasterProvider(which,primary,seq);if(seq!==switchSeq||!recovery?.valid)return false;if(!recovery.ok){"""
          if old_recovery in s:
              s=s.replace(old_recovery,new_recovery,1)
          elif new_recovery not in s:
              raise SystemExit('Provider recovery call anchor missing; refusing unsafe patch')

          required=['probe-generation-cancel','rasterProviderProbeGeneration=Object.create(null)','function rasterProbeSignature(tiles)','active&&active.seq===seq','generation===rasterProviderProbeGeneration[which]','signature===rasterProbeSignature(rasterProbeCoords().slice(0,3))','probeRasterProvider(which,primary,seq)','!recovery?.valid','!recovery.ok']
          if not all(x in s for x in required):
              raise SystemExit('Probe generation cancellation verification failed')
          p.write_text(s,encoding='utf-8')

          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'tour-map-openfreemap-v2\.js\?v=[^\" ]+', 'tour-map-openfreemap-v2.js?v='+new_ver, s, count=1)
          if "'probe-generation-cancel'" not in s:
              s=s.replace("'viewport-quorum-probe',", "'viewport-quorum-probe','probe-generation-cancel',",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify map baselines
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('maydayland/tour-map-openfreemap-v2.js').read_text(encoding='utf-8')
          html=Path('maydayland/index.html').read_text(encoding='utf-8')
          js_required=["street:{kind:'vector'","bright:{kind:'vector'","terrain:{kind:'raster'","dark:{kind:'vector'","sat:{kind:'sat'",'SECONDARY_FALLBACKS','rasterProviderBackoff','rasterProviderFailures','rasterProviderProbe','rasterProviderProbeGeneration','function probeRasterProvider','function rasterProbeCoords()','function rasterProbeSignature(tiles)','@media(max-width:720px)']
          html_required=['stall-aware-watchdog','adaptive-provider-backoff','provider-recovery-probe','viewport-quorum-probe','probe-generation-cancel']
          missing=[x for x in js_required if x not in js]+[x for x in html_required if x not in html]
          if missing: raise SystemExit('Baseline regression: '+', '.join(missing))
          PY
      - name: Commit runtime
        run: |
          if git diff --quiet -- maydayland/tour-map-openfreemap-v2.js maydayland/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/tour-map-openfreemap-v2.js maydayland/index.html
          git commit -m 'Cancel stale Mayday provider recovery probes'
          git pull --rebase origin master
          git push