name: Ensure Maydayland Provider Quorum Probe
on:
  push:
    branches: [master]
    paths:
      - 'maydayland/index.html'
      - 'maydayland/tour-map-openfreemap-v2.js'
      - '.github/workflows/ensure-mayday-provider-quorum-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maydayland-map-runtime-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify current map recovery baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('maydayland/tour-map-openfreemap-v2.js').read_text(encoding='utf-8')
          html=Path('maydayland/index.html').read_text(encoding='utf-8')
          js_required=[
              "street:{kind:'vector'", "bright:{kind:'vector'", "terrain:{kind:'raster'",
              "dark:{kind:'vector'", "sat:{kind:'sat'", 'SECONDARY_FALLBACKS',
              'rasterProviderBackoff', 'rasterProviderFailures', 'rasterProviderProbe',
              'rasterProviderProbeGeneration', 'rasterProviderProbeAbort', 'rasterProviderProbeStarts',
              'function probeRasterProvider', 'function rasterProbeCoords()', 'function rasterProbeSignature(tiles)',
              'function cancelRasterProviderProbe(which)', 'function waitRasterProbeSettle(seq,generation,signature,which)',
              'windowMs=8000,maxStarts=3', 'probeRasterImage(spec,tile,timeout,aborters)',
              'map.setRenderWorldCopies?.(true)', '@media(max-width:720px)'
          ]
          html_required=[
              'stall-aware-watchdog','adaptive-provider-backoff','provider-recovery-probe',
              'viewport-quorum-probe','probe-generation-cancel','probe-request-budget','probe-settle-budget',
              'tour-map-interaction-guard-v1.1-resize-coordinator','tour-map-stability-v1.4-shared-resize-coordinator'
          ]
          missing=[x for x in js_required if x not in js]+[x for x in html_required if x not in html]
          if missing:
              raise SystemExit('Baseline regression: '+', '.join(missing))
          PY