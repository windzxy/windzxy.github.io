name: Inject WebDesk Table Delimiter Fix

on:
  push:
    branches:
      - master
    paths:
      - 'Html_tools/table-delimiter-fix-v1.js'
      - '.github/workflows/inject-webdesk-table-delimiter-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Table delimiter helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<script\s+src="Html_tools/table-delimiter-fix-v1\.js\?v=[^"]+"\s*>\s*</script>\s*', '', html)
          tag = '<script src="Html_tools/table-delimiter-fix-v1.js?v=20260903-table-delimiter-fix-v1.2"></script>'
          html = html.replace('</body>', tag + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit injected helper
        run: |
          if git diff --quiet -- index.html; then
            echo "Table delimiter helper already injected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject WebDesk Table delimiter fix"
          git push