name: Load Flight Chess V2
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/flight-chess-card-v2.js'
      - '.github/workflows/load-flight-chess-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inject Flight Chess v2 runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/flight-chess-card-v2\.js\?v=[^"]+"></script>','',s)
          tag='<script src="Html_tools/flight-chess-card-v2.js?v=20260913-flight-chess-v2.0-cross-product"></script>'
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Flight Chess v2 cross-board runtime'
          git pull --rebase origin master
          git push
