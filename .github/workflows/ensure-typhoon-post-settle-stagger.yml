name: Ensure Typhoon Post Settle Stagger

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ensure-typhoon-post-settle-stagger.yml'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'Html_tools/typhoon-weather-layer-interaction-fix-v1.js'
      - 'Html_tools/typhoon-dynamic-city-labels-v1.js'
      - 'Html_tools/typhoon-zoom-motion-v2-1.js'
      - 'Html_tools/typhoon-satellite-pan-v1.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdesk-weather-runtime-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify post-settle and visibility-idle runtime stack
        run: |
          python - <<'PY'
          from pathlib import Path

          expected = {
              'Html_tools/global-weather-lazy-v1.js': [
                  '20260912-global-weather-lazy-v3.2-raster-visibility-idle',
                  '20260912-typhoon-layer-interaction-v10-post-settle-stagger',
                  '20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle',
                  '20260912-typhoon-zoom-motion-v2.5-visibility-idle',
                  '20260912-typhoon-satellite-pan-v1.4-visibility-idle',
                  'post-settle-staggered-forecast-city-vector',
                  'visibility-idle',
                  'satellite-visibility-idle',
              ],
              'Html_tools/typhoon-weather-layer-interaction-fix-v1.js': [
                  '20260912-typhoon-layer-interaction-v10-post-settle-stagger',
              ],
              'Html_tools/typhoon-dynamic-city-labels-v1.js': [
                  '20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle',
                  'visibilityIdle',
                  'postSettleStagger',
              ],
              'Html_tools/typhoon-zoom-motion-v2-1.js': [
                  '20260912-typhoon-zoom-motion-v2.5-visibility-idle',
                  'visibilityIdle',
                  'postSettleStagger',
              ],
              'Html_tools/typhoon-satellite-pan-v1.js': [
                  '20260912-typhoon-satellite-pan-v1.4-visibility-idle',
                  'visibilityIdle',
              ],
              'index.html': [
                  'Html_tools/global-weather-lazy-v1.js?v=20260912-global-weather-lazy-v3.2-raster-visibility-idle',
              ],
          }

          failures = []
          for path, markers in expected.items():
              text = Path(path).read_text(encoding='utf-8')
              missing = [marker for marker in markers if marker not in text]
              if missing:
                  failures.append(f"{path}: missing {', '.join(missing)}")

          forbidden = {
              'Html_tools/global-weather-lazy-v1.js': [
                  '20260912-global-weather-lazy-v3.0-post-settle-stagger',
                  '20260912-typhoon-dynamic-city-labels-v2.0-post-settle-stagger',
                  '20260912-typhoon-zoom-motion-v2.4-post-settle-stagger',
                  '20260912-typhoon-satellite-pan-v1.3',
              ],
          }
          for path, markers in forbidden.items():
              text = Path(path).read_text(encoding='utf-8')
              present = [marker for marker in markers if marker in text]
              if present:
                  failures.append(f"{path}: stale runtime refs present: {', '.join(present)}")

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Post-settle + visibility-idle runtime stack verified; no legacy rewrite performed.')
          PY
