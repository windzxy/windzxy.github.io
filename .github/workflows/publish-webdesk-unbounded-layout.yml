name: Publish WebDesk unbounded layout
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/webdesk-unbounded-layout-v1.js'
      - '.github/workflows/publish-webdesk-unbounded-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip-webdesk-unbounded-publish]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Inject unbounded layout runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="Html_tools/webdesk-unbounded-layout-v1.js?v=20260913-webdesk-unbounded-layout-v1.2-drag-grow"></script>'
          s=re.sub(r'\n?<script src="Html_tools/webdesk-unbounded-layout-v1\.js[^>]*></script>', '', s)
          if '</body>' not in s:
              raise SystemExit('index.html has no </body> marker')
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify unbounded layout baseline
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js=Path('Html_tools/webdesk-unbounded-layout-v1.js').read_text(encoding='utf-8')
          assert '20260913-webdesk-unbounded-layout-v1.2-drag-grow' in s
          for marker in ['height:auto!important','overflow-y:auto!important','syncHeight','desktop-card','minHeight','growAheadOfPointer','dragGrowUntil','touch-action:none']:
              assert marker in js
      - name: Commit published entry
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish WebDesk drag-grow unbounded layout [skip-webdesk-unbounded-publish]"
          git pull --rebase origin master
          git push origin master