name: Inject WebDesk Class Schedule

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/class-schedule-widget-v1.js'
      - 'Html_tools/class-schedule-theme-v2.js'
      - 'Html_tools/toolbox-categories-v1.js'
      - '.github/workflows/inject-webdesk-class-schedule.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Wire class schedule into WebDesk entry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          schedule='<script src="Html_tools/class-schedule-widget-v1.js?v=20260901-class-schedule-v4-product-agenda"></script>'
          theme='<script src="Html_tools/class-schedule-theme-v2.js?v=20260901-class-schedule-theme-v4-approved-design"></script>'
          s=re.sub(r'\n?<script src="Html_tools/class-schedule-widget-v1\.js\?v=[^"]+"></script>', '', s)
          s=re.sub(r'\n?<script src="Html_tools/class-schedule-theme-v2\.js\?v=[^"]+"></script>', '', s)
          anchor_re=r'(<script src="Html_tools/toolbox-categories-v1\.js\?v=[^"]+"></script>)'
          m=re.search(anchor_re,s)
          if not m: raise SystemExit('toolbox categories anchor not found')
          s=s[:m.start()]+schedule+'\n'+theme+'\n'+s[m.start():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit entry update
        run: |
          if git diff --quiet -- index.html; then echo 'No entry change required.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire approved WebDesk class schedule v4'
          git push origin master
