name: Maydayland Mobile UX Audit Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Keep production entry frozen during audit
        run: |
          echo 'Maydayland automatic mobile-entry mutation is frozen.'
          echo 'Re-enable only after shell/runtime regression audit passes.'
