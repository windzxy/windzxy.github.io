name: Inject Maydayland Mobile UX

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/mobile-ux-v123-1.js'
      - '.github/workflows/inject-maydayland-mobile-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Wire mobile UX into Maydayland
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./mobile-ux-v123-1.js?v=20260901-mobile-ux-v123.2" defer></script>'
          s=re.sub(r'\n?<script src="\./mobile-ux-v123-1\.js\?v=[^"]+" defer></script>','',s)
          anchor='<script src="./songs-v120.js?v=123.0.0" defer></script>'
          if anchor not in s: raise SystemExit('Maydayland songs anchor not found')
          s=s.replace(anchor,anchor+'\n  '+tag,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit entry update
        run: |
          if git diff --quiet -- maydayland/index.html; then echo 'No entry change required'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/index.html
          git commit -m 'Wire Maydayland mobile UX v123.2'
          git push origin master
