name: Ensure Typhoon Overlay Health
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-overlay-health-v1.js'
      - '.github/workflows/ensure-typhoon-overlay-health.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep typhoon overlay health runtime loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/typhoon-overlay-health-v1\.js\?v=[^"]+"></script>','',s)
          tag='<script src="Html_tools/typhoon-overlay-health-v1.js?v=20260911-typhoon-overlay-health-v1.1-overlay-time-source-sync"></script>'
          anchors=[
            r'(<script src="Html_tools/typhoon-weather-health-v1\.js\?v=[^"]+"></script>)',
            r'(<script src="Html_tools/typhoon-openmeteo-broker-v1\.js\?v=[^"]+"></script>)'
          ]
          done=False
          for pattern in anchors:
              ns,n=re.subn(pattern,lambda m:m.group(1)+'\n'+tag,s,count=1)
              if n:
                  s=ns; done=True; break
          if not done:
              marker='</body>'
              if marker not in s: raise SystemExit('no safe typhoon runtime anchor')
              s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit formal entry update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load typhoon overlay time source sync guard'
          git push