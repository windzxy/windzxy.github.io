name: Verify Typhoon Overlay Health Runtime
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-overlay-health-v1.js'
      - 'Html_tools/typhoon-weather-layer-interaction-fix-v1.js'
      - 'Html_tools/global-weather-lazy-v1.js'
      - '.github/workflows/ensure-typhoon-overlay-health.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdesk-weather-runtime-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify overlay health ownership and current forecast runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          expected={
              'Html_tools/typhoon-overlay-health-v1.js':[
                  '20260911-typhoon-overlay-health-v1.2-data-time-coherence',
              ],
              'Html_tools/typhoon-weather-layer-interaction-fix-v1.js':[
                  "const VER='20260912-typhoon-layer-interaction-v10-post-settle-stagger'",
                  'shared-motion-settled-staggered-idle-last-viewport',
              ],
              'Html_tools/global-weather-lazy-v1.js':[
                  "const VERSION='20260913-global-weather-lazy-v3.3-radar-visibility-idle'",
                  "['Html_tools/typhoon-overlay-health-v1.js','20260911-typhoon-overlay-health-v1.2-data-time-coherence']",
                  "['Html_tools/typhoon-weather-layer-interaction-fix-v1.js','20260912-typhoon-layer-interaction-v10-post-settle-stagger']",
                  'overlay-health',
                  'radar-visibility-idle',
              ],
          }
          failures=[]
          for path,markers in expected.items():
              text=Path(path).read_text(encoding='utf-8')
              missing=[m for m in markers if m not in text]
              if missing:
                  failures.append(f"{path}: missing {', '.join(missing)}")

          forbidden={
              'Html_tools/typhoon-weather-layer-interaction-fix-v1.js':[
                  '20260912-typhoon-layer-interaction-v8-mobile-idle-forecast',
              ],
              'Html_tools/global-weather-lazy-v1.js':[
                  '20260912-global-weather-lazy-v3.2-raster-visibility-idle',
              ],
          }
          for path,markers in forbidden.items():
              text=Path(path).read_text(encoding='utf-8')
              present=[m for m in markers if m in text]
              if present:
                  failures.append(f"{path}: stale runtime refs present: {', '.join(present)}")

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Overlay health and forecast runtime ownership verified; legacy rewrite disabled.')
          PY
