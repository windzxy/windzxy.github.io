name: Ensure WebDesk Typhoon Runtime

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'Html_tools/typhoon-widget.js'
      - 'Html_tools/global-weather-brand-v1.js'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'Html_tools/typhoon-window-p0-fix.js'
      - 'Html_tools/typhoon-weather-ui-recovery-v11-1.js'
      - 'Html_tools/typhoon-weather-p0-remount.js'
      - 'Html_tools/typhoon-openmeteo-broker-v1.js'
      - 'Html_tools/typhoon-weather-layer-interaction-fix-v1.js'
      - 'Html_tools/typhoon-dynamic-city-labels-v1.js'
      - 'Html_tools/typhoon-provider-failover-v1.js'
      - 'Html_tools/typhoon-weather-motion-v1.js'
      - 'Html_tools/typhoon-zoom-motion-v2-1.js'
      - 'Html_tools/typhoon-real-weather-v5-1.js'
      - 'Html_tools/mobile-desktop-ux-v1.js'
      - 'Html_tools/typhoon-control-layout-v11.js'
      - '.github/workflows/inject-webdesk-fx.yml'
      - '.github/workflows/ensure-webdesk-typhoon-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webdesk-index-writers
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
      - name: Keep Global Weather branded and off the startup critical path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # The legacy app id remains "typhoon" for saved workspace compatibility,
          # but the visible product name is now Global Weather at first paint.
          s=re.sub(
            r'\{id:"typhoon",kind:"widget",title:"[^"]+",desc:"[^"]+",icon:"[^"]+",tone:"t-typhoon"\}',
            '{id:"typhoon",kind:"widget",title:"全球氣象",desc:"實時雷達、衛星、降水、真實風場、溫濕度、氣壓與熱帶氣旋路徑。",icon:"🌦️",tone:"t-typhoon"}',
            s,
            count=1
          )

          # WebDesk startup must stay light. Only the core card registration,
          # branding and one tiny lazy loader are parsed at boot. Radar, maps,
          # forecast models, particles, city overlays and provider recovery
          # load only after a Global Weather card actually exists.
          tags=[
            '<script src="Html_tools/typhoon-widget.js?v=20260907-typhoon-p0-runtime-order"></script>',
            '<script src="Html_tools/global-weather-brand-v1.js?v=20260910-global-weather-brand-v1.0"></script>',
            '<script src="Html_tools/global-weather-lazy-v1.js?v=20260911-global-weather-lazy-v1.4-smooth-forecast-panzoom"></script>',
          ]
          runtime_files=[
            'typhoon-widget','global-weather-brand-v1','global-weather-lazy-v1','typhoon-window-p0-fix',
            'typhoon-radar-v4-1','typhoon-atmosphere-v5-1','typhoon-openfreemap-v6',
            'typhoon-product-shell-v6','typhoon-weather-runtime-v11','typhoon-weather-ui-recovery-v11-1',
            'typhoon-weather-p0-remount','typhoon-openmeteo-broker-v1','typhoon-weather-layer-interaction-fix-v1',
            'typhoon-wind-city-weather-v1','typhoon-dynamic-city-labels-v1','typhoon-weather-motion-v1',
            'typhoon-zoom-motion-v2','typhoon-zoom-motion-v2-1','typhoon-wind-model-v3',
            'typhoon-real-forecast-v4','typhoon-real-weather-v5','typhoon-real-weather-v5-1','typhoon-real-weather-v5-2',
            'typhoon-render-recovery-v1','typhoon-weather-health-v1','typhoon-overlay-health-v1','typhoon-provider-failover-v1',
            'mobile-desktop-ux-v1','typhoon-control-layout-v10','typhoon-control-layout-v11',
          ]
          for name in runtime_files:
            s=re.sub(r'\s*<script\s+src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"\s*>\s*</script>\s*','\n',s)

          block='\n'.join(tags)+'\n'
          marker='<script src="Html_tools/theme-contrast-fix.js'
          pos=s.find(marker)
          if pos!=-1:
            s=s[:pos]+block+s[pos:]
          else:
            s=s.replace('</body>',block+'</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit runtime tag
        run: |
          if git diff --quiet -- index.html; then
            echo 'WebDesk lazy Global Weather runtime already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rename Typhoon to Global Weather and smooth forecast map'
          git pull --rebase origin master
          git push