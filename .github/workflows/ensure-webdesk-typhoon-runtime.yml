name: Ensure WebDesk Typhoon Runtime

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'Html_tools/typhoon-widget.js'
      - '.github/workflows/inject-webdesk-fx.yml'
      - '.github/workflows/ensure-webdesk-typhoon-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webdesk-index-writers
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure typhoon runtime is loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Keep exactly one typhoon runtime tag. The lean injector previously removed it,
          # leaving the app metadata visible but no body/runtime, which made the card flash then vanish.
          s=re.sub(r'\s*<script\s+src="Html_tools/typhoon-widget\.js\?v=[^"]+"\s*>\s*</script>\s*','\n',s)
          tag='<script src="Html_tools/typhoon-widget.js?v=20260903-typhoon-p0-runtime-persist"></script>'
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit runtime tag
        run: |
          if git diff --quiet -- index.html; then
            echo 'Typhoon runtime already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep WebDesk typhoon runtime loaded'
          git push
