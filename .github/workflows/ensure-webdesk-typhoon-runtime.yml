name: Ensure WebDesk Typhoon Runtime

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'Html_tools/typhoon-widget.js'
      - 'Html_tools/typhoon-window-p0-fix.js'
      - 'Html_tools/typhoon-weather-ui-recovery-v11-1.js'
      - 'Html_tools/typhoon-weather-p0-remount.js'
      - 'Html_tools/typhoon-openmeteo-broker-v1.js'
      - 'Html_tools/typhoon-weather-layer-interaction-fix-v1.js'
      - 'Html_tools/typhoon-dynamic-city-labels-v1.js'
      - 'Html_tools/typhoon-weather-motion-v1.js'
      - 'Html_tools/typhoon-zoom-motion-v2-1.js'
      - 'Html_tools/typhoon-real-weather-v5.js'
      - 'Html_tools/typhoon-real-weather-v5-1.js'
      - 'Html_tools/typhoon-real-weather-v5-2.js'
      - 'Html_tools/mobile-desktop-ux-v1.js'
      - 'Html_tools/typhoon-control-layout-v11.js'
      - '.github/workflows/inject-webdesk-fx.yml'
      - '.github/workflows/ensure-webdesk-typhoon-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webdesk-index-writers
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
      - name: Ensure typhoon runtime and weather recovery are loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Stability-first real-data stack:
          # - radar/satellite keep independent real temporal frames
          # - wind/gust keep real geographic vectors
          # - precipitation/temperature/humidity/pressure use the proven v5.1
          #   independent hourly requests. One failed mode cannot break the others.
          # - do not load the v5.2 continuous interpolator until it is validated
          #   without reducing live weather-data availability.
          tags=[
            '<script src="Html_tools/typhoon-widget.js?v=20260907-typhoon-p0-runtime-order"></script>',
            '<script src="Html_tools/typhoon-window-p0-fix.js?v=20260908-typhoon-window-p0-fix7-tile-viewport-repair"></script>',
            '<script src="Html_tools/typhoon-radar-v4-1.js?v=20260902-typhoon-radar-v4.2-sync"></script>',
            '<script src="Html_tools/typhoon-atmosphere-v5-1.js?v=20260902-typhoon-atmosphere-v5.2-sync"></script>',
            '<script src="Html_tools/typhoon-openfreemap-v6.js?v=20260908-typhoon-openfreemap-v6.4-world-wrap"></script>',
            '<script src="Html_tools/typhoon-product-shell-v6.js?v=20260902-typhoon-product-shell-v6-keyless"></script>',
            '<script src="Html_tools/typhoon-weather-runtime-v11.js?v=20260902-typhoon-weather-v11-consolidated"></script>',
            '<script src="Html_tools/typhoon-weather-ui-recovery-v11-1.js?v=20260907-typhoon-weather-ui-recovery-v11.3-self-heal"></script>',
            '<script src="Html_tools/typhoon-weather-p0-remount.js?v=20260909-typhoon-weather-p0-remount-v9-grouped-controller"></script>',
            '<script src="Html_tools/typhoon-openmeteo-broker-v1.js?v=20260910-typhoon-weather-hub-v2.5-triple-provider"></script>',
            '<script src="Html_tools/typhoon-weather-layer-interaction-fix-v1.js?v=20260910-typhoon-layer-interaction-v6-hub-recovery"></script>',
            '<script src="Html_tools/typhoon-dynamic-city-labels-v1.js?v=20260910-typhoon-dynamic-city-labels-v1.6-shared-hub"></script>',
            '<script src="Html_tools/typhoon-weather-motion-v1.js?v=20260910-typhoon-weather-motion-v1.5-pan-swr"></script>',
            '<script src="Html_tools/typhoon-zoom-motion-v2-1.js?v=20260910-typhoon-zoom-motion-v2.1-real-vectors"></script>',
            '<script src="Html_tools/typhoon-real-weather-v5-1.js?v=20260910-typhoon-real-weather-v5.1-independent-scalars"></script>',
            '<script src="Html_tools/mobile-desktop-ux-v1.js?v=20260910-mobile-desktop-ux-v1.0"></script>',
            '<script src="Html_tools/typhoon-control-layout-v11.js?v=20260910-typhoon-control-layout-v11.0-bottom-dock"></script>',
          ]
          runtime_files=[
            'typhoon-widget',
            'typhoon-window-p0-fix',
            'typhoon-radar-v4-1',
            'typhoon-atmosphere-v5-1',
            'typhoon-openfreemap-v6',
            'typhoon-product-shell-v6',
            'typhoon-weather-runtime-v11',
            'typhoon-weather-ui-recovery-v11-1',
            'typhoon-weather-p0-remount',
            'typhoon-openmeteo-broker-v1',
            'typhoon-weather-layer-interaction-fix-v1',
            'typhoon-wind-city-weather-v1',
            'typhoon-dynamic-city-labels-v1',
            'typhoon-weather-motion-v1',
            'typhoon-zoom-motion-v2',
            'typhoon-zoom-motion-v2-1',
            'typhoon-wind-model-v3',
            'typhoon-real-forecast-v4',
            'typhoon-real-weather-v5',
            'typhoon-real-weather-v5-1',
            'typhoon-real-weather-v5-2',
            'mobile-desktop-ux-v1',
            'typhoon-control-layout-v10',
            'typhoon-control-layout-v11',
          ]
          for name in runtime_files:
            s=re.sub(r'\s*<script\s+src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"\s*>\s*</script>\s*','\n',s)

          block='\n'.join(tags)+'\n'
          marker='<script src="Html_tools/theme-contrast-fix.js'
          pos=s.find(marker)
          if pos!=-1:
            s=s[:pos]+block+s[pos:]
          else:
            s=s.replace('</body>',block+'</body>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit runtime tag
        run: |
          if git diff --quiet -- index.html; then
            echo 'WebDesk runtime already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore WebDesk stable real weather playback'
          git pull --rebase origin master
          git push