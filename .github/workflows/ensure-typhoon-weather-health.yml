name: Verify Typhoon Weather Health Ownership
on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'Html_tools/typhoon-weather-health-v1.js'
      - '.github/workflows/ensure-typhoon-weather-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current weather recovery ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          loader=Path('Html_tools/global-weather-lazy-v1.js').read_text(encoding='utf-8')
          expected=[
              '20260913-global-weather-lazy-v3.3-radar-visibility-idle',
              '20260907-typhoon-weather-ui-recovery-v11.3-self-heal',
              '20260909-typhoon-weather-p0-remount-v9-grouped-controller',
              '20260911-typhoon-weather-hub-v2.6-viewport-cache',
              '20260911-typhoon-overlay-health-v1.2-data-time-coherence',
          ]
          missing=[x for x in expected if x not in loader]
          if missing:
              raise SystemExit('current weather recovery stack missing: '+', '.join(missing))
          if 'Html_tools/typhoon-weather-health-v1.js' in index:
              raise SystemExit('legacy weather health runtime must not be loaded directly by index.html')
          if 'Html_tools/typhoon-weather-health-v1.js' in loader:
              raise SystemExit('legacy weather health runtime must not re-enter the lazy stack')
          if 'global-weather-lazy-v1.js?v=20260913-global-weather-lazy-v3.3-radar-visibility-idle' not in index:
              raise SystemExit('current global weather loader entry missing')
          PY