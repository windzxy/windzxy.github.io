name: Publish Breakfast Card

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/breakfast-card-v1.js'
      - 'Html_tools/breakfast-no-svg-art-v1.js'
      - '.github/workflows/publish-breakfast-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-breakfast-publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load Breakfast card runtimes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          main='<script src="Html_tools/breakfast-card-v1.js?v=20260913-breakfast-card-v2.2-checkin-score-illustrations"></script>'
          art='<script src="Html_tools/breakfast-no-svg-art-v1.js?v=20260913-breakfast-no-svg-art-v1.0"></script>'
          main_pattern=r'<script src="Html_tools/breakfast-card-v1\.js\?v=[^"]+"></script>'
          art_pattern=r'<script src="Html_tools/breakfast-no-svg-art-v1\.js\?v=[^"]+"></script>'
          if re.search(main_pattern,s):
              s=re.sub(main_pattern,main,s,count=1)
          elif main not in s:
              marker='<script src="Html_tools/theme-contrast-fix.js'
              i=s.find(marker)
              if i<0: raise SystemExit('Theme runtime marker not found')
              s=s[:i]+main+'\n'+s[i:]
          if re.search(art_pattern,s):
              s=re.sub(art_pattern,art,s,count=1)
          elif art not in s:
              i=s.find(main)
              if i<0: raise SystemExit('Breakfast runtime marker not found')
              i+=len(main)
              s=s[:i]+'\n'+art+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit publisher result
        run: |
          if git diff --quiet -- index.html; then
            echo "Breakfast runtimes already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Breakfast no-SVG artwork [skip-breakfast-publish]"
          git push
