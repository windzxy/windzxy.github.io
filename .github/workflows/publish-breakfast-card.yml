name: Publish Breakfast Card

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/breakfast-card-v1.js'
      - 'Html_tools/breakfast-no-svg-art-v1.js'
      - 'assets/breakfast/**'
      - '.github/workflows/publish-breakfast-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip-breakfast-publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load Breakfast card runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tags=['<script src="Html_tools/breakfast-card-v1.js?v=20260913-breakfast-card-v2.2-checkin-score-illustrations"></script>','<script src="Html_tools/breakfast-no-svg-art-v1.js?v=20260913-breakfast-manga-raster-v1.7-independent-img"></script>']
          for tag in tags:
            name=tag.split('src="')[1].split('?')[0]; pattern=r'<script src="'+re.escape(name)+r'\?v=[^"]+"></script>'
            if re.search(pattern,s): s=re.sub(pattern,tag,s,count=1)
            elif tag not in s:
              marker='<script src="Html_tools/theme-contrast-fix.js'; i=s.find(marker)
              if i<0: raise SystemExit('Theme runtime marker not found')
              s=s[:i]+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit publisher result
        run: |
          if git diff --quiet -- index.html; then echo "Breakfast runtime already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Breakfast independent artwork runtime [skip-breakfast-publish]"
          git push
