name: Load Flight Chess Toolbox Entry
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/toolbox-categories-v1.js'
      - '.github/workflows/load-toolbox-flight-chess.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Refresh toolbox categories cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'Html_tools/toolbox-categories-v1\.js\?v=[^"\']+', 'Html_tools/toolbox-categories-v1.js?v=20260913-toolbox-categories-v10-flight-chess', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache-bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refresh toolbox categories for Flight Chess'
          git pull --rebase origin master
          git push
