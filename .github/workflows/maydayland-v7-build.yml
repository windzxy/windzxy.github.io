name: Build Maydayland 7.0 Tracker

on:
  push:
    paths:
      - .github/workflows/maydayland-v7-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble tracker experience
        shell: python
        run: |
          import base64, io, shutil, tarfile
          from pathlib import Path

          payload = """[... ELLIPSIZATION ...]"""
          archive = base64.b64decode(payload, validate=True)
          staging = Path('.maydayland-v7')
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir()
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tar:
              tar.extractall(staging)

          target = Path('maydayland')
          target.mkdir(exist_ok=True)
          for name in ('index.html', 'styles.css', 'app.js', 'release.json'):
              shutil.copy2(staging / name, target / name)
          assets_target = target / 'assets' / 'mojo'
          if assets_target.exists():
              shutil.rmtree(assets_target)
          assets_target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(staging / 'assets' / 'mojo', assets_target)
          shutil.rmtree(staging)
          Path('.github/workflows/maydayland-v7-build.yml').unlink()

      - name: Validate and publish
        run: |
          node --check maydayland/app.js
          grep -q 'Maydayland Tracker' maydayland/index.html
          grep -q 'styles.css?v=7.0.0' maydayland/index.html
          grep -q 'app.js?v=7.0.0' maydayland/index.html
          grep -q 'interactive Mayday memory signal map' maydayland/release.json
          test -s maydayland/assets/mojo/orange.png
          test -s maydayland/assets/mojo/peach.png
          test -s maydayland/assets/mojo/banana.png
          test -s maydayland/assets/mojo/apple.png
          test -s maydayland/assets/mojo/watermelon.png
          test -s maydayland/assets/mojo/cherry.png
          if grep -R -E 'Spidey|Spider-Man|spider-man|spideytracker|mojo-data\.js|Solara|giscus' maydayland; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '從零切換 Maydayland 7.0 訊號追蹤器風格'
          git push
