name: Inject Maydayland Production Polish v124

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/production-polish-v124.js'
      - 'maydayland/tour-map-product-v1.js'
      - '.github/workflows/inject-maydayland-production-polish-v124.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Wire stable production polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          polish='<script src="./production-polish-v124.js?v=20260901-maydayland-production-polish-v124.2" defer></script>'
          map_product='<script src="./tour-map-product-v1.js?v=20260905-tour-map-product-v1.7" defer></script>'
          s2=re.sub(r'\n?\s*<script src="\./production-polish-v124\.js\?v=[^"]+" defer></script>','',s)
          s2=re.sub(r'\n?\s*<script src="\./tour-map-product-v1\.js\?v=[^"]+" defer></script>','',s2)
          anchor='<script src="./app-v119.js?v=20260901-repaired-v119.2" defer></script>'
          if anchor not in s2:
              raise SystemExit('repaired v119 anchor missing; refusing unsafe rewrite')
          s2=s2.replace(anchor,anchor+'\n'+polish+'\n'+map_product,1)

          # Productize legacy no-JS / slow-network copy only when those legacy strings still exist.
          s2=s2.replace('SAFE SHELL · 正在載入互動版','正在載入互動體驗')
          s2=s2.replace('MAYDAYLAND · RESILIENT FIRST SCREEN','MAYDAYLAND · TOUR & MUSIC ARCHIVE')
          s2=s2.replace('巡演地圖、城市專題、唱片室、歌曲宇宙、出版與歷程檔案。即使互動腳本暫時失敗，首頁也不再黑屏。','巡演地圖、城市專題、唱片室、歌曲宇宙、出版與歷程檔案。即使網絡暫時不穩定，主要內容仍可繼續瀏覽。')
          s2=s2.replace("f.textContent='互動層未啟動 · 安全模式仍可瀏覽'","f.textContent='互動內容載入中 · 基本內容已可瀏覽'")
          s2=s2.replace("paint('互動層錯誤',src||e.message||'runtime error')","paint('互動內容暫時不可用','基本內容仍可瀏覽')")
          s2=s2.replace("paint('互動層 Promise 錯誤',String(e.reason||'unknown').slice(0,90))","paint('互動內容暫時不可用','基本內容仍可瀏覽')")
          s2=s2.replace("paint('BASE AUDIT · repaired v119 未啟動','已隔離 v120/v123/mobile')","paint('互動內容載入中','基本內容已可瀏覽')")

          # Do not rewrite release/version metadata here. index.html is the release source-of-truth.
          if s2!=s:
              p.write_text(s2,encoding='utf-8')
              print('wired production polish + tour map product v1.7 without downgrading release metadata')
          else:
              print('already wired and normalized')
          PY
      - name: Verify stable core remains intact
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('maydayland/index.html').read_text(encoding='utf-8')
          app='app-v119.js?v=20260901-repaired-v119.2'
          polish='production-polish-v124.js?v=20260901-maydayland-production-polish-v124.2'
          tour='tour-map-product-v1.js?v=20260905-tour-map-product-v1.7'
          assert 'maydayland-static-fallback' in s
          assert app in s and polish in s and tour in s
          assert s.index(app) < s.index(polish) < s.index(tour)
          release=re.search(r'data-maydayland-release="([^"]+)"',s)
          build=re.search(r"version:'([^']+)'",s)
          title=re.search(r'<title>Maydayland · Tour Music Time Archive ([^<]+)</title>',s)
          assert release and build and title
          assert release.group(1)==build.group(1)==title.group(1)
          assert '正在載入互動體驗' in s
          assert 'MAYDAYLAND · TOUR & MUSIC ARCHIVE' in s
          assert 'SAFE SHELL · 正在載入互動版' not in s
          assert 'MAYDAYLAND · RESILIENT FIRST SCREEN' not in s
          assert 'BASE AUDIT · repaired v119 未啟動' not in s
          print('stable shell + runtime + polish + tour-map product order verified for '+release.group(1))
          PY
      - name: Commit entry update
        run: |
          if git diff --quiet -- maydayland/index.html; then
            echo 'No index change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/index.html
          git commit -m 'Wire Maydayland tour map product layer'
          git push