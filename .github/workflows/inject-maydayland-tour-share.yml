name: Inject Maydayland Tour Share

on:
  push:
    branches: [master]
    paths:
      - 'maydayland/tour-share-v1.js'
      - '.github/workflows/inject-maydayland-tour-share.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inject-maydayland-tour-share
  cancel-in-progress: true

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Wire tour share enhancement
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('maydayland/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?\s*<script src="\./tour-share-v1\.js\?v=[^"]+"></script>','',s)
          anchor='<script src="./tour-map-product-v1.js?v=20260903-tour-map-product-v1.6" defer></script>'
          tag='<script src="./tour-share-v1.js?v=20260903-maydayland-tour-share-v1" defer></script>'
          if anchor not in s:
              raise SystemExit('tour map product anchor not found')
          s=s.replace(anchor,anchor+'\n  '+tag,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify tour share wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('maydayland/index.html').read_text(encoding='utf-8')
          needle='./tour-share-v1.js?v=20260903-maydayland-tour-share-v1'
          if s.count(needle)!=1: raise SystemExit('tour share script must be wired exactly once')
          if s.index('tour-map-product-v1.js')>s.index('tour-share-v1.js'): raise SystemExit('tour share must load after tour map product')
          PY
      - name: Commit injected entry update
        run: |
          if git diff --quiet -- maydayland/index.html; then
            echo 'No index change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maydayland/index.html
          git commit -m 'Wire Maydayland tour share action'
          git push
