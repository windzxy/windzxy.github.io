name: Astra Gallery Import

on:
  push:
    branches:
      - master
    paths:
      - "AICG/.staging/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-gallery-import
  cancel-in-progress: false

jobs:
  import-gallery-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Decode, validate, and import batch
        run: python AICG/scripts/import_gallery_batch.py

      - name: Validate gallery JSON
        run: python -m json.tool AICG/data/gallery.json > /dev/null

      - name: Commit imported works
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No gallery changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AICG/assets/generated AICG/data/gallery.json AICG/.staging
          git commit -m "Import Astra Gallery batch"
          git push origin HEAD:master
