name: Verify Typhoon Raster Visibility Runtime

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ensure-typhoon-raster-visibility-v1.yml'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'Html_tools/typhoon-satellite-pan-v1.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raster-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current raster visibility baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader = Path('Html_tools/global-weather-lazy-v1.js').read_text(encoding='utf-8')
          satellite = Path('Html_tools/typhoon-satellite-pan-v1.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          required_loader = [
              "20260913-global-weather-lazy-v3.3-radar-visibility-idle",
              "20260912-typhoon-satellite-pan-v1.4-visibility-idle",
              "20260913-typhoon-radar-v4.6-visibility-idle",
              "20260912-typhoon-layer-interaction-v10-post-settle-stagger",
              "20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle",
              "20260912-typhoon-zoom-motion-v2.5-visibility-idle",
              "20260908-typhoon-openfreemap-v6.4-world-wrap",
              "20260911-typhoon-provider-failover-v1.1-recover-primary",
              "satellite-visibility-idle",
              "radar-visibility-idle",
          ]
          required_satellite = [
              "20260912-typhoon-satellite-pan-v1.4-visibility-idle",
              "keepBuffer:10",
              "updateWhenIdle:true",
              "updateWhenZooming:false",
              "noWrap=false",
              "IntersectionObserver",
              "visibilityIdle:true",
              "eventDrivenMaintenance:true",
          ]
          required_index = [
              "Html_tools/global-weather-lazy-v1.js?v=20260913-global-weather-lazy-v3.3-radar-visibility-idle"
          ]
          forbidden = [
              "20260912-global-weather-lazy-v3.2-raster-visibility-idle",
              "global-weather-lazy-v3.2",
              "typhoon-satellite-pan-v1.3",
          ]

          missing = [x for x in required_loader if x not in loader]
          missing += [x for x in required_satellite if x not in satellite]
          missing += [x for x in required_index if x not in index]
          stale = [x for x in forbidden if x in loader or x in index]

          if missing:
              raise SystemExit('Missing current raster visibility markers: ' + ', '.join(missing))
          if stale:
              raise SystemExit('Stale raster visibility baseline detected: ' + ', '.join(stale))
          print('Typhoon raster visibility runtime is on the current v3.3 / satellite v1.4 baseline.')
          PY
