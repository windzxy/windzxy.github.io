name: Assemble Maydayland 6.0

on:
  push:
    paths:
      - .github/workflows/maydayland-v6-assemble.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble Maydayland
        shell: python
        run: |
          import base64, gzip, shutil
          from pathlib import Path

          root = Path('.maydayland-build')
          specs = {
              'maydayland/index.html': ['html.00', 'html.01'],
              'maydayland/styles.css': ['css.00', 'css.01', 'css.02', 'css.03'],
              'maydayland/app.js': ['js.00', 'js.01', 'js.02', 'js.03', 'js.04'],
          }
          for target, names in specs.items():
              payload = ''.join((root / name).read_text().strip() for name in names)
              data = gzip.decompress(base64.b64decode(payload, validate=True))
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          shutil.rmtree(root)
          for filename in (
              '.github/workflows/maydayland-v6-css.yml',
              '.github/workflows/maydayland-v6-assemble.yml',
          ):
              path = Path(filename)
              if path.exists():
                  path.unlink()
      - name: Validate and publish
        run: |
          node --check maydayland/app.js
          grep -q 'styles.css?v=6.0.0' maydayland/index.html
          grep -q 'app.js?v=6.0.0' maydayland/index.html
          grep -q 'MOJO FAMILY' maydayland/styles.css
          grep -q 'attemptAutoplay' maydayland/app.js
          grep -q 'parseTimedLyrics' maydayland/app.js
          if grep -R -E 'tvbs|sohu|klook|ggpht|Solara|giscus|experience\.css|experience\.js' maydayland; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '從零重建 Maydayland 6.0'
          git push
