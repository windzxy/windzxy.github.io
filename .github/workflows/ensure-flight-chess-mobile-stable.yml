name: Ensure Flight Chess Mobile Stable

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure runtime entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="Html_tools/flight-chess-v6.js?v=20260913-flight-chess-v6.1-mobile-stable"></script>'
          anchor='<script src="Html_tools/flight-chess-experience-v6.js?v=20260913-flight-chess-experience-v6.0"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('Flight Chess v6 anchor missing')
              s=s.replace(anchor,anchor+'\n'+tag)
              p.write_text(s)
          PY
      - name: Publish if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Load stable Flight Chess mobile controls"
          git push
