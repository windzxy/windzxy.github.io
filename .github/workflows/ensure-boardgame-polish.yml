name: Ensure WebDesk Board Game Polish

on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/boardgame-polish-v2.js'
      - 'Html_tools/boardgame-polish-v3-lite.js'
      - '.github/workflows/ensure-boardgame-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webdesk-index-writers
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
      - name: Keep only event-driven board game polish runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for name in ('boardgame-polish-v2','boardgame-polish-v3-lite'):
              s=re.sub(r'\s*<script\s+src="Html_tools/'+re.escape(name)+r'\.js\?v=[^"]+"\s*>\s*</script>\s*','\n',s)
          tag='<script src="Html_tools/boardgame-polish-v3-lite.js?v=20260911-boardgame-polish-v3.0-lite"></script>'
          anchor=re.search(r'<script\s+src="Html_tools/chess-card-v1\.js\?v=[^"]+"\s*>\s*</script>',s)
          if anchor:
              pos=anchor.end(); s=s[:pos]+'\n'+tag+s[pos:]
          else:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit board game runtime tag
        run: |
          if git diff --quiet -- index.html; then
            echo 'Event-driven board game runtime already loaded.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use event-driven WebDesk board game polish'
          git pull --rebase origin master
          git push