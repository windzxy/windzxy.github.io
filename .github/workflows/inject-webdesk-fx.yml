name: Inject WebDesk FX Widget

on:
  push:
    branches:
      - master
    paths:
      - 'Html_tools/fx-widget.js'
      - 'Html_tools/layout-persist-fix.js'
      - '.github/workflows/inject-webdesk-fx.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject or update FX, layout and metals scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          layout_tag = '<script src="Html_tools/layout-persist-fix.js?v=20260819-layout-persist5-plugin-refresh-fix"></script>'
          fx_tag = '<script src="Html_tools/fx-widget.js?v=20260819-fx-widget6-custom-dropdown"></script>'
          metals_fallback = '<script src="Html_tools/metals-widget.js?v=20260819-gold-widget29-portrait-chart"></script>'

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          stubs = [
              '{id:"metals",kind:"widget",title:"金價",desc:"貴金屬行情與 TradingView 圖表。",icon:"Au",tone:"t-metals"}',
              '{id:"fx-rates",kind:"widget",title:"匯率",desc:"中國銀行外匯牌價與互換式換算。",icon:"FX",tone:"t-fx"}',
          ]
          if 'id:"metals"' not in html or 'id:"fx-rates"' not in html:
              marker = '  {id:"weather",kind:"widget",title:"天氣",desc:"隨窗口大小自動顯示更多天氣。",icon:"☁",tone:"t-weather"}'
              insert = ''
              if 'id:"metals"' not in html:
                  insert += '  ' + stubs[0] + ',\n'
              if 'id:"fx-rates"' not in html:
                  insert += '  ' + stubs[1] + ',\n'
              html = html.replace(marker, insert + marker, 1)

          metals_match = re.search(r'<script\s+src="Html_tools/metals-widget\.js\?v=[^"]+"\s*>\s*</script>', html)
          metals_tag = metals_match.group(0) if metals_match else metals_fallback

          for pattern in [
              r'<script\s+src="Html_tools/layout-persist-fix\.js\?v=[^"]+"\s*>\s*</script>\s*',
              r'<script\s+src="Html_tools/fx-widget\.js\?v=[^"]+"\s*>\s*</script>\s*',
              r'<script\s+src="Html_tools/metals-widget\.js\?v=[^"]+"\s*>\s*</script>\s*',
          ]:
              html = re.sub(pattern, '', html)

          bundle = layout_tag + '\n' + metals_tag + '\n' + fx_tag + '\n'
          html = html.replace('</body>', bundle + '</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit FX widget script tags
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already has current FX/layout scripts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject WebDesk finance widget layout fix"
          git push