name: Test Study Lessons

on:
  push:
    branches: [master]
    paths:
      - test/Study/**
      - tools/update-study-open-resources.py
      - tools/generate-study-cantonese-audio.py
      - tools/generate-study-east-asian-audio.py
      - .github/workflows/test-study-lessons.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax
        run: |
          for file in \
            bootstrap-v6.js learning-v6.js guided-v9-core.js guided-v9-session.js guided-v9-ui.js \
            content-packs-v10.js content-hub-v10.js \
            named-curriculum-v11-languages.js named-curriculum-v11-eastasia.js \
            named-curriculum-v11-sciences.js named-curriculum-v11-humanities.js \
            named-curriculum-v11-applied.js named-curriculum-v11-normalize.js \
            named-curriculum-v13-humanities-learning.js named-curriculum-v11.js \
            detailed-v12-base.js detailed-v12-chinese.js detailed-v12-math.js detailed-v12-languages.js \
            detailed-v12-sciences.js detailed-v12-humanities.js detailed-v12-applied.js \
            detailed-v13-humanities-learning.js detailed-v12-quality.js detailed-v12-ui.js \
            audio-v7.js east-asian-audio-v8.js east-asian-lessons-v8.js more-courses-v8.js
          do
            node --check "test/Study/assets/$file"
          done
          python -m py_compile tools/update-study-open-resources.py
          python -m py_compile tools/generate-study-cantonese-audio.py
          python -m py_compile tools/generate-study-east-asian-audio.py

      - name: Validate every named course
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{},console};
          vm.createContext(context);
          const run=file=>vm.runInContext(fs.readFileSync(`test/Study/assets/${file}`,'utf8'),context,{filename:file});
          run('content-packs-v10.js');
          for(const file of [
            'named-curriculum-v11-languages.js','named-curriculum-v11-eastasia.js',
            'named-curriculum-v11-sciences.js','named-curriculum-v11-humanities.js',
            'named-curriculum-v11-applied.js','named-curriculum-v11-normalize.js',
            'named-curriculum-v13-humanities-learning.js',
            'detailed-v12-base.js','detailed-v12-chinese.js','detailed-v12-math.js',
            'detailed-v12-languages.js','detailed-v12-sciences.js',
            'detailed-v12-humanities.js','detailed-v12-applied.js',
            'detailed-v13-humanities-learning.js','detailed-v12-quality.js'
          ]) run(file);
          const packs=context.window.WIND_CONTENT_PACKS_V10;
          const named=context.window.WIND_NAMED_SYLLABI_V11;
          const api=context.window.WIND_DETAILED_CURRICULUM_V12;
          const subjects=Object.keys(packs.subjects);
          const stages=Object.keys(packs.stages);
          if(subjects.length!==15||stages.length!==5) throw new Error('subject or stage coverage');
          if(Object.keys(api.registry).length!==15) throw new Error('builder coverage');
          const errors=[],fingerprints=new Set();
          let total=0;
          for(const subject of subjects){
            for(const stage of stages){
              const titles=named[subject]?.[stage];
              if(!Array.isArray(titles)||titles.length<8){errors.push(`${subject}/${stage}: too few titles`);continue}
              if(new Set(titles).size!==titles.length)errors.push(`${subject}/${stage}: duplicate titles`);
              titles.forEach((title,index)=>{
                const lesson=api.build(subject,stage,title,index);
                const check=api.validate(lesson);
                if(!check.ok)errors.push(`${subject}/${stage}/${title}: ${check.errors.join(',')}`);
                if(lesson.title!==title)errors.push(`${subject}/${stage}/${title}: title mismatch`);
                if(lesson.material.length<120)errors.push(`${subject}/${stage}/${title}: material too short`);
                if(lesson.explanation.length<3||lesson.explanation.some(x=>String(x.body||'').length<55))errors.push(`${subject}/${stage}/${title}: explanation incomplete`);
                if(lesson.workedExamples.length<2||lesson.workedExamples.some(x=>String(x.body||'').length<95))errors.push(`${subject}/${stage}/${title}: examples incomplete`);
                if(lesson.keyPoints.length<4||lesson.examPoints.length<3||lesson.mistakes.length<3)errors.push(`${subject}/${stage}/${title}: study lists incomplete`);
                if(lesson.practice.length<4||lesson.practice.some(x=>String(x.q||'').length<18||String(x.a||'').length<38))errors.push(`${subject}/${stage}/${title}: exercises incomplete`);
                if(fingerprints.has(lesson.fingerprint))errors.push(`${subject}/${stage}/${title}: duplicate content fingerprint`);
                fingerprints.add(lesson.fingerprint);
                total++;
              });
            }
          }
          if(total<900)errors.push(`total detailed lessons ${total}`);
          const sample=(subject,needle,expected)=>{
            for(const [stage,titles] of Object.entries(named[subject])){
              const index=titles.findIndex(title=>title.includes(needle));
              if(index>=0){
                const lesson=api.build(subject,stage,titles[index],index);
                const full=JSON.stringify(lesson);
                if(!full.includes(expected))errors.push(`${subject}/${needle}: missing ${expected}`);
                return;
              }
            }
            errors.push(`${subject}/${needle}: sample title missing`);
          };
          sample('chinese','春晓','春眠不觉晓');
          sample('chinese','雨夜车站','装着药和地址的纸袋');
          sample('chinese','一封迟到的信','窗外传来锯树声');
          sample('math','20 以内进位加法','8＋7');
          sample('english','At the Supermarket','How much');
          sample('cantonese','茶餐厅点餐','菠萝油');
          sample('japanese','いくらですか','三百円');
          sample('korean','餐厅点餐','아메리카노');
          sample('science','控制变量','种子');
          sample('physics','欧姆定律','12Ω');
          sample('chemistry','酸、碱、盐','pH');
          sample('biology','孟德尔遗传','Aa×Aa');
          sample('history','秦统一','公元前221');
          sample('history','长安西市','波斯商人');
          sample('geography','比例尺','1:20000');
          sample('geography','一滴水的旅程','雪山冰川');
          sample('computing','Python 变量','input');
          sample('finance','月度预算','3000');
          sample('logic','相关不等于因果','咖啡');
          sample('logic','谁动了班费','转账记录');
          if(errors.length){console.error(errors.slice(0,100).join('\n'));throw new Error(`${errors.length} validation errors`)}
          console.log(`Validated ${total} fully detailed named courses across ${subjects.length} subjects and ${stages.length} stages.`);
          NODE
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('test/Study/assets/open-resources-v10.json').read_text(encoding='utf-8'))
          assert len(data['items']) >= 20
          assert any(x['source']=='中华人民共和国教育部' for x in data['items'])
          assert any(x['source']=='MIT OpenCourseWare' for x in data['items'])
          PY

      - name: Check audio
        run: |
          if [ -d test/Study/assets/audio/cantonese/tea-restaurant ]; then
            test "$(find test/Study/assets/audio/cantonese/tea-restaurant -name '*.mp3' -size +2k | wc -l)" -eq 5
            python -m json.tool test/Study/assets/audio/cantonese/tea-restaurant/manifest.json >/dev/null
          fi
          if [ -d test/Study/assets/audio/east-asian ]; then
            test "$(find test/Study/assets/audio/east-asian -name '*.mp3' -size +2k | wc -l)" -eq 40
            python -m json.tool test/Study/assets/audio/east-asian/manifest.json >/dev/null
          fi

      - name: Browser render all subjects
        run: |
          python3 -m http.server 8765 --directory . >/tmp/study-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          mkdir -p /tmp/study-v13
          render(){
            page="$1"; output="$2"; expected="$3"
            echo "Rendering: $page"
            timeout 90s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=45000 --dump-dom "http://127.0.0.1:8765/test/Study/${page}" >"$output"
            for marker in 'v12-course-map' '全部课程正文已接入' "$expected"; do
              if ! grep -Fq "$marker" "$output"; then
                echo "Missing marker '$marker' in $page"
                grep -oE 'v12-course-map|全部课程正文已接入|课程地图|第 [0-9]+ 课|<h[1-4][^>]*>[^<]+' "$output" | tail -n 80 || true
                exit 1
              fi
            done
            if grep -Fq '页面加载失败' "$output"; then
              echo "Page load failure in $page"
              exit 1
            fi
            echo "PASS: $page"
          }
          render 'chinese.html?stage=primary' /tmp/study-v13/chinese.html '《春晓》：声音、花落与惜春'
          render 'chinese.html?stage=advanced' /tmp/study-v13/chinese-advanced.html '原创短剧《一封迟到的信》'
          render 'math.html?stage=primary' /tmp/study-v13/math.html '20 以内进位加法：凑十法'
          render 'english.html?stage=primary' /tmp/study-v13/english.html 'Unit 6 At the Supermarket'
          render 'cantonese.html?stage=primary' /tmp/study-v13/cantonese.html '茶餐厅点餐'
          render 'japanese.html?stage=primary' /tmp/study-v13/japanese.html 'いくらですか'
          render 'korean.html?stage=primary' /tmp/study-v13/korean.html '餐厅点餐'
          render 'course.html?subject=science&stage=primary' /tmp/study-v13/science.html '控制变量：光照会影响种子发芽吗'
          render 'course.html?subject=physics&stage=junior' /tmp/study-v13/physics.html '欧姆定律 U=IR'
          render 'course.html?subject=chemistry&stage=junior' /tmp/study-v13/chemistry.html '酸、碱、盐与指示剂'
          render 'course.html?subject=biology&stage=junior' /tmp/study-v13/biology.html '孟德尔遗传与概率'
          render 'course.html?subject=history&stage=primary' /tmp/study-v13/history.html '秦统一与中央集权'
          render 'course.html?subject=history&stage=advanced' /tmp/study-v13/history-advanced.html '历史短剧《长安西市的一天》'
          render 'course.html?subject=geography&stage=primary' /tmp/study-v13/geography.html '地图上的方向、图例和比例尺'
          render 'course.html?subject=geography&stage=advanced' /tmp/study-v13/geography-advanced.html '一滴水的旅程'
          render 'course.html?subject=computing&stage=junior' /tmp/study-v13/computing.html 'Python 变量、输入和输出'
          render 'course.html?subject=finance&stage=primary' /tmp/study-v13/finance.html '制作个人月度预算'
          render 'course.html?subject=logic&stage=primary' /tmp/study-v13/logic.html '相关不等于因果'
          render 'course.html?subject=logic&stage=advanced' /tmp/study-v13/logic-advanced.html '短剧《谁动了班费》'
