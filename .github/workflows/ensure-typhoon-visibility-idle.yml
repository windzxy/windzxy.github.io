name: Verify Typhoon Visibility Idle Runtime

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ensure-typhoon-visibility-idle.yml'
      - 'Html_tools/typhoon-dynamic-city-labels-v1.js'
      - 'Html_tools/typhoon-zoom-motion-v2-1.js'
      - 'Html_tools/typhoon-satellite-pan-v1.js'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdesk-typhoon-runtime-verifiers
  cancel-in-progress: true

jobs:
  verify-visibility-idle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify current hidden/offscreen idle baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          city = Path('Html_tools/typhoon-dynamic-city-labels-v1.js').read_text(encoding='utf-8')
          vector = Path('Html_tools/typhoon-zoom-motion-v2-1.js').read_text(encoding='utf-8')
          satellite = Path('Html_tools/typhoon-satellite-pan-v1.js').read_text(encoding='utf-8')
          loader = Path('Html_tools/global-weather-lazy-v1.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          required = [
              ('city labels v2.1', '20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle' in city),
              ('city visibility idle marker', 'visibilityIdle:true' in city),
              ('city hidden-page guard', 'document.hidden' in city and 'visibilitychange' in city),
              ('vector v2.5', '20260912-typhoon-zoom-motion-v2.5-visibility-idle' in vector),
              ('vector visibility idle marker', 'visibilityIdle:true' in vector),
              ('vector hidden-page guard', 'document.hidden' in vector and 'visibilitychange' in vector),
              ('satellite v1.4', '20260912-typhoon-satellite-pan-v1.4-visibility-idle' in satellite),
              ('loader v3.3', '20260913-global-weather-lazy-v3.3-radar-visibility-idle' in loader),
              ('loader city v2.1', "['Html_tools/typhoon-dynamic-city-labels-v1.js','20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle']" in loader),
              ('loader vector v2.5', "['Html_tools/typhoon-zoom-motion-v2-1.js','20260912-typhoon-zoom-motion-v2.5-visibility-idle']" in loader),
              ('loader satellite v1.4', "['Html_tools/typhoon-satellite-pan-v1.js','20260912-typhoon-satellite-pan-v1.4-visibility-idle']" in loader),
              ('loader visibility scheduling guard', 'if(document.hidden||loading||loaded' in loader),
              ('index current weather loader', 'Html_tools/global-weather-lazy-v1.js?v=20260913-global-weather-lazy-v3.3-radar-visibility-idle' in index),
          ]
          missing = [name for name, ok in required if not ok]
          if missing:
              raise SystemExit('Current visibility-idle baseline missing: ' + ', '.join(missing))

          stale = [
              marker for marker in (
                  '20260912-global-weather-lazy-v3.2-raster-visibility-idle',
                  '20260912-typhoon-radar-v4.5-shared-motion-coordinator',
              ) if marker in (city + '\n' + vector + '\n' + satellite + '\n' + loader + '\n' + index)
          ]
          if stale:
              raise SystemExit('Stale weather runtime reference found: ' + ', '.join(stale))

          for direct in (
              'Html_tools/typhoon-dynamic-city-labels-v1.js?',
              'Html_tools/typhoon-zoom-motion-v2-1.js?',
              'Html_tools/typhoon-satellite-pan-v1.js?',
          ):
              if direct in index:
                  raise SystemExit('Weather overlays must stay owned by the Global Weather lazy loader: ' + direct)

          print('Visibility-idle city/vector/satellite runtime and Global Weather v3.3 ownership verified.')
          PY
