name: Ensure Xiangqi Visible

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'Html_tools/xiangqi-card-v1.js'
      - 'Html_tools/xiangqi-card-loader-v1.js'
      - 'Html_tools/ensure-xiangqi-visible-v1.js'
      - '.github/workflows/ensure-xiangqi-visible.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Xiangqi startup registration
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="Html_tools/xiangqi-card-v1.js?v=20260910-xiangqi-v1.0-learn-play"></script>',
            '<script src="Html_tools/ensure-xiangqi-visible-v1.js?v=20260911-xiangqi-visible-v1.0"></script>'
          ]
          for needle in ['Html_tools/xiangqi-card-v1.js','Html_tools/ensure-xiangqi-visible-v1.js']:
            import re
            s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*'+re.escape(needle)+r'[^"\']*["\'][^>]*></script>','',s)
          anchor='<script src="Html_tools/chess-card-v1.js?v=20260910-chess-v1.0-product"></script>'
          block='\n'.join(tags)
          if anchor in s:
            s=s.replace(anchor,anchor+'\n'+block,1)
          else:
            s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep Chinese Xiangqi visible in WebDesk"
          git push
