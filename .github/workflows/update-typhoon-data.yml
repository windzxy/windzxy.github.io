name: Update HKO Typhoon Data

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-typhoon-data.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hko-typhoon-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and normalize HKO tropical cyclone track
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlsplit, urlunsplit, parse_qsl, urlencode
          import json, re, sys, time, urllib.request, xml.etree.ElementTree as ET

          SOURCE = 'https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml'
          OUT = Path('data/typhoon.json')
          OUT.parent.mkdir(parents=True, exist_ok=True)

          def fresh_url(url):
              parts = urlsplit(url)
              q = dict(parse_qsl(parts.query, keep_blank_values=True))
              q['_windzxy_ts'] = str(int(time.time()))
              return urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(q), parts.fragment))

          def fetch(url):
              req = urllib.request.Request(
                  fresh_url(url),
                  headers={
                      'User-Agent': 'windzxy-webdesk/3.0',
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                      'Accept': 'application/xml,text/xml,*/*;q=0.8'
                  }
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  return r.read().decode('utf-8', 'ignore')

          def local_name(tag):
              return str(tag).split('}', 1)[-1].lower()

          def text(el):
              return ''.join(el.itertext()).strip() if el is not None else ''

          def direct_text(el):
              return ''.join(el.itertext()).strip() if el is not None and len(list(el)) == 0 else ''

          def num(value):
              m = re.search(r'-?\d+(?:\.\d+)?', str(value or ''))
              return float(m.group(0)) if m else None

          def child_text(el, names):
              if el is None:
                  return ''
              names = [n.lower() for n in names]
              for k, v in el.attrib.items():
                  lk = local_name(k)
                  if any(n == lk or n in lk for n in names):
                      return str(v).strip()
              for c in list(el):
                  lc = local_name(c.tag)
                  if any(n == lc or n in lc for n in names):
                      val = text(c)
                      if val:
                          return val
              return ''

          def point_from(el):
              lat = num(child_text(el, ['lat','latitude','緯度','纬度']))
              lon = num(child_text(el, ['lon','lng','longitude','經度','经度']))
              if lat is None or lon is None:
                  return None
              return {
                  'lat': lat,
                  'lon': lon,
                  'time': child_text(el, ['time','datetime','obsTime','forecastTime','validtime','date']),
                  'wind': child_text(el, ['wind','maxwind','windspeed','windSpeed']),
                  'pressure': child_text(el, ['pressure','centralPressure','minimumPressure','pres']),
                  'movement': child_text(el, ['movement','move','direction','speed']),
                  'intensity': child_text(el, ['intensity','class','type','category']),
                  'kind': local_name(el.tag).replace('information', '') or 'point'
              }

          def valid_name(value):
              value = str(value or '').strip()
              if not value:
                  return ''
              low = value.lower()
              if re.search(r'\.(?:xml|xsd|dtd)(?:\?|$)', low):
                  return ''
              if low.startswith(('http://','https://')):
                  return ''
              if re.search(r'(?:tc[_-]?track|schema)', low):
                  return ''
              return value

          def name_from(el):
              if el is None:
                  return ''
              for names in [
                  ['tcname','tropicalcyclonename','cyclonename','stormname'],
                  ['cname','ename','chiName','engName'],
                  ['name']
              ]:
                  val = valid_name(child_text(el, names))
                  if val:
                      return val
              return ''

          def parse_xml(xml_text, source_url):
              try:
                  root = ET.fromstring(xml_text.encode('utf-8'))
              except Exception:
                  return [], []
              parent = {c: p for p in root.iter() for c in list(p)}
              links = []
              for el in root.iter():
                  val = direct_text(el)
                  if re.search(r'\.xml(?:\?|$)', val, re.I):
                      if not re.match(r'https?://', val):
                          val = urljoin(source_url, val)
                      val = val.replace('http://www.weather.gov.hk/', 'https://www.weather.gov.hk/')
                      links.append(val)
              links = list(dict.fromkeys(links))[:12]
              bulletin_time = child_text(root.find('.//BulletinHeader'), ['BulletinTime']) or child_text(root, ['BulletinTime'])
              groups = {}
              for el in root.iter():
                  p = point_from(el)
                  if not p:
                      continue
                  holder = el
                  cur = el
                  while cur in parent:
                      cur = parent[cur]
                      lname = local_name(cur.tag)
                      if re.search(r'(cyclone|typhoon|storm|tropical|^tc$)', lname):
                          holder = cur
                          break
                  sid = child_text(holder, ['tcid','id','identifier','stormid']) or child_text(parent.get(el), ['tcid','id','identifier','stormid']) or 'TC'
                  name = name_from(holder) or name_from(parent.get(el)) or name_from(root)
                  if not name:
                      name = f'Tropical Cyclone {sid}' if sid != 'TC' else 'Tropical Cyclone'
                  key = f'{sid}-{name}'
                  group = groups.setdefault(key, {'id': sid, 'name': name, 'sourceUrl': source_url, 'bulletinTime': bulletin_time, 'points': []})
                  group['points'].append(p)
              storms = []
              for s in groups.values():
                  seen = set(); pts = []
                  for p in s['points']:
                      key = (round(p['lat'], 3), round(p['lon'], 3), p.get('time',''))
                      if key in seen:
                          continue
                      seen.add(key)
                      pts.append({k: v for k, v in p.items() if v not in ('', None)})
                  if pts:
                      s['points'] = pts
                      storms.append(s)
              storms.sort(key=lambda s: str(s.get('id','')))
              return storms, links

          def stamp(value):
              if not value:
                  return float('-inf')
              try:
                  return datetime.fromisoformat(str(value).replace('Z','+00:00')).timestamp()
              except Exception:
                  return float('-inf')

          def freshness(storm):
              times = [stamp(storm.get('bulletinTime'))]
              for p in storm.get('points', []):
                  if p.get('kind') in ('analysis','current','analyse','analyzed','analysed'):
                      times.append(stamp(p.get('time')))
              return max(times or [float('-inf')])

          errors = []
          storms = []
          try:
              raw = fetch(SOURCE)
              root_storms, links = parse_xml(raw, SOURCE)
              storms.extend(root_storms)
              # Always fetch every per-cyclone XML link. This prevents an older summary
              # entry in tc_list.xml from masking a newer hko_tctrack_*.xml bulletin.
              for link in links:
                  try:
                      extra = fetch(link)
                      more, _ = parse_xml(extra, link)
                      storms.extend(more)
                  except Exception as e:
                      errors.append(f'{link}: {e}')
          except Exception as e:
              errors.append(str(e))

          # Deduplicate by TC id/name and always keep the freshest bulletin/analysis.
          best = {}
          for storm in storms:
              key = str(storm.get('id') or '') + '|' + str(storm.get('name') or '')
              if key not in best or freshness(storm) > freshness(best[key]) or (
                  freshness(storm) == freshness(best[key]) and len(storm.get('points', [])) > len(best[key].get('points', []))
              ):
                  best[key] = storm
          storms = sorted(best.values(), key=lambda s: str(s.get('id','')))

          source_updated = None
          dated = [(freshness(s), s.get('bulletinTime')) for s in storms if s.get('bulletinTime')]
          if dated:
              source_updated = max(dated, key=lambda x: x[0])[1]

          core = {
              'type': 'hko-typhoon-track',
              'version': 4,
              'source': SOURCE,
              'status': 'active' if storms else 'no-active-system',
              'storms': storms,
              'errors': errors[:5],
              'ok': not errors,
              'sourceUpdatedAt': source_updated
          }

          old = {}
          if OUT.exists():
              try:
                  old = json.loads(OUT.read_text(encoding='utf-8'))
              except Exception:
                  old = {}

          # If HKO has a temporary fetch problem, do not replace a good active track
          # with an empty/stale error snapshot.
          if not storms and errors and old.get('storms'):
              print('HKO fetch failed; keeping last good snapshot:', errors[:2])
              sys.exit(0)

          old_core = {k: old.get(k) for k in core}
          if old_core == core:
              print('HKO track content unchanged; no commit required.')
              sys.exit(0)

          payload = {
              **core,
              'updatedAt': datetime.now(timezone.utc).isoformat(),
          }
          OUT.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Normalized {len(storms)} active system(s); HKO bulletin={source_updated}.')
          PY

      - name: Commit snapshot
        run: |
          if git diff --quiet -- data/typhoon.json; then
            echo "Typhoon data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/typhoon.json
          git commit -m "Update HKO typhoon data snapshot"
          git pull --rebase origin master
          git push
