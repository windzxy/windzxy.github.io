name: Maydayland 6.0 css

on:
  push:
    paths:
      - .github/workflows/maydayland-v6-css.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write maydayland/styles.css
        shell: python
        run: |
          import base64, gzip
          from pathlib import Path
          payload = ""
          target = Path("maydayland/styles.css")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          Path(".github/workflows/maydayland-v6-css.yml").unlink()
      - name: Validate and commit
        run: |
          grep -q "MOJO FAMILY" maydayland/styles.css || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maydayland/styles.css .github/workflows/maydayland-v6-css.yml
          git commit -m "重建 Maydayland 6.0 樣式"
          git push
