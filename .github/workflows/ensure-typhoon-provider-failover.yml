name: Ensure Typhoon Provider Failover
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-provider-failover-v1.js'
      - 'Html_tools/global-weather-lazy-v1.js'
      - '.github/workflows/ensure-typhoon-provider-failover.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify provider failover stays in lazy Global Weather runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          lazy=Path('Html_tools/global-weather-lazy-v1.js').read_text(encoding='utf-8')
          needle="['Html_tools/typhoon-provider-failover-v1.js'"
          if needle not in lazy:
              raise SystemExit('typhoon provider failover is missing from lazy Global Weather runtime')
          index=Path('index.html').read_text(encoding='utf-8')
          direct='<script src="Html_tools/typhoon-provider-failover-v1.js?'
          if direct in index:
              raise SystemExit('provider failover must remain lazy-loaded, not startup-loaded')
          print('Provider failover is present in lazy runtime and absent from startup path.')
          PY