name: Ensure Typhoon Provider Failover
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/typhoon-provider-failover-v1.js'
      - '.github/workflows/ensure-typhoon-provider-failover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Keep provider failover runtime loaded
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/typhoon-provider-failover-v1\.js\?v=[^"]+"></script>','',s)
          tag='<script src="Html_tools/typhoon-provider-failover-v1.js?v=20260911-typhoon-provider-failover-v1.1-recover-primary"></script>'
          if '</body>' not in s:
              raise SystemExit('body close missing')
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit formal entry update
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load typhoon provider recovery guard'
          git push