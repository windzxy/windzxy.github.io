name: 修正 Maydayland 歌源代碼

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/maydayland-source-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 修正 QQ 音樂來源代碼
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('maydayland/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('option value="qq">QQ 音樂', 'option value="tencent">QQ 音樂')
          text = text.replace("qq:'QQ 音樂'", "tencent:'QQ 音樂'")
          path.write_text(text, encoding='utf-8')
          PY
      - name: 提交修正
        run: |
          if git diff --quiet -- maydayland/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maydayland/index.html
          git commit -m "修正 Maydayland QQ 音樂歌源"
          git push
