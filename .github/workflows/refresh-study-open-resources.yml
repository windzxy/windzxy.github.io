name: Refresh Study Open Resources

on:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - tools/update-study-open-resources.py
      - .github/workflows/refresh-study-open-resources.yml

permissions:
  contents: write

concurrency:
  group: refresh-study-open-resources
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update-study-open-resources.py
      - run: |
          python -m json.tool test/Study/assets/open-resources-v10.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("test/Study/assets/open-resources-v10.json").read_text(encoding="utf-8"))
          assert len(data["items"]) >= 20
          assert data["manualCount"] >= 20
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/Study/assets/open-resources-v10.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Study open resource catalog"
          git pull --rebase origin master
          git push
