name: Load Flight Chess Visual V4
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/flight-chess-visual-v4.js'
      - '.github/workflows/load-flight-chess-visual-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Inject visual runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/flight-chess-visual-v4\.js\?v=[^"]+"></script>','',s)
          tag='\n<script src="Html_tools/flight-chess-visual-v4.js?v=20260913-flight-chess-visual-v4.0-premium"></script>\n'
          s=s.replace('</body>',tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load premium Flight Chess visual layer'
          git push
