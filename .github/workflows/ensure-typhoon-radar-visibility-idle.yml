name: Verify Typhoon Radar Visibility Idle Runtime

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ensure-typhoon-radar-visibility-idle.yml'
      - 'Html_tools/typhoon-radar-v4-1.js'
      - 'Html_tools/global-weather-lazy-v1.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdesk-typhoon-runtime-verifiers
  cancel-in-progress: true

jobs:
  verify-radar-visibility-idle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Verify current Radar visibility-idle baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          radar = Path('Html_tools/typhoon-radar-v4-1.js').read_text(encoding='utf-8')
          loader = Path('Html_tools/global-weather-lazy-v1.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          required = [
              ('radar v4.6', "20260913-typhoon-radar-v4.6-visibility-idle" in radar),
              ('radar visibility idle', 'visibilityIdle:true' in radar),
              ('radar offscreen pause', 'offscreenPlaybackPause:true' in radar),
              ('radar shared motion coordinator', 'sharedMotionCoordinator:true' in radar),
              ('radar generation guard', 'generationGuard:true' in radar),
              ('radar hidden-page guard', '!document.hidden' in radar and "visibilitychange" in radar),
              ('radar intersection observer', 'IntersectionObserver' in radar),
              ('loader v3.3', "20260913-global-weather-lazy-v3.3-radar-visibility-idle" in loader),
              ('loader Radar v4.6', "['Html_tools/typhoon-radar-v4-1.js','20260913-typhoon-radar-v4.6-visibility-idle']" in loader),
              ('loader Satellite v1.4', "20260912-typhoon-satellite-pan-v1.4-visibility-idle" in loader),
              ('loader layer interaction v10', "20260912-typhoon-layer-interaction-v10-post-settle-stagger" in loader),
              ('loader city labels v2.1', "20260912-typhoon-dynamic-city-labels-v2.1-visibility-idle" in loader),
              ('loader vector v2.5', "20260912-typhoon-zoom-motion-v2.5-visibility-idle" in loader),
              ('loader provider failover v1.1', "20260911-typhoon-provider-failover-v1.1-recover-primary" in loader),
              ('loader world wrap v6.4', "20260908-typhoon-openfreemap-v6.4-world-wrap" in loader),
              ('index current weather loader', "Html_tools/global-weather-lazy-v1.js?v=20260913-global-weather-lazy-v3.3-radar-visibility-idle" in index),
          ]
          missing = [name for name, ok in required if not ok]
          if missing:
              raise SystemExit('Current Radar visibility-idle baseline missing: ' + ', '.join(missing))

          forbidden = [
              ('Radar v4.5 runtime reference', '20260912-typhoon-radar-v4.5-shared-motion-coordinator'),
              ('Global Weather v3.2 reference', '20260912-global-weather-lazy-v3.2-raster-visibility-idle'),
          ]
          haystack = radar + '\n' + loader + '\n' + index
          stale = [name for name, marker in forbidden if marker in haystack]
          if stale:
              raise SystemExit('Stale weather runtime reference found: ' + ', '.join(stale))

          direct = 'Html_tools/typhoon-radar-v4-1.js?' in index
          if direct:
              raise SystemExit('Radar must stay owned by the Global Weather lazy loader, not direct-loaded by index.html')

          print('Radar v4.6 visibility-idle runtime and Global Weather v3.3 ownership verified.')
          PY
