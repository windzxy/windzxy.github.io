name: Publish Global Weather Human UI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-global-weather-human-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Publish current Global Weather loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=[
            'Html_tools/global-weather-lazy-v1.js?v=20260912-global-weather-lazy-v2.9-shared-vector-motion',
            'Html_tools/global-weather-lazy-v1.js?v=20260913-global-weather-lazy-v3.3-radar-visibility-idle'
          ]
          new='Html_tools/global-weather-lazy-v1.js?v=20260913-global-weather-lazy-v3.4-human-ui'
          for marker in old:
            s=s.replace(marker,new)
          if new not in s:
            raise SystemExit('Global Weather loader script tag not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit formal entry update
        run: |
          if git diff --quiet -- index.html; then
            echo "Global Weather human UI loader already published"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish redesigned Global Weather controls [skip-human-ui]"
          git push
