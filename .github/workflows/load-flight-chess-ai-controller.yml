name: Load Flight Chess AI Controller
on:
  push:
    branches: [master]
    paths:
      - 'Html_tools/flight-chess-ai-controller-v1.js'
      - '.github/workflows/load-flight-chess-ai-controller.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Inject AI controller
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="Html_tools/flight-chess-ai-controller-v1\.js\?v=[^"]+"></script>','',s)
          tag='<script src="Html_tools/flight-chess-ai-controller-v1.js?v=20260913-flight-chess-ai-controller-v1.1-color-choice"></script>'
          s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Flight Chess color-select AI controller'
          git push origin master
