<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表格轉換</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=20260728-i18nstable1">
  <link rel="apple-touch-icon" href="../assets/favicon.svg?v=20260728-i18nstable1">
  <link rel="stylesheet" href="style.css?v=20260728-i18nstable1"></head><body class="tool-page tool-table"><header>
  <div class="wrap">
    <a class="return-home" href="../index.html">← 首页</a>
    <div class="brand"><div class="brand-copy"><h1>表格轉換</h1></div></div>
    <div class="page-actions"><a href="index.html">工具箱</a></div>
    <div class="header-actions"><select class="lang-select" aria-label="Language"><option value="zh-CN">简中</option><option value="zh-HK">繁中(HK)</option><option value="en">English</option></select><button class="theme-toggle" type="button" aria-label="切換主題"></button></div>
  </div>
</header><main class="wrap"><section class="panel"><label for="raw">貼上資料（支援逗號或 Tab 分隔）</label><textarea id="raw" placeholder="姓名,部門,金額&#10;小明,銷售,1200"></textarea><div class="row"><div><label for="delimiter">分隔符</label><select id="delimiter"><option value="auto">自動判斷</option><option value=",">逗號 CSV</option><option value="tab">Tab</option><option value=";">分號</option></select></div><div><label for="search">搜尋表格</label><input id="search" placeholder="輸入關鍵字"></div></div><div class="actions"><button id="build">產生表格</button><button id="download" class="secondary">下載 CSV</button><button id="copy" class="secondary">複製 TSV</button></div><div id="out" class="table-wrap"></div></section></main><script>
const $=id=>document.getElementById(id);let rows=[];function parseLine(s,d){let a=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++}else q=!q}else if(c===d&&!q){a.push(v);v=''}else v+=c}a.push(v);return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLowerCase(),show=rows.filter((r,i)=>i===0||r.join(' ').toLowerCase().includes(q));$('out').innerHTML=show.length?'<table><thead><tr>'+show[0].map(x=>`<th>${esc(x)}</th>`).join('')+'</tr></thead><tbody>'+show.slice(1).map(r=>'<tr>'+r.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>').join('')+'</tbody></table>':''}
$('build').onclick=()=>{let s=$('raw').value.trim();if(!s)return;let d=$('delimiter').value;if(d==='tab')d='\t';if(d==='auto')d=s.split('\n')[0].includes('\t')?'\t':',';rows=s.split(/\r?\n/).map(x=>parseLine(x,d));render()};$('search').oninput=render;
function csv(){return rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n')}$('download').onclick=()=>{if(!rows.length)return;let b=new Blob(['\ufeff'+csv()],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='table.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('copy').onclick=async()=>{await navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n'));};
</script><script src="theme.js?v=20260728-i18nstable1"></script><script src="i18n.js?v=20260728-i18nstable1"></script>
</body></html>
