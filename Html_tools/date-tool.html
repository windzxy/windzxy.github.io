<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日期計算</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=20260728-clean2">
  <link rel="apple-touch-icon" href="../assets/favicon.svg?v=20260728-clean2">
  <link rel="stylesheet" href="style.css?v=20260728-clean2"></head><body><header><div class="wrap"><div class="brand"><div class="brand-copy"><a class="back" href="index.html">← 工具箱</a><h1>日期計算</h1><p>日期差距與工作日期推算</p></div></div><button class="theme-toggle" type="button"></button></div></header><main class="wrap"><section class="panel"><h2>兩個日期相隔多久？</h2><div class="row"><div><label for="start">開始日期</label><input id="start" type="date"></div><div><label for="end">結束日期</label><input id="end" type="date"></div></div><button id="diff" style="margin-top:16px">計算間隔</button><div id="diffResult" class="result hidden"></div></section><section class="panel"><h2>推算日期</h2><div class="row"><div><label for="base">基準日期</label><input id="base" type="date"></div><div><label for="amount">天數</label><input id="amount" type="number" value="7"></div><div><label for="mode">計算方式</label><select id="mode"><option value="calendar">日曆天</option><option value="work">工作天（跳過週六日）</option></select></div></div><div class="actions"><button id="add">向後推算</button><button id="subtract" class="secondary">向前推算</button></div><div id="addResult" class="result hidden"></div></section></main><script>
const $=id=>document.getElementById(id),today=new Date(),iso=d=>{let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)},fmt=d=>new Intl.DateTimeFormat('zh-Hant',{dateStyle:'full'}).format(d);$('start').value=$('base').value=iso(today);$('end').value=iso(new Date(today.getTime()+86400000));
$('diff').onclick=()=>{let a=new Date($('start').value+'T00:00:00'),b=new Date($('end').value+'T00:00:00');if(isNaN(a)||isNaN(b))return;let n=Math.round((b-a)/86400000),r=$('diffResult');r.textContent=`相隔 ${Math.abs(n)} 天（${n<0?'結束日期較早':'結束日期較晚或相同'}）`;r.classList.remove('hidden')};
function calc(sign){let d=new Date($('base').value+'T00:00:00'),n=Math.abs(parseInt($('amount').value)||0),work=$('mode').value==='work',m=0;while(m<n){d.setDate(d.getDate()+sign);if(!work||![0,6].includes(d.getDay()))m++}let r=$('addResult');r.textContent=fmt(d);r.classList.remove('hidden')}$('add').onclick=()=>calc(1);$('subtract').onclick=()=>calc(-1);
</script><script src="theme.js?v=20260728-clean2"></script></body></html>
