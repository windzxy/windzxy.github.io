<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文字整理</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=20260728-desk2">
  <link rel="apple-touch-icon" href="../assets/favicon.svg?v=20260728-desk2">
  <link rel="stylesheet" href="style.css?v=20260728-desk2"></head><body class="tool-page tool-text"><header>
  <div class="wrap">
    <a class="return-home" href="../index.html">← 首页</a>
    <div class="brand"><div class="brand-copy"><h1>文字整理</h1></div></div>
    <div class="page-actions"><a href="index.html">工具箱</a></div>
    <div class="header-actions"><select class="lang-select" aria-label="Language"><option value="zh-CN">简中</option><option value="zh-HK">繁中(HK)</option><option value="en">English</option></select><button class="theme-toggle" type="button" aria-label="切換主題"></button></div>
  </div>
</header><main class="wrap"><section class="panel"><textarea id="text" placeholder="在此貼上文字…"></textarea><div class="grid" style="margin-top:14px"><div class="stat"><strong id="chars">0</strong>字元</div><div class="stat"><strong id="charsNoSpace">0</strong>不含空白</div><div class="stat"><strong id="words">0</strong>詞數</div><div class="stat"><strong id="lines">0</strong>行數</div></div><div class="actions"><button data-act="trim">清除首尾空白</button><button data-act="blank">移除空行</button><button data-act="dedupe">行去重</button><button data-act="sort">行排序</button><button data-act="upper">英文大寫</button><button data-act="lower">英文小寫</button><button data-act="title">首字母大寫</button><button id="copy" class="secondary">複製</button><button id="clear" class="secondary">清空</button></div></section><section class="panel translate-box"><h2>文字轉換</h2><div class="select-inline"><div><label for="targetLang">輸出語言</label><select id="targetLang"><option value="zh-CN">简体中文</option><option value="zh-HK">繁体中文（香港）</option><option value="en">英语</option></select></div></div><button id="translateBtn" type="button" style="margin-top:16px">轉換文字</button><textarea id="translateOutput" class="translate-output" readonly placeholder="轉換結果"></textarea><div class="copy-row"><button id="copyTranslate" class="secondary" type="button">複製結果</button></div><p class="mini-note">離線模式：支援簡繁互轉、常用辦公詞中英轉換與英文首字母大寫。</p></section></main><script>
const textInput=document.getElementById('text'),$=id=>document.getElementById(id);
const localText=s=>window.t?window.t(s):s;
function stats(){const s=textInput.value;$('chars').textContent=s.length;$('charsNoSpace').textContent=s.replace(/\s/g,'').length;$('words').textContent=(s.match(/[\p{L}\p{N}]+/gu)||[]).length;$('lines').textContent=s? s.split(/\r?\n/).length:0}
function titleCase(s){return s.toLowerCase().replace(/\b([a-z])/g,m=>m.toUpperCase())}
textInput.oninput=stats;
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let s=textInput.value,l=s.split(/\r?\n/);({trim:()=>s=l.map(x=>x.trim()).join('\n').trim(),blank:()=>s=l.filter(x=>x.trim()).join('\n'),dedupe:()=>s=[...new Set(l)].join('\n'),sort:()=>s=l.sort((a,b)=>a.localeCompare(b,'zh-Hant')).join('\n'),upper:()=>s=s.toUpperCase(),lower:()=>s=s.toLowerCase(),title:()=>s=titleCase(s)})[b.dataset.act]();textInput.value=s;stats()});
$('copy').onclick=async()=>{await navigator.clipboard.writeText(textInput.value);$('copy').textContent=localText('已複製');setTimeout(()=>$('copy').textContent=localText('複製'),1000)};
$('clear').onclick=()=>{textInput.value='';stats()};
stats();
</script><script>
function basicTranslate(text,target){
  const pairs=[
    ['圖片','图片','image'],['處理','处理','process'],['文字','文字','text'],['表格','表格','table'],['日期','日期','date'],['工具','工具','tool'],['首頁','首页','home'],['檔案','文件','file'],['文件','文件','document'],['複製','复制','copy'],['壓縮','压缩','compress'],['輸出','输出','output'],['預覽','预览','preview'],['選擇','选择','choose'],['支援','支持','support'],['識別','识别','recognize'],['翻譯','翻译','translate'],['转换','轉換','convert'],['轉換','转换','convert'],['結果','结果','result'],['格式化','格式化','format'],['驗證','验证','validate'],['排序','排序','sort'],['清空','清空','clear'],['下載','下载','download'],['背景','背景','background'],['去背','去背','remove background'],['放大','放大','upscale'],['品質','品质','quality'],['語言','语言','language'],['主題','主题','theme'],['搜尋','搜索','search'],['統計','统计','count'],['空白','空白','spaces'],['行數','行数','lines'],['詞數','词数','words'],['工作區','工作区','workspace'],['工具箱','工具箱','tools'],['圖片處理','图片处理','image tools'],['文字整理','文字整理','text tools'],['表格轉換','表格转换','table tools'],['日期計算','日期计算','date tools'],['JSON 工具','JSON 工具','JSON tools']
  ];
  let out=text;
  const hkToCn={'這':'这','裡':'里','個':'个','開':'开','啟':'启','後':'后','與':'与','為':'为','檔':'档','圖':'图','預':'预','覽':'览','選':'选','擇':'择','識':'识','別':'别','語':'语','題':'题','輯':'辑','寬':'宽','點':'点','擊':'击','處':'处','壓':'压','縮':'缩','質':'质','長':'长','邊':'边','無':'无','損':'损','關':'关','閉':'闭','強':'强','變':'变','複':'复','製':'制','轉':'转','換':'换','輸':'输','錯':'错','誤':'误','離':'离','線':'线','庫':'库','檢':'检','測':'测'};
  const cnToHk=Object.fromEntries(Object.entries(hkToCn).map(([k,v])=>[v,k]));
  if(target==='zh-CN')out=out.replace(/[\s\S]/g,ch=>hkToCn[ch]||ch);
  if(target==='zh-HK')out=out.replace(/[\s\S]/g,ch=>cnToHk[ch]||ch);
  for(const [hk,cn,en] of pairs){
    if(target==='zh-CN')out=out.replaceAll(hk,cn);
    if(target==='zh-HK')out=out.replaceAll(cn,hk);
    if(target==='en')out=out.replaceAll(hk,en).replaceAll(cn,en);
  }
  if(target==='en')out=out.replace(/\b([a-z])/g,m=>m.toUpperCase());
  return out;
}
function translateText(){
  const source=document.getElementById('text').value.trim();
  const target=document.getElementById('targetLang').value;
  const out=document.getElementById('translateOutput');
  if(!source){out.value=localText('未檢測到可轉換文字。');return;}
  const fallback=basicTranslate(source,target);
  out.value=fallback;
  const hint=document.querySelector('.translate-box .mini-note');
  if(hint)hint.textContent=localText(fallback===source?'離線詞庫沒有命中；已保留原文。':'已使用離線詞庫轉換。');
}
document.getElementById('translateBtn')?.addEventListener('click',translateText);
document.getElementById('copyTranslate')?.addEventListener('click',async()=>{const v=document.getElementById('translateOutput').value;if(v){await navigator.clipboard.writeText(v);}});
</script><script src="theme.js?v=20260728-desk2"></script><script src="i18n.js?v=20260728-desk2"></script>
</body></html>
