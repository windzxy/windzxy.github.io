<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="Wind AICG 原創視覺作品集。">
  <title>Wind AICG</title>
  <link rel="stylesheet" href="./assets/styles.css?v=1.1.0">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="site-header" id="top">
    <a class="brand" href="#featured" aria-label="Wind AICG 首頁">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span><b>WIND AICG</b><small>VISUAL GALLERY</small></span>
    </a>
    <nav class="main-nav" aria-label="主導航">
      <a href="#featured" data-i18n="navFeatured">焦點作品</a>
      <a href="#gallery" data-i18n="navGallery">作品集</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" id="favoriteJump" type="button" aria-label="查看收藏">
        <span>♡</span><em id="favoriteCount">0</em>
      </button>
      <button class="language-switch" id="languageSwitch" type="button" aria-label="切換語言">
        <b id="languageLabel">中文</b><span>/ EN</span>
      </button>
      <a class="back-desk" href="../" data-i18n="backDesk">返回 WebDesk</a>
    </div>
  </header>

  <main>
    <section class="hero" id="featured" aria-label="焦點作品">
      <div class="hero-media">
        <img id="heroImage" alt="" fetchpriority="high">
        <div class="hero-vignette"></div>
        <div class="hero-grid" aria-hidden="true"></div>
      </div>

      <aside class="series-rail" aria-label="作品選擇">
        <span class="rail-line"></span>
        <div id="seriesRail"></div>
      </aside>

      <div class="hero-copy">
        <div class="hero-kicker">
          <span id="heroIndex">01</span>
          <i></i>
          <span id="heroCategory"></span>
        </div>
        <h1 id="heroTitle"></h1>
        <p id="heroDescription"></p>
        <dl class="hero-meta">
          <div><dt data-i18n="metaDate">發佈</dt><dd id="heroDate"></dd></div>
        </dl>
        <div class="hero-actions">
          <button class="primary-action" id="openHero" type="button">
            <span data-i18n="viewWork">查看作品</span><b>↗</b>
          </button>
          <button class="ghost-action" id="favoriteHero" type="button">
            <span class="heart">♡</span><span data-i18n="favorite">收藏</span>
          </button>
        </div>
      </div>

      <div class="hero-footer">
        <div class="hero-progress"><i id="heroProgress"></i></div>
        <button id="heroPrev" type="button" aria-label="上一張">←</button>
        <span id="heroCounter">01 / 05</span>
        <button id="heroNext" type="button" aria-label="下一張">→</button>
      </div>

      <a class="scroll-cue" href="#gallery"><span data-i18n="scrollExplore">向下探索</span><i></i></a>
    </section>

    <section class="section gallery-section" id="gallery">
      <div class="section-head">
        <div>
          <span class="eyebrow">ORIGINAL WORKS</span>
          <h2 data-i18n="galleryTitle">視覺作品集</h2>
        </div>
        <p data-i18n="galleryIntro">持續更新的原創視覺作品。</p>
      </div>
      <div class="filter-row" id="filterRow" aria-label="作品分類"></div>
      <div class="gallery-grid" id="galleryGrid" aria-live="polite"></div>
      <div class="empty-state" id="emptyState" hidden>
        <span>◌</span><p data-i18n="emptyFavorites">目前還沒有收藏作品。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="brand compact" href="#top"><span class="brand-mark"><i></i><i></i><i></i></span><span><b>WIND AICG</b><small>VISUAL GALLERY</small></span></a>
    <p>Original visual works</p>
    <span id="currentYear"></span>
  </footer>

  <dialog class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="關閉">×</button>
    <div class="lightbox-media"><img id="lightboxImage" alt=""></div>
    <aside class="lightbox-copy">
      <span id="lightboxCategory"></span>
      <h2 id="lightboxTitle"></h2>
      <p id="lightboxDescription"></p>
      <dl>
        <div><dt data-i18n="metaDate">發佈</dt><dd id="lightboxDate"></dd></div>
      </dl>
      <button class="primary-action" id="lightboxFavorite" type="button"><span class="heart">♡</span><span data-i18n="favorite">收藏</span></button>
    </aside>
  </dialog>

  <script src="./assets/app.js?v=1.1.0" defer></script>
</body>
</html>
