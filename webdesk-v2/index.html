<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WebDesk V2</title>
  <meta name="description" content="WebDesk V2 clean architecture preview">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/ios-controls.css">
</head>
<body>
  <div id="app" class="wd-shell">
    <header class="wd-topbar">
      <div class="wd-brand">WebDesk <span>V2</span></div>
      <div class="wd-top-actions">
        <button class="wd-ios-button wd-ios-button-tinted" data-action="workspace">工作區</button>
        <button class="wd-ios-button wd-ios-button-tinted" data-action="library">功能中心</button>
      </div>
    </header>

    <main id="desktop" class="wd-desktop" aria-label="WebDesk V2 desktop"></main>
    <div id="windowLayer" class="wd-window-layer"></div>

    <nav id="quickDock" class="wd-dock" aria-label="快速工具"></nav>

    <aside id="drawer" class="wd-drawer" aria-hidden="true">
      <div class="wd-drawer-head">
        <div>
          <small>FUNCTION CENTER</small>
          <h2>功能中心</h2>
        </div>
        <button class="wd-ios-button wd-ios-button-icon wd-ios-button-secondary" data-action="close-drawer" aria-label="關閉功能中心">×</button>
      </div>
      <input id="toolSearch" class="wd-search" type="search" placeholder="搜尋工具">
      <div id="toolLibrary" class="wd-library"></div>
    </aside>

    <aside id="workspaceDrawer" class="wd-drawer wd-workspace-drawer" aria-hidden="true">
      <div class="wd-drawer-head">
        <div>
          <small>WORKSPACES</small>
          <h2>工作區</h2>
        </div>
        <button class="wd-ios-button wd-ios-button-icon wd-ios-button-secondary" data-action="close-workspace" aria-label="關閉工作區">×</button>
      </div>
      <div class="wd-workspace-actions">
        <button class="wd-ios-button wd-ios-button-tinted wd-ios-button-block" data-workspace-action="create">＋ 新增工作區</button>
      </div>
      <div id="workspaceList" class="wd-workspace-list"></div>
    </aside>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
